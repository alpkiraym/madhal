<style>
:root{
 --paper:#f6f1e6; --card:#fffdf8; --ink:#23272b; --muted:#6c6a63; --line:#e2d9c6; --line2:#efe8d9;
 --accent:#17594a; --accent-soft:#e3efe9; --accent2:#a3542a; --accent2-soft:#f6e6da; --gold:#b8913a;
 --good:#2e7a4c; --good-soft:#e2f2e7; --bad:#b23b3b; --bad-soft:#f8e3e1;
 --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'Source Sans 3','Segoe UI',system-ui,sans-serif; --arab:'Amiri','Traditional Arabic','Scheherazade New','Times New Roman',serif;
 --r:12px; --shadow:0 1px 2px rgba(60,45,20,.06),0 4px 14px rgba(60,45,20,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.ar{font-family:var(--arab);direction:rtl;unicode-bidi:isolate;font-size:1.2em;line-height:1.5;color:#3b2f22}
p.ar,div.ar{display:block;text-align:right;font-size:1.3em;margin:.4em 0}
.muted{color:var(--muted);font-size:.93em}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(246,241,230,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--arab);font-size:20px;line-height:1}
.brand b{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.1}
.nav{display:flex;gap:4px;background:var(--line2);padding:4px;border-radius:999px}
.nav a{text-decoration:none;color:var(--ink);padding:7px 16px;border-radius:999px;font-weight:600;font-size:15px}
.nav a.on{background:var(--card);box-shadow:var(--shadow);color:var(--accent)}

.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
h1,h2,h3,h4{font-family:var(--serif);letter-spacing:-.01em;line-height:1.25;color:#1d2226}
h1{font-size:clamp(30px,4vw,44px);font-weight:600;margin:.2em 0 .3em}
h2{font-size:26px;font-weight:600;margin:1.8em 0 .6em;padding-top:.4em;border-top:1px solid var(--line)}
h2:first-child{border-top:0;margin-top:.4em}
h3{font-size:20px;font-weight:600;margin:1.4em 0 .5em;color:var(--accent)}
h4{font-size:16.5px;font-weight:600;margin:0 0 .4em}
ul,ol{padding-left:1.3em}
li{margin:.25em 0}
blockquote{margin:1em 0;padding:.8em 1.1em;border-left:3px solid var(--gold);background:#fbf6ea;border-radius:0 8px 8px 0;font-style:italic;color:#4a4237}

/* Home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;margin:10px 0 36px}
.hero p.lead{font-size:19px;color:#4a4740;max-width:58ch}
.hero-ar{font-family:var(--arab);font-size:44px;color:var(--accent);direction:rtl;text-align:right;line-height:1.4;border-right:4px solid var(--gold);padding-right:20px}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:40px}
.entry a{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.entry a:hover{transform:translateY(-2px);border-color:var(--accent)}
.entry h3{margin:0 0 .3em;font-size:22px}
.entry p{margin:0;color:var(--muted)}
.entry .tag{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
.sec-title{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 14px}
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.u-card{display:flex;gap:14px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .15s}
.u-card:hover{border-color:var(--accent)}
.u-no{flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-family:var(--serif);font-weight:700;font-size:18px;display:grid;place-items:center}
.u-card.done .u-no{background:var(--accent);color:#fff}
.u-card b{display:block;font-size:16px;line-height:1.3}
.u-card .ar{font-size:1.02em;display:block;margin-top:2px;color:var(--muted)}
.u-card small{color:var(--good);font-weight:600}

/* Unit layout */
.unit{display:grid;grid-template-columns:270px 1fr;gap:36px;align-items:start}
.side{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;max-height:calc(100vh - 96px);overflow:auto}
.side a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.3}
.side a:hover{background:var(--line2)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .n{flex:none;width:26px;height:26px;border-radius:7px;background:var(--line2);display:grid;place-items:center;font-size:13px;font-weight:700}
.side a.on .n{background:var(--accent);color:#fff}
.side a .ok{margin-left:auto;color:var(--good);font-weight:700}
.side-sel{display:none}
.list-toggle{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 14px;font-weight:600;font-size:14.5px;margin-bottom:14px}
.list-toggle:hover{border-color:var(--accent);color:var(--accent)}
.list-toggle .ic{display:inline-block;transition:transform .2s}
.unit.closed .list-toggle .ic{transform:rotate(-90deg)}
.unit.closed{grid-template-columns:1fr!important}
.unit.closed .side,.unit.closed .strip,.unit.closed .strip-head{display:none!important}
.unit-wrap{max-width:1240px}
.strip{display:none;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.strip a{flex:none;scroll-snap-align:start;display:flex;gap:8px;align-items:center;max-width:220px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.25}
.strip a .n{flex:none;width:24px;height:24px;border-radius:7px;background:var(--line2);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.strip a.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.strip a.on .n{background:var(--accent);color:#fff}
.strip-head{display:none;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
article{max-width:800px;min-width:0}
.u-head{margin-bottom:10px}
.u-kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}
.u-head .ar{font-size:26px;color:var(--accent);display:block;text-align:left;direction:rtl;margin:0}
.u-lead{font-size:18.5px;color:#4a4740;border-left:3px solid var(--accent);padding:.2em 0 .2em 1em;margin:1em 0 1.6em}

/* Content components */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin:1em 0}
.box.key{background:#f1f6f2;border-color:#cfe1d6;border-left:4px solid var(--accent)}
.box.note{background:#fbf3ea;border-color:#ecd8c4;border-left:4px solid var(--accent2)}
.box ul,.box ol{margin:.4em 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:1em 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:1em 0}
.card-s{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card-s p{margin:.3em 0}
.card-s ul{margin:.3em 0}
table.t{width:100%;border-collapse:collapse;margin:1em 0;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);font-size:15.5px}
table.t th,table.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top;text-align:left}
table.t th{background:#efe8d8;font-weight:600;color:#3a3a33}
table.t tr:last-child td{border-bottom:0}
ol.steps{list-style:none;counter-reset:s;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 44px;margin:0;border-left:2px solid var(--line);margin-left:14px;padding-left:30px}
ol.steps li::before{content:counter(s);position:absolute;left:-15px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:1em 0 .6em}
.timeline div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:10px;font-size:14px;line-height:1.3}
.timeline b{display:block;font-family:var(--serif);font-size:22px;color:var(--accent2)}
.timeline small{color:var(--muted)}
.mezhep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 20px 12px;margin:1em 0}
.mezhep h3{margin-top:.8em}
.tree{margin:1em 0;text-align:center}
.tree .node{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:15px}
.tree .node small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tree .node.root{background:var(--accent);color:#fff;border-color:var(--accent)}
.tree .node.s{font-size:14px;background:#fbf6ea}
.tree .branch{display:flex;justify-content:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.tree .branch>div{display:flex;flex-direction:column;align-items:center}
.flow{font-weight:600;color:var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:9px;line-height:1.5}
.src-chip{display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.u-card .src{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.chips-list{display:flex;flex-wrap:wrap;gap:8px;margin:.6em 0}
.chips-list span{background:var(--accent-soft);color:var(--accent);padding:4px 11px;border-radius:999px;font-size:14px;font-weight:600}

/* Quiz */
.quiz-box{margin-top:44px;background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:22px 24px}
.quiz-box>h2{border:0;margin:0 0 4px;padding:0;color:var(--accent)}
.q{padding:16px 0;border-bottom:1px solid var(--line2)}
.q:last-of-type{border-bottom:0}
.q-text{font-weight:600;margin-bottom:10px}
.q-text .qn{color:var(--accent2);margin-right:6px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .l{flex:none;width:24px;height:24px;border-radius:6px;background:var(--line2);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.expl{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:15.5px;background:#f4f1ea}
.expl.ok{background:var(--good-soft)}
.expl.no{background:var(--bad-soft)}
.expl b{margin-right:4px}
.score-bar{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 16px;background:var(--accent-soft);border-radius:12px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;font-size:15.5px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--line2);color:var(--ink)}
.btn.warm{background:var(--accent2)}
.btn[disabled]{opacity:.45;cursor:default}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
.pager a{flex:1;max-width:48%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink)}
.pager a small{display:block;color:var(--muted)}
.pager a.next{text-align:right;margin-left:auto}

/* Exam center */
.ex-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;margin-bottom:22px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);text-decoration:none}
.mode:hover{border-color:var(--accent)}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode b{font-size:16.5px}
.mode span{color:var(--muted);font-size:14px;line-height:1.35}
.mode i{font-style:normal;font-size:22px}
.filter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:20px}
.filter>span{font-weight:600;font-size:14px;margin-right:6px;color:var(--muted)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.panel h2{border:0;padding:0;margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--accent)}
.prog{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;margin:14px 0 18px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.big-q{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.4;margin:0 0 18px}
.unit-tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent2);background:var(--accent2-soft);padding:2px 9px;border-radius:999px;margin-bottom:8px}
.result{text-align:center;padding:10px 0 18px}
.result .num{font-family:var(--serif);font-size:56px;font-weight:700;color:var(--accent);line-height:1}
.review{margin-top:18px}
.review .q{font-size:15.5px}

/* TF */
.tf{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line2)}
.tf:last-child{border-bottom:0}
.tf-btns{display:flex;gap:6px}
.tf-btns button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 14px;font-weight:700;min-width:62px}
.tf-btns button.right{background:var(--good);border-color:var(--good);color:#fff}
.tf-btns button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.tf .expl{grid-column:1/-1;margin-top:0}

/* Match */
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:14px;margin-top:16px}
.match .col{display:grid;gap:8px;align-content:start}
.m-item{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:15.5px;line-height:1.35;min-height:52px}
.m-item:hover:not([disabled]){border-color:var(--accent)}
.m-item .ar{font-size:1.05em;display:block;color:var(--muted)}
.m-item.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.m-item.done{border-color:var(--good);background:var(--good-soft);opacity:.75}
.m-item.err{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.stat{display:flex;gap:18px;font-weight:600;color:var(--muted)}
.stat b{color:var(--ink)}

/* Flashcards */
.fc-stage{perspective:1400px;margin:18px auto;max-width:640px}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.fc-face.back{transform:rotateY(180deg);background:#f3f8f5;border-color:#cfe1d6}
.fc-term{font-family:var(--serif);font-size:32px;font-weight:600;color:#1d2226}
.fc-ar{font-family:var(--arab);font-size:34px;color:var(--accent);direction:rtl;margin-top:6px}
.fc-def{font-size:19px;line-height:1.5;max-width:46ch}
.fc-hint{position:absolute;bottom:12px;font-size:13px;color:var(--muted)}
.fc-ctrl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* Interview */
.iv-q{font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.45;margin:6px 0 16px}
.case-text{background:#fbf6ea;border:1px solid #ecdfc6;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.case-text h4{color:var(--accent2)}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;background:#fff;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.keys{margin-top:16px;display:grid;gap:8px}
.kp{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:15.5px;line-height:1.4}
.kp input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px;flex:none}
.kp.on{border-color:var(--good);background:var(--good-soft)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;background:var(--line2);padding:6px 12px;border-radius:9px}

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');
const L='ABCDEFGH';
// storage
const store={get(k,d){try{const v=localStorage.getItem('medhal2:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('medhal2:'+k,JSON.stringify(v))}catch(e){}}};
const progress=store.get('progress',{});
/* Giray Akademi özeti (alt çubuk · Karnem) */
const MAD={test:'Test',dy:'Doğru–yanlış',eslestir:'Eşleştirme',kartlar:'Bilgi kartları',mulakat:'Mülakat',vaka:'Vaka analizi'};
function yerAdi(h){let m;if((m=h.match(/^unite-(\d+)$/)))return m[1]+'. ünite';if(h==='sinav')return 'Sınav merkezi';if((m=h.match(/^sinav-(\w+)$/)))return 'Sınav · '+(MAD[m[1]]||m[1]);return 'Ana sayfa'}
function ozet(aktif){if(typeof gaOzet!=='function')return;const n=Object.keys(progress).length,dy=store.get('dy',{d:0,y:0}),h=location.hash.slice(1)||'ana';gaOzet({bitti:n/UNITS.length,etiket:n+'/'+UNITS.length+' ünite testi',d:dy.d,y:dy.y,kart:store.get('known',[]).length,yer:{ad:yerAdi(h),url:'/madhal/#'+h},aktif:!!aktif})}
function say(ok){const dy=store.get('dy',{d:0,y:0});ok?dy.d++:dy.y++;store.set('dy',dy);ozet(true)}
function alt(b){if(typeof gaAltGizle==='function')gaAltGizle(b)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uName(n){const u=UNITS[n-1];return u?u.no+'. '+u.title:''}

// Exam question bank
const BANK=[];
UNITS.forEach(u=>u.quiz.forEach(q=>BANK.push(Object.assign({u:u.no},q))));
EXTRA_MCQ.forEach(q=>BANK.push(q));
BANK.forEach((q,i)=>q.id=i);
[TF,SB,TERMS,INTERVIEW,CASES].forEach(A=>A.forEach((x,i)=>x.id=i));
const B=(k,yer,bas)=>window.bldButton?window.bldButton(k,yer,bas):'';

function setNav(key){document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===key))}

/* ---------- HOME ---------- */
function home(){
 setNav('ana');
 const done=Object.keys(progress).length;
 app.innerHTML=`
 <section class="hero"><div>
  <div class="u-kicker">İslam Hukukuna Giriş · Ders Programı</div>
  <h1>Fıkıh İlmine Giriş</h1>
  <p class="lead">${UNITS.length} ünitelik konu anlatımı: İslam öncesi Araplardan şeriat ve fıkıha, fıkıh tarihinden mezheplere, mal, mülkiyet, şuf'a, akit ve ceza nazariyesine. Her ünitenin sonunda kısa bir test, ayrıca ayrı bir sınav merkezi.</p>
  <p class="muted">${done} / ${UNITS.length} ünite testi tamamlandı</p>
 </div><div class="hero-ar">المدخل لدراسة<br>الشريعة الإسلامية</div></section>
 <div class="entry">
  <a href="#unite-1"><span class="tag">Konu Anlatımı</span><h3>Ünitelerle öğren</h3><p>${UNITS.length} ünite, Arapça terimler, tablolar ve ünite sonu testleri.</p></a>
  <a href="#sinav"><span class="tag">Sınav Merkezi</span><h3>Kendini dene</h3><p>Test, doğru-yanlış, eşleştirme, bilgi kartları, mülakat ve vaka analizi.</p></a>
 </div>
 <div class="sec-title">Ders Taksimatı</div>
 <div class="units-grid">${UNITS.map(u=>{const p=progress[u.id];return `<a class="u-card ${p?'done':''}" href="#unite-${u.no}"><span class="u-no">${u.no}</span><span><b>${esc(u.title)}</b><span class="ar">${u.ar}</span>${p?`<small>Test: ${p.s}/${p.t}</small>`:''}</span></a>`}).join('')}</div>`;
}

/* ---------- UNIT ---------- */
function unit(n){
 setNav('unite');
 const u=UNITS[n-1]; if(!u){location.hash='#ana';return}
 const prev=UNITS[n-2], next=UNITS[n];
 const narrow=window.matchMedia('(max-width:760px)').matches;
 const saved=store.get('listOpen',null);
 const open=saved===null?!narrow:saved;
 app.innerHTML=`<div class="unit ${open?'':'closed'}" id="unitwrap">
 <div style="grid-column:1/-1"><button class="list-toggle" id="lt" aria-expanded="${open}"><span class="ic">▾</span><span id="ltx">${open?'Ünite listesini gizle':'Ünite listesini göster'}</span><span class="muted">(${UNITS.length})</span></button></div>
 <aside class="side">${UNITS.map(x=>`<a href="#unite-${x.no}" class="${x.no===n?'on':''}"><span class="n">${x.no}</span><span>${esc(x.title)}</span>${progress[x.id]?'<span class="ok">✓</span>':''}</a>`).join('')}</aside>
 <article>
  <nav class="strip" id="strip">${UNITS.map(x=>`<a href="#unite-${x.no}" class="${x.no===n?'on':''}"><span class="n">${x.no}</span><span>${esc(x.title)}</span>${progress[x.id]?' ✓':''}</a>`).join('')}</nav>
  <div class="u-head"><div class="u-kicker">Ünite ${u.no}</div><h1>${esc(u.title)}</h1><span class="ar">${u.ar}</span></div>
  <p class="u-lead">${esc(u.lead)}</p>
  ${u.html}
  <section class="quiz-box" id="quiz"><h2>Ünite Sonu Testi</h2><p class="muted">Bir seçeneğe tıkladığınızda cevap ve açıklama hemen görünür.</p><div id="qz"></div></section>
  <nav class="pager">${prev?`<a href="#unite-${prev.no}"><small>← Önceki ünite</small>${esc(prev.title)}</a>`:'<span></span>'}${next?`<a class="next" href="#unite-${next.no}"><small>Sonraki ünite →</small>${esc(next.title)}</a>`:`<a class="next" href="#sinav"><small>Bitti →</small>Sınav Merkezi</a>`}</nav>
 </article></div>`;
 app.querySelectorAll('article > h2').forEach((h,i)=>{h.classList.add('rep-h');h.insertAdjacentHTML('beforeend',B('u:'+u.no+':'+(i+1),'Ünite '+u.no+' · '+u.title,h.textContent))});
 renderUnitQuiz(u);
 window.scrollTo(0,0);
 $('#lt').onclick=()=>{const w=$('#unitwrap'); const o=w.classList.toggle('closed')?false:true; store.set('listOpen',o); $('#lt').setAttribute('aria-expanded',o); $('#ltx').textContent=o?'Ünite listesini gizle':'Ünite listesini göster'; if(o){const on=document.querySelector('#strip a.on'); if(on){const s=$('#strip'); s.scrollLeft=on.offsetLeft-s.offsetLeft-12;}}};
 const on=document.querySelector('#strip a.on'); if(on){const s=$('#strip'); s.scrollLeft=on.offsetLeft-s.offsetLeft-12;}
 const so=document.querySelector('.side a.on'); if(so&&so.scrollIntoView){const sd=document.querySelector('.side'); sd.scrollTop=so.offsetTop-sd.offsetTop-80;}
}
function renderUnitQuiz(u0){
 const u=Object.assign({},u0,{quiz:u0.quiz.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return Object.assign({},q,{o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)})})});
 const box=$('#qz'); let answered=0, score=0;
 box.innerHTML=u.quiz.map((q,i)=>`<div class="q" data-i="${i}"><div class="q-text"><span class="qn">${i+1}.</span>${esc(q.q)}${B('uq:'+u.no+':'+(i+1),'Ünite '+u.no+' sonu testi',q.q+' | Doğru cevap: '+q.o[q.a])}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="l">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`).join('')+`<div class="score-bar" id="sb" style="display:none"></div>`;
 box.querySelectorAll('.q').forEach(qe=>{
  const q=u.quiz[+qe.dataset.i];
  qe.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const j=+b.dataset.j, ok=j===q.a;
   qe.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.j===q.a)x.classList.add('right')});
   if(!ok)b.classList.add('wrong');
   qe.insertAdjacentHTML('beforeend',`<div class="expl ${ok?'ok':'no'}"><b>${ok?'Doğru.':'Yanlış.'}</b>${esc(q.e)}</div>`);
   answered++; if(ok)score++; say(ok);
   if(answered===u.quiz.length){
    const prevBest=progress[u.id]; if(!prevBest||score>=prevBest.s){progress[u.id]={s:score,t:u.quiz.length};store.set('progress',progress)}
    const sb=$('#sb'); sb.style.display='flex';
    sb.innerHTML=`<span>Sonuç: ${score} / ${u.quiz.length}</span><button class="btn ghost" id="again">Tekrar çöz</button>`;
    $('#again').onclick=()=>renderUnitQuiz(u0); ozet(true);
   }
  });
 });
}

/* ---------- EXAM CENTER ---------- */
const MODES=[
 {k:'test',i:'📝',t:'Test',d:'Çoktan seçmeli sorular, sonuç ve hata analizi'},
 {k:'dy',i:'⚖️',t:'Doğru – Yanlış',d:'Yargıları değerlendir; sahih-batıl akit alıştırması'},
 {k:'eslestir',i:'🔗',t:'Eşleştirme',d:'Kavramı tanımıyla eşleştir'},
 {k:'kartlar',i:'🗂️',t:'Bilgi Kartları',d:'Arapça terimler ve tanımlar'},
 {k:'mulakat',i:'🎙️',t:'Mülakat',d:'Sözlü sınav tarzı açık uçlu sorular'},
 {k:'vaka',i:'⚖',t:'Vaka Analizi',d:'Olay üzerinden hüküm verme'}
];
let exMode='test';
let unitFilter=new Set(store.get('filter',[]));
function inFilter(u){return unitFilter.size===0||unitFilter.has(u)}
function exam(mode){
 setNav('sinav');
 if(mode)exMode=mode;
 app.innerHTML=`<div class="ex-head"><div><div class="u-kicker">Sınav Merkezi</div><h1 style="margin:0">Kendini Dene</h1></div></div>
 <div class="modes">${MODES.map(m=>`<a class="mode ${m.k===exMode?'on':''}" href="#sinav-${m.k}"><i>${m.i}</i><b>${m.t}</b><span>${m.d}</span></a>`).join('')}</div>
 <div class="filter" id="flt"></div>
 <div id="ex"></div>`;
 renderFilter();
 runMode();
}
function renderFilter(){
 const f=$('#flt');
 f.innerHTML=`<span>Üniteler:</span><button class="chip ${unitFilter.size===0?'on':''}" data-u="0">Tümü</button>`+UNITS.map(u=>`<button class="chip ${unitFilter.has(u.no)?'on':''}" data-u="${u.no}" title="${esc(u.title)}">${u.no}</button>`).join('');
 f.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  const n=+c.dataset.u;
  if(n===0)unitFilter.clear(); else {unitFilter.has(n)?unitFilter.delete(n):unitFilter.add(n)}
  store.set('filter',[...unitFilter]); renderFilter(); runMode();
 });
}
function runMode(){({test:modeTest,dy:modeTF,eslestir:modeMatch,kartlar:modeCards,mulakat:()=>modeInterview(false),vaka:()=>modeInterview(true)})[exMode]()}
const fltLabel=()=>unitFilter.size===0?'Tüm üniteler':'Ünite '+[...unitFilter].sort((a,b)=>a-b).join(', ');

/* Test */
function modeTest(){
 const ex=$('#ex'); const pool=BANK.filter(q=>inFilter(q.u));
 let count=store.get('tcount',10);
 ex.innerHTML=`<div class="panel"><h2>Çoktan Seçmeli Test</h2><p class="muted">${fltLabel()} · havuzda ${pool.length} soru</p>
 <div class="row" style="margin:14px 0 18px"><span style="font-weight:600">Soru sayısı:</span><div class="seg" id="cnt">${[10,20,30,0].map(c=>`<button data-c="${c}" class="${c===count?'on':''}">${c||'Tümü'}</button>`).join('')}</div></div>
 <button class="btn" id="go" ${pool.length?'':'disabled'}>Teste başla</button></div>`;
 ex.querySelectorAll('#cnt button').forEach(b=>b.onclick=()=>{count=+b.dataset.c;store.set('tcount',count);ex.querySelectorAll('#cnt button').forEach(x=>x.classList.toggle('on',x===b))});
 $('#go').onclick=()=>{const qs=shuffle(pool).slice(0,count||pool.length).map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return Object.assign({},q,{o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)})});playTest(qs)};
}
function playTest(qs){
 const ex=$('#ex'); let i=0, score=0; const wrong=[];
 function show(){
  const q=qs[i];
  ex.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="muted">Soru ${i+1} / ${qs.length}</span><span class="muted">Doğru: ${score}</span></div>
  <div class="prog"><i style="width:${(i)/qs.length*100}%"></i></div>
  <span class="unit-tag">${esc(uName(q.u))}</span>
  <p class="big-q">${esc(q.q)}${B('t:'+q.id,'Sınav · Test · '+uName(q.u),q.q+' | Doğru cevap: '+q.o[q.a])}</p>
  <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="l">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="fb"></div></div>`;
  ex.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const j=+b.dataset.j, ok=j===q.a; if(ok)score++; else wrong.push({q,j}); say(ok);
   ex.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add('right')}); if(!ok)b.classList.add('wrong');
   $('#fb').innerHTML=`<div class="expl ${ok?'ok':'no'}"><b>${ok?'Doğru.':'Yanlış.'}</b>${esc(q.e)}</div><div style="margin-top:16px;text-align:right"><button class="btn" id="nx">${i+1<qs.length?'Sonraki soru →':'Sonucu gör'}</button></div>`;
   $('#nx').onclick=()=>{i++; i<qs.length?show():end()}; $('#nx').focus();
  });
  alt(true);
 }
 function end(){
  alt(false);
  const pct=Math.round(score/qs.length*100);
  ex.innerHTML=`<div class="panel"><div class="result"><div class="num">${score}/${qs.length}</div><p style="font-size:18px;margin:.4em 0">%${pct} başarı · ${pct>=85?'Çok iyi!':pct>=70?'İyi gidiyor.':pct>=50?'Biraz daha tekrar.':'Üniteleri yeniden gözden geçir.'}</p>
  <div class="row" style="justify-content:center"><button class="btn" id="re">Yeni test</button></div></div>
  ${wrong.length?`<div class="review"><h3>Yanlış cevaplanan sorular</h3>${wrong.map(w=>`<div class="q"><span class="unit-tag">${esc(uName(w.q.u))}</span><div class="q-text">${esc(w.q.q)}</div><div class="expl no"><b>Senin cevabın:</b>${esc(w.q.o[w.j])}</div><div class="expl ok" style="margin-top:6px"><b>Doğru cevap:</b>${esc(w.q.o[w.q.a])} — ${esc(w.q.e)}</div></div>`).join('')}</div>`:''}</div>`;
  $('#re').onclick=modeTest;
 }
 show();
}

/* True/False */
function modeTF(){
 const ex=$('#ex'); let sub=store.get('tfsub','dy');
 function draw(){
  const isSB=sub==='sb';
  const items=isSB?SB:TF.filter(x=>inFilter(x.u));
  const lab=isSB?['Sahih','Batıl']:['Doğru','Yanlış'];
  let sc=0,an=0;
  ex.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>${isSB?'Sahih mi, Batıl mı?':'Doğru – Yanlış'}</h2><div class="seg" id="sub"><button data-s="dy" class="${!isSB?'on':''}">Doğru – Yanlış</button><button data-s="sb" class="${isSB?'on':''}">Sahih – Batıl (2022)</button></div></div>
  <p class="muted">${isSB?'Muallak ve muzâf akit sîgalarını değerlendirin (2022 Medhal sınavı, 5. soru; Ünite 16). Ünite filtresi bu bölümde uygulanmaz.':fltLabel()+' · '+items.length+' yargı'}</p>
  <div id="tfl">${items.map((x,i)=>`<div class="tf" data-i="${i}"><div>${x.src?'<span class="unit-tag">'+x.src+'</span> ':''}${esc(x.s)}${B((isSB?'sb:':'dy:')+x.id,'Sınav · '+(isSB?'Sahih – Batıl':'Doğru – Yanlış')+(x.u?' · '+uName(x.u):''),x.s+' | Cevap: '+(x.a?lab[0]:lab[1]))}</div><div class="tf-btns"><button data-v="1">${lab[0]}</button><button data-v="0">${lab[1]}</button></div></div>`).join('')||'<p>Bu filtrede yargı yok.</p>'}</div>
  <div class="score-bar" id="tfs" style="display:none"></div></div>`;
  ex.querySelectorAll('#sub button').forEach(b=>b.onclick=()=>{sub=b.dataset.s;store.set('tfsub',sub);draw()});
  ex.querySelectorAll('.tf').forEach(r=>{const x=items[+r.dataset.i];r.querySelectorAll('button').forEach(b=>b.onclick=()=>{
   const v=b.dataset.v==='1', ok=v===x.a; an++; if(ok)sc++; say(ok);
   r.querySelectorAll('button').forEach(y=>{y.disabled=true; if((y.dataset.v==='1')===x.a)y.classList.add('right')}); if(!ok)b.classList.add('wrong');
   r.insertAdjacentHTML('beforeend',`<div class="expl ${ok?'ok':'no'}"><b>${x.a?lab[0]:lab[1]}.</b>${esc(x.e)}</div>`);
   const s=$('#tfs'); s.style.display='flex'; s.innerHTML=`<span>${sc} / ${an} doğru${an===items.length?' · tamamlandı':''}</span>${an===items.length?'<button class="btn ghost" id="tfr">Baştan</button>':''}`;
   if(an===items.length)$('#tfr').onclick=draw;
  })});
 }
 draw();
}

/* Matching */
function modeMatch(){
 const ex=$('#ex'); const pool=TERMS.filter(t=>inFilter(t.u));
 let round, picked=null, miss=0, matched=0, t0;
 function start(){
  round=shuffle(pool).slice(0,6); picked=null; miss=0; matched=0; t0=Date.now();
  const defs=shuffle(round.map((t,i)=>({i,d:t.d})));
  ex.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>Eşleştirme</h2><div class="stat"><span>Eşleşen: <b id="mm">0</b>/${round.length}</span><span>Hata: <b id="ms">0</b></span></div></div>
  <p class="muted">${fltLabel()} · Soldan bir kavram, sağdan tanımını seçin.</p>
  <div class="match"><div class="col">${round.map((t,i)=>`<button class="m-item" data-k="t" data-i="${i}"><b>${esc(t.t)}</b>${t.ar?`<span class="ar">${t.ar}</span>`:''}</button>`).join('')}</div>
  <div class="col">${defs.map(d=>`<button class="m-item" data-k="d" data-i="${d.i}">${esc(d.d)}</button>`).join('')}</div></div>
  <div id="mend"></div></div>`;
  ex.querySelectorAll('.m-item').forEach(b=>b.onclick=()=>click(b));
 }
 function click(b){
  if(b.classList.contains('done'))return;
  if(!picked||picked.dataset.k===b.dataset.k){ if(picked)picked.classList.remove('sel'); picked=b; b.classList.add('sel'); return }
  if(picked.dataset.i===b.dataset.i){[picked,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true}); matched++; $('#mm').textContent=matched; picked=null;
   if(matched===round.length){const s=Math.round((Date.now()-t0)/1000); $('#mend').innerHTML=`<div class="score-bar"><span>Tamamlandı · ${s} sn · ${miss} hata</span><button class="btn" id="mr">Yeni tur</button></div>`; $('#mr').onclick=start}
  } else { miss++; $('#ms').textContent=miss; const a=picked; [a,b].forEach(x=>{x.classList.remove('err');void x.offsetWidth;x.classList.add('err')}); setTimeout(()=>{a.classList.remove('err','sel');b.classList.remove('err')},450); picked=null }
 }
 if(pool.length<2){ex.innerHTML='<div class="panel"><p>Bu filtrede yeterli kavram yok.</p></div>';return}
 start();
}

/* Flashcards */
function modeCards(){
 const ex=$('#ex'); let deck=TERMS.filter(t=>inFilter(t.u)); let i=0; const known=new Set(store.get('known',[]));
 let onlyUnknown=false;
 function list(){return onlyUnknown?deck.filter(t=>!known.has(t.t)):deck}
 function draw(){
  const d=list(); if(i>=d.length)i=0;
  const c=d[i];
  ex.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>Bilgi Kartları</h2><span class="muted">${d.length?(i+1)+' / '+d.length:'0'} · bilinen: ${deck.filter(t=>known.has(t.t)).length}/${deck.length}</span></div>
  <div class="row" style="margin-top:8px"><label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ou" ${onlyUnknown?'checked':''} style="accent-color:var(--accent)"> Sadece bilmediklerim</label><button class="btn soft" id="sh">Karıştır</button></div>
  ${c?`<div class="fc-stage"><div class="fc" id="fc" tabindex="0" role="button" aria-label="Kartı çevir"><div class="fc-face"><span class="unit-tag">${esc(uName(c.u))}</span><div class="fc-term">${esc(c.t)}</div>${c.ar?`<div class="fc-ar">${c.ar}</div>`:''}<span class="fc-hint">Çevirmek için tıklayın · boşluk tuşu</span></div><div class="fc-face back"><div class="fc-def">${esc(c.d)}</div>${c.ar?`<div class="fc-ar" style="font-size:24px;margin-top:14px">${c.ar}</div>`:''}<span class="fc-hint">${known.has(c.t)?'✓ Biliyorum olarak işaretli':''}</span></div></div></div>
  <div style="text-align:center;margin-top:8px">${B('k:'+c.id,'Sınav · Bilgi kartı · '+uName(c.u),c.t+': '+c.d)}</div>
  <div class="fc-ctrl"><button class="btn soft" id="pv">← Önceki</button><button class="btn warm" id="no">Tekrar et</button><button class="btn" id="ok">Biliyorum</button><button class="btn soft" id="nx">Sonraki →</button></div>`:'<p style="padding:30px 0;text-align:center">Tüm kartları biliyorsun. 🎉</p>'}</div>`;
  $('#ou').onchange=e=>{onlyUnknown=e.target.checked;i=0;draw()};
  $('#sh').onclick=()=>{deck=shuffle(deck);i=0;draw()};
  if(!c)return;
  const fc=$('#fc'); fc.onclick=()=>fc.classList.toggle('flip');
  $('#pv').onclick=()=>{i=(i-1+d.length)%d.length;draw()};
  $('#nx').onclick=()=>{i=(i+1)%d.length;draw()};
  $('#ok').onclick=()=>{known.add(c.t);store.set('known',[...known]);if(!onlyUnknown)i=(i+1)%d.length;draw()};
  $('#no').onclick=()=>{known.delete(c.t);store.set('known',[...known]);i=(i+1)%d.length;draw()};
 }
 cardKeys=e=>{if(exMode!=='kartlar'||!$('#fc'))return; if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return; if(e.key===' '){e.preventDefault();$('#fc').classList.toggle('flip')} else if(e.key==='ArrowRight')$('#nx').click(); else if(e.key==='ArrowLeft')$('#pv').click()};
 if(!deck.length){ex.innerHTML='<div class="panel"><p>Bu filtrede kart yok.</p></div>';return}
 draw();
}
let cardKeys=null; document.addEventListener('keydown',e=>cardKeys&&cardKeys(e));

/* Interview & Cases */
let timerId=null;
function modeInterview(isCase){
 const ex=$('#ex'); const pool=(isCase?CASES:INTERVIEW).filter(x=>inFilter(x.u));
 if(!pool.length){ex.innerHTML='<div class="panel"><p>Bu filtrede soru yok.</p></div>';return}
 let order=shuffle(pool.map((_,i)=>i)), p=0;
 function draw(idx){
  if(timerId){clearInterval(timerId);timerId=null}
  const x=pool[idx];
  ex.innerHTML=`<div class="panel">
  <div class="row" style="justify-content:space-between"><h2>${isCase?'Vaka Analizi':'Mülakat'}</h2><div class="row"><span class="timer" id="tm">${isCase?'05:00':'03:00'}</span><button class="btn soft" id="ts">Süreyi başlat</button></div></div>
  <p class="muted">${fltLabel()} · ${pool.length} ${isCase?'vaka':'soru'} · Cevabınızı sesli verin ya da not alın, sonra cevap anahtarıyla karşılaştırın.</p>
  <span class="unit-tag">${esc(uName(x.u))}${x.src?' · '+x.src+' sınavı':''}</span>
  ${isCase?`<div class="case-text"><h4>${esc(x.title)}${B('v:'+x.id,'Sınav · Vaka · '+uName(x.u),x.title+': '+x.q)}</h4>${esc(x.q)}</div>`:`<p class="iv-q">${esc(x.q)}${B('m:'+x.id,'Sınav · Mülakat · '+uName(x.u),x.q)}</p>`}
  <textarea id="ta" placeholder="Cevabınızı veya anahtar noktaları buraya yazabilirsiniz..."></textarea>
  <div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn" id="sk">Cevap anahtarını göster</button><button class="btn ghost" id="nq">${isCase?'Başka vaka':'Rastgele yeni soru'} →</button></div>
  <div id="keys"></div>
  <details style="margin-top:22px"><summary>Tüm ${isCase?'vakalar':'sorular'} listesi</summary><div class="iv-list">${pool.map((y,j)=>`<button data-j="${j}">${y.u}. ünite · ${esc(isCase?y.title:y.q)}</button>`).join('')}</div></details>
  </div>`;
  const total=isCase?300:180; let left=total;
  $('#ts').onclick=()=>{ if(timerId){clearInterval(timerId);timerId=null;$('#ts').textContent='Devam';return}
   $('#ts').textContent='Durdur'; timerId=setInterval(()=>{left--; const a=Math.abs(left); const t=(left<0?'-':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0'); const el=$('#tm'); if(!el){clearInterval(timerId);return} el.textContent=t; el.classList.toggle('over',left<0)},1000)};
  $('#sk').onclick=()=>{
   $('#keys').innerHTML=`<h3 style="margin-top:20px">Cevap anahtarı</h3><p class="muted">Cevabınızda yer alan noktaları işaretleyin.</p><div class="keys">${x.k.map((k,j)=>`<label class="kp"><input type="checkbox" data-j="${j}"><span>${esc(k)}</span></label>`).join('')}</div><div class="score-bar" id="ks"><span>Kapsanan nokta: 0 / ${x.k.length}</span></div>`;
   $('#sk').disabled=true;
   ex.querySelectorAll('.kp input').forEach(c=>c.onchange=()=>{c.parentElement.classList.toggle('on',c.checked); const n=ex.querySelectorAll('.kp input:checked').length; const pct=Math.round(n/x.k.length*100); $('#ks').innerHTML=`<span>Kapsanan nokta: ${n} / ${x.k.length} · %${pct}</span><span class="muted">${pct>=80?'Tam puana yakın':pct>=50?'Orta':'Eksik'}</span>`});
  };
  $('#nq').onclick=()=>{p=(p+1)%order.length; if(p===0)order=shuffle(order); draw(order[p])};
  ex.querySelectorAll('.iv-list button').forEach(b=>b.onclick=()=>{draw(+b.dataset.j);window.scrollTo({top:$('#ex').offsetTop-80,behavior:'smooth'})});
 }
 draw(order[0]);
}

/* ---------- ROUTER ---------- */
function route(){
 if(timerId){clearInterval(timerId);timerId=null}
 cardKeys=null;
 const h=location.hash.slice(1)||'ana';
 let m;
 if((m=h.match(/^unite-(\d+)$/)))unit(+m[1]);
 else if(h==='sinav')exam();
 else if((m=h.match(/^sinav-(test|dy|eslestir|kartlar|mulakat|vaka)$/))){const keepScroll=document.querySelector('.modes'); exam(m[1]); if(keepScroll)window.scrollTo(0,0)}
 else home();
 if(!h.startsWith('sinav'))window.scrollTo(0,0);
 alt(false); ozet(false);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
