UNITS.push({
id:'u15', no:15, title:'Akdin Ayıpları ve İkrah', ar:'عيوب العقد والإكراه',
lead:'Rızayı sakatlayan galat, gabn, tağrir ve ikrahı; bunların akitlere etkisini ve ikrahın fiillere, ikrarlara ve tasarruflara etkisini öğreneceğiz.',
html:`
<p>Akdin in'ikadı sırasında akde ilişen ve iradeyi sakatlayan kusurlar akdin sonucunu etkiler. Bunun temel nedeni İslam hukukunda sözleşmelerde <b>rıza ilkesinin ağırlığı</b>dır. Akdin ayıpları aslında iç ve dış irade uyuşmazlığı konusunu ilgilendirir.</p>

<h2>1. Galat (yanılma) <span class="ar">الغلط</span></h2>
<p>Akdin mahallinin vasfı veya cinsi ile ilgili yanılgı; bilinseydi tarafları akitten vazgeçirecek hata. Satıcının dahli yoktur, alıcıyla ilgili bir ayıptır.</p>
<div class="grid2">
<div class="card-s"><h4>Vasfında</h4><p>Kırmızı yakut diye alınıyor ama sarı yakut; sağmal diye alınan ineğin sütü az.</p></div>
<div class="card-s"><h4>Cinsinde</h4><p>Yakut diye alınıyor cam çıkıyor; yün diye alınan kumaş pamuk.</p></div>
</div>
<table class="t">
<tr><th>Bâtınî galat <span class="ar">الغلط الباطني</span></th><th>Zâhirî galat <span class="ar">الغلط الظاهري</span></th></tr>
<tr><td>Zihinde bulunan ancak ifade edilmeyen yanılgı. Sergide duran bakır (sarı) yüzüğü altın sanıp bir şey demeden almak.<br><b>Hükmü:</b> İttifakla akde olumsuz etkisi yoktur.</td><td>Alıcının lafzen söylediği yanılgı. "Şu elması senden satın aldım" dediğinde satıcının malın cam olduğunu bildiği halde "sattım" demesi.<br><b>Hükmü:</b> (1) Cinsinde ise akit <b>batıl</b>dır. (2) Vasfında ise <b>mevkuf</b>tur; alıcı vasıf muhayyerliği ile akdi feshedebilir.</td></tr>
</table>
<div class="box note"><b>Not:</b> Ebû Hanîfe'ye göre (nikâh gibi akitlerde) zâhirî de olsa feshedilmez. Hanbelîlere göre nikâh bile olsa feshedilir ve kıza bir şey verilmez. Çoğunluğa göre feshe elverişli olmayan nikâh gibi akitlerde işlem geçerlidir.</div>

<h2>2. Gabn (aldanma) <span class="ar">الغبن</span></h2>
<p>Akdin konusunun piyasa değeri ile akit sırasında belirlenen değeri arasındaki fiyat farkı. Parayla ilgili bir ayıptır.</p>
<div class="grid2">
<div class="card-s"><h4>Yesîr</h4><p>Fiyatın piyasadaki alt sınır ile üst sınır arasında olması; piyasası 40-50 olan malı 48'e almak. İttifakla akde etkisi yoktur (müflis borçlu ve borçlu ölüm hastası hariç; onların akdi alacaklıların icazetine mevkuftur).</p></div>
<div class="card-s"><h4>Fâhiş</h4><p>Fiyatın piyasadaki limitlerin dışında olması. Mecelle oranları: menkulde %5 (1/20), hayvanda %10 (1/10), gayrimenkulde %20 (1/5).</p></div>
</div>
<p><b>Gabn-ı fâhişin hükmü fakihler arasında ihtilaflıdır:</b> (1) Akde tesiri vardır, akit geçerlidir ama aldanan kişinin feshetme hakkı vardır (mevkuf). (2) Akde tesiri yoktur, geçerlidir, fesih hakkı yoktur; çünkü akit lazımdır ve sorumluluk özensiz davranana aittir (Hanefîler).</p>
<div class="box key"><b>Notlar:</b><ul><li>Küçüklük, sefihlik ve delilik gibi <b>mahcurların</b>, beytülmal ve <b>vakıf</b> mallarında gabn-ı fâhişle akit ittifakla <b>batıl</b>dır.</li><li><b>Gabn-ı fâhiş ile tağrir birleşirse</b> ittifakla fesih yetkisi vardır. Tağrirle gabn-ı yesîr birleşirse ihtilaflıdır.</li></ul></div>

<h2>3. Tağrir (aldatma) <span class="ar">التغرير</span></h2>
<p>Gerçekte maslahatına olmadığı halde maslahatına olduğu düşüncesine sevk edecek hileli yöntemlerle kişiyi akde sevk etmek. <b>Tedlîs</b> de denir.</p>
<div class="grid2">
<div class="card-s"><h4>Fiilî tağrir</h4><p>Bir beyan olmadan akdin konusu hakkında yanıltıcı eylem: eski elbiseyi boyayıp yeni gibi satmak; hayvanı sağmayıp sütünü bol göstermek (<b>musarrât / tasriye</b>).</p></div>
<div class="card-s"><h4>Kavlî tağrir</h4><p>Taraflardan biri veya üçüncü şahsın sözlü olarak akdin mahalli hakkında yanıltıcı beyanda bulunması ("1000 lira verdiler, vermedim"); güvene dayalı satışlarda fiyat hakkında yanlış bilgi; neceş.</p></div>
</div>
<p><b>Hükmü:</b> Tek başına tağrir, akit sırasında tespit edilemeyen arzu edilen bir vasfın bulunmaması halinde vasıf muhayyerliği üzerinden akdi feshedilebilir kılar. Vasfın yokluğu akit sırasında açıkça görülebiliyorsa fesih olmaz.</p>

<h2>4. İkrah (zorlama) <span class="ar">الإكراه</span></h2>
<p>Yapabilecek kudrete sahip birinin bir başkasını haksızca ve korkutarak istemediği bir eyleme sevk etmesi.</p>
<div class="box"><b>Şartları:</b> (1) Mükrih (zorlayan) muktedir olacak; (2) mükreh (zorlanan) tehdidin hemen olacağına inanacak; (3) ikrah cana, uzva kasteden veya hapis, dövme gibi bir şey olacak; (4) ikrah, mükrehin zaten yaptığı bir şey olmayacak (alkolik birine içki içirmek ikrah sayılmaz).</div>
<div class="grid2">
<div class="card-s"><h4>Tam (ikrah-ı mülcî) <span class="ar">الإكراه الملجئ</span></h4><p>Öldürme veya vücut bütünlüğünü bozacak ölçüde zarar vermek. Şâfiî, Hanbelî ve bazı Hanefîlere göre büyük oranda malî zarar da mülcîdir.</p><p>Hanefîlere göre rızayı ortadan kaldırır, ihtiyarı fasit kılar; çoğunluğa göre ikisini birlikte kaldırır.</p></div>
<div class="card-s"><h4>Nâkıs (ikrah-ı gayr-ı mülcî)</h4><p>Dövme, hapsetme ve bağlama gibi tehditlerle yapılan zorlama. Rızayı ortadan kaldırsa da ihtiyarı fasit hale getirmez: <span class="ar">ينعدم الرضا ولكن لا يفسد الاختيار</span></p></div>
</div>
<p><b>Yakınlar üzerinden tehdit:</b> Hanefîlere göre eş ve kan hısımları; Hanbelîlere göre sadece çocuklar; Ca'ferîlere göre önem verilen herkes üzerinden yapılan tehdit ikrah sayılır.</p>

<h2>5. İkrahın Fıkhî Tasarruflara Etkisi</h2>
<table class="t">
<tr><th>Tasarruf</th><th>Hüküm</th></tr>
<tr><td><b>Mükrehin ikrarları</b></td><td>Her iki türünde de ikrah altında yapılan ikrarlar <b>geçersizdir</b>; çünkü ikrah yanlış olma ihtimalini öne çıkarır.</td></tr>
<tr><td><b>Feshe kabil olmayıp hezlden etkilenmeyen sözlü tasarruflar</b></td><td><b>Hanefîlere göre</b> talak, nikâh, ıtak, ric'at, yemin, nezir, zıhâr, îlâ (îlâdan rücû, muhâlaa, kısastan af) gibi tasarruflar her iki türde de ikrahtan etkilenmez, geçerlidir; Şâri bu işlemlerde lafzı yeterli görmüştür. <b>Cumhura göre</b> geçersizdir.</td></tr>
<tr><td><b>Feshe kabil olan tasarruflar</b> (satım, icâre, hibe)</td><td><b>Hanefîler:</b> Gayr-ı mülcî ise tüm tasarruflar geçerlidir; mülcî ise Ebû Hanîfe'ye göre hezlden etkilenen satımlar <b>fasit</b> doğar, Züfer'e göre <b>mevkuf</b>tur; ikrahtan sonraki icazet akdi baştan sahih kılar. <b>Cumhur:</b> Mülcî veya gayr-ı mülcî, feshe kabil olsun olmasın tüm ikrah çeşitlerinde tüm tasarruflar geçersizdir.</td></tr>
</table>
<p class="muted">Not: Fasit satımda Şâriin hakkı, ikrahta ise kul hakkı ihlal edilmiştir; icazetten önce itlaf veya geri dönülmez bir tasarrufa konu olursa kıymet lazım gelir.</p>

<h3>Mükrehin fiilleri</h3>
<p><b>Gayr-ı mülcîde</b> bütün fiillerinden sorumludur, cezai ehliyeti vardır. <b>Mülcîde</b> üç ihtimal vardır:</p>
<div class="grid3">
<div class="card-s"><h4>İşlenmesinin vacip olması</h4><p>Zaruret halinde bir kısım haramların ortadan kalkması: domuz eti yemek, şarap içmek. Yemeyip öldürülen günahkâr olur.</p></div>
<div class="card-s"><h4>İşlenmesinin ruhsat olması</h4><p>Namaz, oruç, ezan gibi dinin şiârı olan fiillerin yapılmaması (küfür sözü de böyledir). Azimeti yapmak daha efdaldir (sonu ölüm de olsa namaz kılmak).</p></div>
<div class="card-s"><h4>İşlenmesinin haram olması</h4><p>Kat'î naslarda açık yasak bulunan haramlar: hadler, kısas suçları, anne-babaya yaralayıcı darbe, Müslümana sövmek.</p></div>
</div>
<table class="t">
<tr><th>Kısas suçları</th><td>(1) Ebû Yûsuf: ikisine de yok (şüphe); (2) Züfer: mükrehe (zorlanana); (3) Tarafeyn (Ebû Hanîfe ve Muhammed): mükrihe (zorlayana).</td></tr>
<tr><th>Zina</th><td>Had uygulanmaz (şüphe).</td></tr>
<tr><th>Ridde</th><td>Kâfir olmaz, beynûnet (eşinden ayrılık) oluşmaz.</td></tr>
<tr><th>İman</th><td>Müslüman olur; fakat irtidat ederse had uygulanmaz (imanın sübutunda şüphe).</td></tr>
</table>
<p class="muted">Bazı özetlerde "ikisine de yok" görüşü Ebû Hanîfe'ye nispet edilir; ancak Ebû Hanîfe Tarafeyn içinde mükrihe kısas görüşündedir. Bu görüş Ebû Yûsuf'a aittir (81 sayfalık özet de böyle nakleder).</p>
`,

UNITS.push({
id:'u16', no:16, title:'Akdin Tasnifleri', ar:'أقسام العقود',
lead:'Akitleri hükmü, aynın teslimi, bedel, sîga ile hükmün ilişkisi, sonuçlarının doğma zamanı ve diğer ölçütlere göre sınıflandıracak; muallak ve muzâf akitlerle şart nazariyesini öğreneceğiz.',
html:`
<h2>1. Hükmü Bakımından Akitler</h2>
<div class="tree">
<div class="node root">Akit</div>
<div class="branch">
<div><div class="node">Gayr-ı sahih</div><div class="branch"><div><div class="node s">Batıl (gayr-ı mün'akid)</div></div><div><div class="node s">Fasit (mün'akid)</div></div></div></div>
<div><div class="node">Sahih</div><div class="branch"><div><div class="node s">Gayr-ı nâfiz (mevkuf)</div></div><div><div class="node s">Nâfiz</div><div class="branch"><div><div class="node s">Gayr-ı lâzım</div></div><div><div class="node s">Lâzım<small>li tarafeyn / li taraf</small></div></div></div></div></div></div>
</div></div>
<table class="t">
<tr><th>Akit</th><th>Tanım</th><th>Örnek</th></tr>
<tr><td><b>Batıl</b> <span class="ar">الباطل</span></td><td>Rükünlerinden en az biri eksik olan akit; hiçbir hukuki sonuç doğurmaz.</td><td>Gayr-ı mümeyyizin satım akdi; meyte ve domuzun satışı; mut'a nikâhı.</td></tr>
<tr><td><b>Fasit</b> <span class="ar">الفاسد</span></td><td>İn'ikad şartları (rükünleri) tam fakat sıhhat şartlarından biri eksik olan akit.</td><td>Satıcının iki ay daha kullanması şartıyla arabasını satması; nikâhta şahitlerin olmaması.</td></tr>
<tr><td><b>Sahih</b></td><td>Rükünleri ve sıhhat şartlarında eksiklik bulunmayan, fasit şart taşımayan akit.</td><td></td></tr>
<tr><td><b>Mevkuf (gayr-ı nâfiz)</b></td><td>Gayrın hakkı veya onayının taalluk ettiği akit.</td><td>Fuzûlînin akdi; mümeyyiz çocuğun satım veya icâre akdi.</td></tr>
<tr><td><b>Nâfiz</b></td><td>Kimsenin hakkı veya onayının taalluk etmediği akit.</td><td>Eda ehliyeti tam kişilerin satım akdi.</td></tr>
<tr><td><b>Gayr-ı lâzım</b></td><td>Muhayyerlik içeren veya taraflardan birinin dilediğinde feshedebildiği akit.</td><td>Vedia, âriye, vekâlet.</td></tr>
<tr><td><b>Lâzım</b></td><td>Muhayyerlik içermeyen; taraflardan biri karşılıklı rıza olmadan feshedemez.</td><td><b>Li tarafeyn:</b> bey', icâre (selem). <b>Li taraf:</b> rehin, kefalet (kefalette kefil açısından lazım, mekfûlün leh açısından gayr-ı lazım).</td></tr>
</table>
<div class="box key"><b>Fasit akitlerin hükümleri:</b><ol><li>Feshedilmelidir.</li><li>Fesat sebebi kalkarsa nâfiz olur.</li><li>Kabz ile mün'akid olur (mülkiyet ifade eder).</li><li>Muamelata hastır (batıl-fasit ayrımı Hanefîlerin muamelattaki ayrımıdır).</li><li>Nikâhta fesat sebebi kaldırılsa bile akit feshedilmelidir. Duhul varsa mehr-i misil, iddet ve çocuğun babaya nesebi sabit olur.</li></ol></div>
<p class="muted">Cumhur muamelatta batıl ile fasidi ayırmaz. Hanefîler esasa yönelik nehye butlan, mücavir vasfa yönelik nehye fesat müeyyidesi bağlar; bu yüzden fasit akit esası bakımından meşru, vasfı bakımından gayr-ı meşrudur.</p>
<p class="muted">Fesih bakımından: (a) iki taraf için lazım ve ikâle ile feshedilemeyen (nikâh; ancak talakla sona erer), (b) iki taraf için lazım ve ikâle ile feshedilebilen (satım, sulh, icâre), (c) tek taraf için lazım (rehin, kefalet), (d) iki taraf için gayr-ı lazım (ücretsiz vekâlet, vedia, âriyet).</p>

<h2>2. Hükmün Akdin Sîgasıyla İlişkisi</h2>
<table class="t"><tr><td><b>Havalenin hükmü</b></td><td>Deynin muhâl aleyhe intikali</td></tr><tr><td><b>Nikâhın hükmü</b></td><td>Çiftlerin faydalanması</td></tr><tr><td><b>Bey'in hükmü</b></td><td>Mülkiyetin intikali</td></tr></table>

<h2>3. Aynın Teslimi ile Tamamlanması Bakımından</h2>
<div class="grid2">
<div class="card-s"><h4>Aynî akitler</h4><p>Hukuken tamamlanması aynın teslimi ile olan akitler: <b>hibe, âriye, vedia, karz, rehin</b>. Teslim edilmedikçe taraflar icap-kabulle bağlı değildir; bu mevkuf olmak değil, akdin henüz bitmemesi demektir.</p></div>
<div class="card-s"><h4>Aynî olmayan akitler</h4><p>Sadece icap ve kabul ile tamamlanan akitler: satım, icâre.</p></div>
</div>
<p class="muted"><b>Şeklî – rızâî:</b> Nikâhta şahit ve ilan, gayrimenkul satışının tapuya tescili gibi şekil şartlarına bağlı akitler şeklîdir; İslam hukuku Roma hukuku gibi şekilci değildir, akitlerin çoğu rızâîdir. <b>İsimli – isimsiz:</b> Fıkıhta adı konmuş akitler isimlidir; çoğunluk fakih, akit hürriyeti gereği mükelleflerin isimli akitlerle bağlı olmadığını kabul eder.</p>

<h2>4. Bedelli Olup Olmaması Bakımından</h2>
<table class="t">
<tr><th>İvazlı (bedelli)</th><th>Teberru</th><th>Başlangıcı teberru, sonu bedelli</th></tr>
<tr><td>Her iki taraftan bir bedel karşılığı yapılan akitler: satım, icâre. Batıl-fasit ayrımı bunlarda geçerlidir.</td><td>Yardımlaşma-iyilik esasına dayalı, tek yönlü bedel karşılığı yapılan akitler: hibe, âriye, vedia. <b>Teberru ehliyeti ergenlikle gerçekleşir.</b> Fasit şartlardan etkilenmezler; batıl ve fasit aynı sonucu doğurur.</td><td>Teberru ehliyeti olmayanlar bu akitleri yapamaz: <b>karz</b>, <b>borçlunun onayı ile kefalet</b>, <b>bedel şartıyla hibe</b>. Bedel şartlı hibede ayıp ve şuf'a hükümleri uygulanır.</td></tr>
</table>

<h2>5. Tazmin Bakımından</h2>
<table class="t">
<tr><th>Damân (tazmin) akitleri</th><td>Malın helakinde kusur aranmaksızın misli veya kıymeti ödenir: satım, karz, kısmet, mal üzerine sulh.</td></tr>
<tr><th>Emanet akitleri</th><td>Teaddî veya taksir yoksa sorumluluk doğmaz: vedia, âriyet, şirket, vekâlet, vesayet.</td></tr>
<tr><th>Çift karakterli</th><td><b>İcâre</b> (kiralanan mal emanet), <b>rehin</b> (borç miktarı kadar tazmin, fazlası emanet).</td></tr>
</table>
<p class="muted">Genel ölçü: Karşılıklı bedellilik doğan yerde tazmin, doğmayan yerde emanet hükümleri uygulanır.</p>

<h2>6. Gayeleri, Sürekliliği ve Bağımsızlığı Bakımından</h2>
<table class="t">
<tr><th>Gaye</th><td><b>Temlik</b> (satım, icâre, hibe, âriyet, vasiyet, vakıf) · <b>Ortaklık</b> (şirket, mudârebe, müzâraa, müsâkât) · <b>Teminat/tevsik</b> (rehin, kefalet, havale) · <b>Temsil ve yetkilendirme</b> (vekâlet, vesayet) · <b>Koruma</b> (vedia) · <b>Iskat</b> (talak, ıtak)</td></tr>
<tr><th>Süreklilik</th><td><b>Fevrî:</b> Kısa sürede ifa edilen (satım, karz, hibe, sulh); fesih geriye doğru yürür. <b>İstimrârî:</b> Zamana yayılan (icâre, âriyet, şirket, vekâlet, abonelik); fesih geriye yürümez, bedel parça parça doğar.</td></tr>
<tr><th>Bağımsızlık</th><td><b>Aslî/müstakil:</b> satım, icâre, vedia. <b>Tebeî:</b> Başka bir hakka bağlı olan rehin, kefalet, havale; asıl hak kalkınca o da kalkar.</td></tr>
</table>

<h2>7. Sîgasıyla Birlikte Sonuçlarının Doğup Doğmaması Bakımından</h2>
<div class="grid3">
<div class="card-s"><h4>Müneccez <span class="ar">المنجز</span></h4><p>Gelecek zamana izafe edilmemiş, şarta bağlanmamış, sîga beyanından hemen sonra geçerli olan akit. Hibe, karz, âriye gibi aynî akitler kabzdan sonra müneccez olur.</p></div>
<div class="card-s"><h4>Muzâf <span class="ar">المضاف</span></h4><p>Gelecek zamana izafe edilerek kurulmuş akit: iki ay sonra başlayacak icâre.</p><ol><li><b>Tabiatı gereği muzâf:</b> vasiyet, vesâyet (babanın ölümüne bağlı).</li><li><b>İzafe kabul etmeyen:</b> temlikat olan nikâh, bey', hibe.</li><li><b>İzafe kabul eden:</b> icâre, kefalet, havale, talak, ıtak, vakıf, vekâlet.</li></ol><p class="muted">Talak "inşallah" sözüne bağlanırsa Hanefî ve Şâfiîlere göre geçersizdir. Talak izafe edilirse çoğunluğa göre zamanı gelince, Mâlikîlere göre hemen gerçekleşir.</p></div>
<div class="card-s"><h4>Muallak <span class="ar">المعلق</span></h4><p>Varlığı başka bir şeyin varlığına bağlanmış akit. Şarta bağlamanın sahih olması için: (1) şart akit anında <b>mevcut olmamalı</b> (aksi halde müneccez); (2) gelecekte <b>mümkün olmalı</b> (aksi halde batıl).</p></div>
</div>
<table class="t">
<tr><th>Şarta bağlanamayan akitler</th><td>Ayn veya menfaatin ivazlı-ivazsız temlikini konu alan akitler: satım, kira, karz, hibe, âriye — <span class="ar">التمليك لا يقبل التعليق</span>. Nikâh talik kabul etmez; açıklık ilkesi önemlidir. Talike bağlı ikrar ve temlik yönü ağır basan ibrâ da geçersizdir.</td></tr>
<tr><th>Her türlü şarta bağlanabilen</th><td>Iskat ve tefvîz gayeli akitler: vekâlet, vesayet, ıskatlar (talak, ıtak); vasiyet.</td></tr>
<tr><th>Sadece mülâim şartlara bağlanabilen</th><td>Akdin tabiatıyla çelişmeyen veya örfte uygulanan şartlara: kefalet, havale. "Yağmur yağarsa kefilim" geçersiz; "A'ya karz verirsen o miktara kefilim" geçerli.</td></tr>
</table>

<h2>8. Şart Nazariyesi (tamamlayıcı)</h2>
<table class="t">
<tr><td><b>Daraltanlar (Zâhirîler)</b></td><td>Kitap, Sünnet veya icmanın cevaz vermediği hiçbir şart geçerli değildir: "Allah'ın Kitabında olmayan şart merduttur."</td></tr>
<tr><td><b>Genişletenler (İbn Teymiyye, İbnü'l-Kayyim)</b></td><td>Açık nas ile yasaklanmadıkça her şart caizdir; akitlerde asıl rızadır. Satıcı evini bir yıl içinde oturmak şartıyla satabilir.</td></tr>
<tr><td><b>Orta yol (Hanefîler)</b></td><td><b>Sahih şart:</b> akdin gereği veya onu kuvvetlendiren, şer'in izin verdiği ya da örfte olan (kefil istemek, hıyâr-ı şart). <b>Fasit şart:</b> bir tarafa menfaat sağlayan (bir yıl oturma şartıyla satış); bedelli akdi fasit kılar, teberru ve nikâhta lağv olur. <b>Batıl şart:</b> kimseye faydası olmayan; şart yok sayılır, akit sahihtir.</td></tr>
</table>
`,

UNITS.push({
id:'u17', no:17, title:'Muhayyerlikler', ar:'الخيارات',
lead:'Şart, tayin, görme ve ayıp muhayyerliklerinin tanımlarını, delillerini, şartlarını, akde etkilerini ve sona erme sebeplerini; ayrıca akdin sona erme yollarını öğreneceğiz.',
html:`
<p><b>Muhayyerlik:</b> Lehine muhayyerlik sabit olan tarafın, diğer tarafın rızasına bakmaksızın akdi feshedebilme yetkisi. Kaynağı bakımından:</p>
<div class="grid2"><div class="card-s"><h4>Kaynağı şeriat olanlar</h4><p>Görme, ayıp (Hanefîlere göre zımni şart), gabn ve tağrir, meclis, rücû, safkanın bölünmesi.</p></div><div class="card-s"><h4>Kaynağı tarafların iradesi olanlar</h4><p>Şart, tayin, nakd muhayyerlikleri; şart koşulmadıkça sabit olmaz.</p></div></div>

<h2>1. Şart Muhayyerliği <span class="ar">خيار الشرط</span></h2>
<div class="box key">Satım akdinde muayyen bir süre zarfında akdi feshetme veya sürdürme muhayyerliğine sahip olmak.</div>
<ul><li>Sünnetle, <b>istihsanen</b> sabittir (satımın icap-kabulle lazım olması kuralına aykırıdır).</li><li>İlgili taraf veya taraflar bakımından akdi <b>gayr-ı lazım</b> hale getirir. Satıcı, müşteri, ikisi veya üçüncü kişi lehine kurulabilir.</li></ul>
<div class="grid2">
<div class="card-s"><h4>Delilleri</h4><ol><li><b>Habbân b. Münkız</b> hadisi (Buhârî, Müslim)</li><li><b>Enes b. Malik</b> hadisi (dört gün şartla alınan deve; Efendimiz'in üç güne düşürmesi)</li><li><b>İbn Ömer</b> rivayeti (iki aya kadar muhayyerlik)</li></ol></div>
<div class="card-s"><h4>Elverişli olanlar</h4><p>Satım ve kira gibi feshedilmeye elverişli akitlerde geçerlidir; nikâh, talak gibi feshe açık olmayanlarda ve vedia gibi gayr-ı lazım akitlerde değil.</p></div>
</div>
<table class="t"><tr><th colspan="2">Şart muhayyerliği türleri</th></tr>
<tr><td><b>Akdi fasit kılan şartlar</b></td><td>(1) Sürenin mutlak bırakılması, (2) ebedî olması, (3) belirsiz bir şarta bağlanması ("rüzgârın esmesine kadar"). Üç gün dolmadan düzeltilirse akit sahih olur.</td></tr>
<tr><td><b>Sahih kabul edilenler: süresi belli olanlar</b></td><td><b>Ebû Hanîfe, Züfer, Şâfiî:</b> en çok 3 gün. <b>İmameyn, Hanbelî, Mecelle:</b> ihtiyaca bağlı muayyen süre. <b>Mâlik:</b> mebîin durumuna bağlı muayyen süre.</td></tr></table>
<p><b>Sona ermesi:</b> (1) Sarahaten veya delaleten icazet ya da fesih; (2) mebî müşteri elindeyken ayıplı hale gelmesi veya helaki; (3) sürenin sona ermesi; (4) muhayyer tarafın vefatı (Hanefî ve Hanbelîlerde miras kalmaz; Şâfiî, Mâlikî ve Ca'ferîlere göre varise geçer). Ayrıca: mebîde kabzdan sonra bitişik veya ayrı artış.</p>

<h2>2. Tayin Muhayyerliği <span class="ar">خيار التعيين</span></h2>
<div class="box key">Satım akdinde ve bedelli hibe gibi aynın temlikini ifade eden bedelli işlemlerde, bedelleri ve sıfatları malum en fazla üç mebîden birini seçme hakkı.</div>
<ul><li>Hanefî ve Mâlikîlere göre geçerlidir; Şâfiî, Ahmed ve Züfer'e göre mebîdeki bilinmezlik sebebiyle caiz değildir.</li><li><b>İttifakla mirasa konu olur</b> (mülkiyetin ayrıştırılması zorunluluğu).</li><li>Ebû Hanîfe'ye göre 3 gün, İmameyn'e göre muayyen olması yeterlidir.</li></ul>
<div class="grid2"><div class="card-s"><h4>Sıhhat şartları</h4><ol><li>En fazla üç şey arasında olacak.</li><li>Birbirinden farklı olacak.</li><li>Fiyatları ve sıfatları malum olacak.</li><li>Süresi belli olacak.</li></ol></div><div class="card-s"><h4>Sona erdiren sebepler</h4><ol><li>Doğrudan veya dolaylı olarak tercih.</li><li>Müşterinin kabzından sonra birinin helaki (helak olan mahal olarak belirlenir).</li><li>Kabzdan sonra birinin ayıplanması.</li></ol></div></div>

<h2>3. Görme (Ru'yet) Muhayyerliği <span class="ar">خيار الرؤية</span></h2>
<div class="box key">Görmeden alınan bir malın görüldükten sonra akdi feshetme veya sürdürme yetkisi. Görmeden maksat, mal hakkında bilgidir (yiyecekte tatmak gibi).</div>
<ul><li>Ebû Hureyre, İbn Abbas ve Osman rivayetleri ve şart muhayyerliğine benzetilerek istihsanen sabittir: <span class="ar">من اشترى شيئاً لم يره فهو بالخيار إذا رآه</span></li><li><b>İmam Şâfiî kabul etmez</b> (görülmeyen malın satışı caiz değildir).</li><li>Akdin nefazına engel değildir; hak sahibi tarafından işlem gayr-ı lazımdır.</li><li>Hak sahibi olsa bile görmeden önce bu muhayyerlik düşürülemez (doğmamış hak ıskat edilmez). Süre sınırı yoktur.</li><li>Bey' ve icâre gibi feshe kabil akitlerde, <b>alıcı lehine</b> sabittir.</li></ul>
<div class="grid2"><div class="card-s"><h4>Sabit olmasının şartları</h4><ol><li>Mebî ve semen tayin ile muayyen hale gelebilmeli (selemde yoktur).</li><li>Vasıflar anlatılsa bile görme muhayyerliği devam eder (selem hariç, çünkü orada rıza var).</li><li>Müşteri daha önce görmemiş olmalı.</li><li>Feshe kabil olmalı.</li></ol></div><div class="card-s"><h4>Sona erdiren sebepler</h4><ol><li>Gördükten sonraki açık veya dolaylı rıza (tasarrufta bulunmak).</li><li>Müşterinin ölmesi (miras kalmaz).</li><li>Ortakların aldığı malda birinin gördükten sonra onayı.</li><li>Helak ve kusurlu hale gelmesi.</li><li>Gördükten sonra akdi feshetme.</li></ol></div></div>

<h2>4. Ayıp Muhayyerliği <span class="ar">خيار العيب</span></h2>
<div class="box key">Satış bedelini menfi yönde etkileyen ve müşterinin bilmesi halinde almaktan vazgeçeceği bir kusurun bulunması halinde meydana gelen muhayyerlik.</div>
<ul><li>Ru'yet muhayyerliğinin gerçekleştiği yerlerde gerçekleşir; muhayyer taraf için akit gayr-ı lazımdır.</li><li>Fesih için karşı tarafın rızası aranmaz fakat haber edilmelidir.</li><li><b>Şâfiî ve Hanbelîlere göre</b> fesih beyanında bulunması yeterlidir.</li><li><b>Hanefîlere göre</b> mal kabzından sonra olursa ya karşılıklı rıza ya da hâkim ile feshedilir (rıza ile fesih taraflar için fesih, üçüncü kişiler için yeni satış sayılır).</li><li>Örfün belirlediği süre geçerlidir.</li><li>Satıcı hiçbir ayıptan sorumlu olmama şartını koşarsa Hanefîlere göre muhayyerlik ortadan kalkar (şartu'l-berâe).</li><li><b>İttifakla mirasa konu olur.</b></li><li>Mislî mallarda ayıp çıkarsa ya tamamı iade edilir ya da akit sırasındaki bedelle tümüyle kabul edilir.</li></ul>
<div class="grid2"><div class="card-s"><h4>Sübutu için aranan şartlar</h4><ol><li>Kıymetini azaltacak bir eksiklik olacak.</li><li>Ayıbın akit öncesi olduğunun ispatı.</li><li>Ayıp devam ediyor olacak.</li><li>Müşterinin teslime kadar ayıptan haberinin olmaması.</li><li>Öğrendikten sonra rıza olmamalı.</li><li>Bâyi, tamamen ayıptan sorumlu olmamayı şart koşmamalı.</li></ol></div><div class="card-s"><h4>Sona ermesi</h4><ol><li>Muhayyerlik kullanılıp mebîin iadesi.</li><li>Mebîde iadeyi engelleyen artışın olması.</li><li>Mebîde iadeyi engelleyen değişiklik olması.</li><li>Mebîde üçüncü bir şahsın hakkının doğması.</li></ol><p><b>Son üç maddede aradaki farkı talep hakkı doğar.</b></p></div></div>
<div class="box note"><b>Şartu'l-berâe</b> <span class="ar">شرط البراءة من كل عيب</span>: Satıcının bilsin bilmesin hiçbir ayıptan sorumluluk kabul etmeyeceğini şart koşması. Hanefîlere göre hem şart hem akit geçerlidir (ibrâ esasen ıskattır, ıskatta cehalet zarar vermez). Şâfiî'den iki rivayet vardır; gerekçe: ibrâ bir temliktir, meçhulün temliki sahih değildir.</div>
<p class="muted">Mebîdeki artışlar: muttasıl-mütevellid artış iadeye engel değildir; muttasıl gayr-ı mütevellid ve munfasıl mütevellid artış iadeye engeldir (değer farkı istenir); munfasıl gayr-ı mütevellid artış engel değildir, artış müşteride kalır.</p>

<h2>5. Akdin Sona Ermesi (tamamlayıcı)</h2>
<table class="t">
<tr><td><b>İfa</b></td><td>Karşılıklı borçların yerine getirilmesi; en tabii yol.</td></tr>
<tr><td><b>Fesih ve infisah</b></td><td>Fasit akdin feshi; konunun helakiyle kendiliğinden çözülme.</td></tr>
<tr><td><b>İptal</b></td><td>Batıl akit hukuken doğmadığı için sona ermesinden söz edilmez.</td></tr>
<tr><td><b>Tek taraflı irade</b></td><td>Gayr-ı lazım akitlerde (kefalet, rehin, vedia, âriyet, vekâlet, karz, hibe).</td></tr>
<tr><td><b>Muhayyerlik</b></td><td>Kusur veya muhayyerlik sebebiyle fesih.</td></tr>
<tr><td><b>İkâle</b> <span class="ar">الإقالة</span></td><td>Sağlam akdin karşılıklı rızayla bozulması; satım, kira, sulhte olur; nikâh, talak, ıtakta olmaz.</td></tr>
<tr><td><b>Hapis</b></td><td>Karşı taraf ifa edene kadar malı veya bedeli elde tutma hakkı.</td></tr>
</table>

UNITS.push({
id:'u18', no:18, title:'Ceza Nazariyesi', ar:'نظرية العقوبة',
lead:'Suç ve ceza kavramlarını, cezanın amacı ve temel ilkelerini, kısas ve diyet, had, devlet aleyhine işlenen suçlar ve ta\'zîr cezalarını öğreneceğiz.',
html:`
<h2>1. Suç ve Ceza</h2>
<div class="grid2">
<div class="card-s"><h4>Suç <span class="ar">الجريمة</span></h4><p>Zarûrât-ı hamseyi tehdit eden, Allah'ın had veya ta'zir ile yasakladığı eylemler. <span class="ar">محظورات شرعية زجر الله عنها بحدٍّ أو تعزير</span></p></div>
<div class="card-s"><h4>Ceza <span class="ar">العقوبة</span></h4><p>Zarûrât-ı hamsenin, yani maslahatların muhafazası için Şâriin koyduğu müeyyideler. İslam'ın korumak istediği değerler: din, can, akıl, nesil (ırz) ve mal.</p></div>
</div>
<p><b>Cezanın amacı:</b> Adalet temelli cezanın olmayışı yeryüzünde karışıklık ve toplum düzeninde bozukluk meydana getirir; dolayısıyla amaç toplum maslahatını muhafaza etmektir. Her cezada iki temel gaye vardır: <b>suçlunun te'dibi</b> ve <b>diğer insanların zecri</b> (caydırılması). Ceza mahiyeti itibarıyla kötülüktür ama toplumun yararı için konmuştur.</p>
<h3>Bir şeyin suç olmasının şartları (unsurlar)</h3>
<ol><li><b>Kanunilik:</b> Kanunda (nasta) suç olacak.</li><li><b>Maddî unsur:</b> Hayalde kalmayacak, fiile dökülecek.</li><li><b>Hukuka aykırılık:</b> Nefsi müdafaa, zaruret olmayacak.</li><li><b>Manevî unsur:</b> Cezai ehliyet ve kasıt.</li></ol>
<div class="grid2">
<div class="card-s"><h4>Hukûkullah</h4><p>Toplumun hak ve menfaati. Zina, şürb, kazf, sirkat ve yol kesme hadleri. Sirkat ve yol kesmede kul hakkı olsa da Allah hakkı ağır basar.</p></div>
<div class="card-s"><h4>Hukûku'l-ibâd</h4><p>Şahsi haklar: adam öldürme, müessir fiil. Kul hakkının ihlalinde helallik dilenmeden fiilin hukuka aykırılığı ortadan kalkmaz.</p></div>
</div>

<h3>Cezayı düşüren sebepler</h3>
<ol><li>Suçlunun ölümü</li><li>Af</li><li>Suçtan vazgeçme ve gerçek nedâmet</li><li>Zamanaşımı (cumhur kabul etmez; zina ve sirkatte Ebû Hanîfe 1 yıl, İmameyn 1 ay der)</li><li>Sulh</li><li>Kısasta tevârüs (kısas hakkının katile mirasla geçmesi)</li></ol>

<h3>Cezanın temel ilkeleri</h3>
<div class="chips-list"><span>1. Şahsîlik</span><span>2. Caydırıcılık</span><span>3. Telaficilik</span><span>4. Eğiticilik</span><span>5. Denge</span><span>6. İşkencesizlik</span><span>7. Umumilik</span><span>8. Hukukilik</span><span>9. Haysiyetlilik</span><span>10. Yetkili kişi uygular</span><span>11. Şüphe ile hadler düşer; ta'zir haddi aşmaz</span><span>12. Kul haklarında hak mağdura aittir</span><span>13. Devlet sadece siyasi suçları affeder</span><span>14. Herkes eşittir</span><span>15. Suç işlemeyene uhrevî mükâfat vardır</span></div>
<p><span class="ar">ادرؤوا الحدود بالشبهات</span> — "Şüpheler sebebiyle hadleri düşürün."</p>
<p class="muted">Ceza türleri: bedenî (ölüm, celde, kat'-ı uzuv), malî (diyet, mirastan mahrumiyet, para cezası), manevî (nasihat, azar, teşhir), hürriyeti bağlayıcı (hapis, sürgün; İslam'da asli değil geçicidir), tamamlayıcı (kefaret, kazif yapanın şahitliğinin kabul edilmemesi, katilin mirastan mahrumiyeti).</p>

<h2>2. Kısas ve Diyet <span class="ar">القصاص والدية</span></h2>
<ul><li>Kul hakkı galiptir.</li><li>Mağdur veya veli cezayı seçer (kısas, diyet veya af).</li><li>Çocuk kısas edilmez, diyet öder.</li><li>Yalnız devlet başkanının veya hâkimin yetkisindedir.</li><li>Zamanaşımı yoktur.</li></ul>
<table class="t">
<tr><th>Öldürme türü</th><th>Tanım</th><th>Sonuç</th></tr>
<tr><td><b>Amd</b> (kasten) <span class="ar">العمد</span></td><td><b>Ebû Hanîfe:</b> bıçak, tabanca gibi bizzat öldürme aleti ile. <b>İmameyn:</b> büyük taş, sopa vb. cisimle vurma, başı ezme, suda boğma ve zehirleme dahil.</td><td>Cezası <b>kaved</b> denilen cana can kısastır. Veliler dilerse affeder. Bir bedel üzerinde sulh yapılmışsa bedeli katil öder. Velilerden biri affederse ceza diyete döner; affedenlerin hissesi çıkarıldıktan sonra gerisini katilin âkilesi öder (81 sayfalık özete göre katilin kendi malından).</td></tr>
<tr><td><b>Şibh-i amd</b></td><td>Taş, sopa, damdan (1. kat) atma, küçük taş vb. ile yapılan.</td><td>Katile kefaret; âkileye <b>diyet-i muğallaza</b>.</td></tr>
<tr><td><b>Hata</b></td><td>Av veya harbî kâfir sanarak bir hedefe atılan ok veya mermi ile bir Müslümanı öldürmek.</td><td>Katile kefaret; günahı yoktur; âkileye <b>diyet-i gayr-ı muğallaza</b>.</td></tr>
<tr><td><b>Hata mecrasında</b></td><td>Uyuyan kişinin başkasının üzerine düşmesi, bindiği atın başkasını ezmesi.</td><td>Katile kefaret; âkileye diyet-i gayr-ı muğallaza.</td></tr>
<tr><td><b>Tesebbüb</b></td><td>Kazılan kuyuya düşüp ölmek, konulan taşa çarparak ölmek; günümüzdeki trafik kazaları.</td><td>Kefaret yoktur, günahı yoktur; âkileye diyet-i gayr-ı muğallaza.</td></tr>
</table>
<div class="grid3">
<div class="card-s"><h4>Diyet-i muğallaza</h4><p>100 devedir (yaşları ağırlaştırılmış).</p></div>
<div class="card-s"><h4>Diyet-i gayr-ı muğallaza</h4><p>1000 dinar altın, 10.000 dirhem gümüş, 200 sığır, 2000 koyun veya 200 elbise cezalarından biri.</p></div>
<div class="card-s"><h4>Kefaret</h4><p>Ya 1 köle azadı ya da peş peşe 60 gün oruç. Amd dışındaki nevilerde diyeti ödemeye câni de katılır.</p></div>
</div>
<p><b>Âkile</b> <span class="ar">العاقلة</span>: Diyeti ödemekle yükümlü olan, failin asabesi ve dayanışma grubu.</p>
<h3>Kat'-ı uzuv suçu (müessir fiil)</h3>
<div class="grid2">
<div class="card-s"><h4>Amden</h4><p>7 organda kısas vardır: el, ayak, burun, kulak, göz, diş, baş. Mağdur isterse erş de isteyebilir.</p></div>
<div class="card-s"><h4>Hataen</h4><p>Tüm organlar için erş veya hükûmet-i adl vardır.</p></div>
</div>
<ul><li><b>Erş</b> <span class="ar">الأرش</span>: Kat'-ı uzuv suçlarında kısas uygulanmadığı takdirde Şâri tarafından belirlenen bedel.</li><li><b>Hükûmet-i adl</b> <span class="ar">حكومة عدل</span>: Belirlenmemiş erştir; bilirkişi raporuna göre usulünce belirlenen tazminat bedeli.</li><li><b>Kasâme</b> <span class="ar">القسامة</span>: Faili meçhul öldürmede maktulün bulunduğu yerden elli kişiye yemin ettirilmesi. <b>Nükûl</b>: yeminden kaçınma.</li><li><b>Gurre</b>: Cenine karşı işlenen suçta ödenen bedel.</li></ul>

<h2>3. Had <span class="ar">الحد</span></h2>
<ul><li>Allah hakkı galip olan suçlardır.</li><li>Cezalar bellidir; hâkimin bir yetkisi yoktur.</li><li>Şüphe ile hadler düşer.</li><li>Had suçlarındaki şahit mutlaka erkek olur.</li><li>Kazf ve sirkat hariç diğer hadlerde mağdurun ve devletin af yetkisi yoktur.</li></ul>
<table class="t">
<tr><th>Suç</th><th>Hükümler</th></tr>
<tr><td><b>Zinâ</b></td><td>Suç beyyine ve ikrar ile sabit olur. Mükellef ve baliğ kişilerin önden birleşmesi gerekir. 4 erkek, 4 ayrı mecliste (aynı mecliste) şahitlik eder; şahitler fiili açık seçik görmüş olmalıdır.</td></tr>
<tr><td><b>Kazf</b> <span class="ar">القذف</span></td><td>Yabancı kadına zina iftirası 80 celde; karısına yaparsa liân. Dava açmak şarttır; sonrasında af geçerli değildir. İspat edemezse bir daha şahitliği geçerli değildir.</td></tr>
<tr><td><b>Şürb</b></td><td>Cumhur 80 celdenin hepsini, Şâfiî 40 tanesini had sayar. Hamr dışındaki içkilerin haddine <b>hadd-i iskâr</b> denir; hamr dışındaki içkilerde had sarhoş olana uygulanır. İçki haddi uygulanmayanlar: (1) zımmî, (2) irtidat öncesi içki içip sonra İslam'a giren, (3) çocuk, deli, mükreh, susuz kişiler.</td></tr>
<tr><td><b>Sirkat</b> (hırsızlık)</td><td>Nisap miktarı (4,8 gr altın veya karşılığı) mütekavvim bir malı gizlice mahfuz yerden almak ile suç sabit olur. Dava açmış olma şartı vardır; sonrasında af geçerli değildir. El bilekten kesilir. Nisap Hanefîlere göre 10 dirhem (1 dinar), cumhura göre çeyrek dinar.</td></tr>
</table>

<h2>4. Devlet Aleyhine İşlenen Suçlar</h2>
<p>Normalde had cezaları altında işlenir.</p>
<table class="t">
<tr><th>Hirâbe</th><td>Cana karşılık can; mala karşılık çaprazlama el ve ayak kesilmesi; can ve mala birlikte tecavüz edilirse imam önce çaprazlama el-ayak kesip sonra öldürme ile doğrudan öldürme arasında muhayyerdir. Ebû Hanîfe ve Ahmed b. Hanbel bu suçun şehir dışında olmasını şart koşar; diğerleri şehir içinde de işlenebilir der.</td></tr>
<tr><th>Ridde</th><td>Söz veya fiille dinden dönmektir. Hükmü ölümdür; sünnet ve sahabe icmaı ile sabittir. Tövbe etmesi için 3 gün süre verilir.</td></tr>
<tr><th>Bağy</th><td>Kendilerince haklı bir tevil ile devlete baş kaldırma suçu. Savaş açmak caizdir. Bu suçlular arasında Müslüman varsa: (1) kadın ve çocukları esir edilmez, (2) malları alınmaz, (3) yaralıları öldürülmez, kaçan esirleri takip edilmez.</td></tr>
</table>

<h2>5. Ta'zîr <span class="ar">التعزير</span></h2>
<ul><li>Tanzimi, tespiti ve takdiri devlet başkanı (hâkim) tasarrufunda olan cezalardır.</li><li>Hakkında belli bir had cezası yoktur (hakaret, kalpazanlık, rüşvet, ihtikâr vb.).</li><li>Ta'zir cezası çocuğa da verilir.</li><li>Hem erkek hem kadın şahitlik yapabilir.</li><li>Mahkemeye intikal ettikten sonra da affedilebilir.</li><li>Ta'zir suçunun uhrevî cezası tövbe ile sâkıt olur.</li><li>Ta'zir haddi aşmaz.</li></ul>

{u:8,q:'Âriyette malın masraflarını kim karşılar?',o:['Ödünç veren','Ödünç alan','Yarı yarıya','Hâkim belirler'],a:1,e:'Menfaate bedelsiz sahip olan masrafları karşılar.'},
{u:9,q:'Hangisi şahsî intifa hakkını doğuran sebeplerden değildir?',o:['İcâre','İâre','Vasiyet','Tekâdüm'],a:3,e:'Tekâdüm irtifak hakkının sebebidir.'},
{u:10,q:'Ebû Hanîfe\'ye göre sahibi çıkmayan İslamî kenz ne yapılır?',o:['Devlete verilir','Bulan fakirlere tasadduk eder; kendisi fakirse kullanır','İlandan sonra bulanın mülkü olur','Arazi sahibine verilir'],a:1,e:'Şâfiî ve Hanbelîlere göre ilandan sonra bulanın mülkü olur.'},
{u:10,q:'Hanefîlere göre mevat arazinin ihyası için yöneticinin izni nasıldır?',o:['Şart değildir','Şarttır (Ebû Hanîfe)','Yalnız şehir içinde şarttır','Mekruhtur'],a:1,e:'Ebû Hanîfe ve Ca\'ferîler şart koşar; Şâfiî, Ahmed ve İmameyn koşmaz.'},
{u:12,q:'Hanefîlere göre kabul süresi ne kadardır?',o:['İcaptan hemen sonra','Akit meclisi devam ettikçe','Üç gün','Satıcının belirlediği süre'],a:1,e:'Şâfiîler fevrîlik arar.'},
{u:12,q:'Hangisi gayr-ı akdî kavlî tasarruftur?',o:['Satım','Vakıf','İkrar','İcâre'],a:2,e:'Dava, ikrar, yemin ve kazf iki irade arasında bağ olmayan sözlü tasarruflardır.'},
{u:13,q:'Ölüm hastasının terekenin üçte birini aşan teberruları için hüküm nedir?',o:['Batıl','Varislerin onayına bağlı','Nafiz','Alacaklıların onayına bağlı'],a:1,e:'Varis hakkı terekenin üçte ikisine taalluk eder.'},
{u:14,q:'Hanefîlere göre vekilin satım akdinde akdin hukuku (teslim, bedeli isteme) kime döner?',o:['Müvekkile','Vekile','Hâkime','Her ikisine eşit'],a:1,e:'Hüküm müvekkile, hukuk vekile döner; nikâh gibi akitlerde hukuk da müvekkile.'},
{u:15,q:'Hanefîlere göre ikrahla yapılan satım akdinin hükmü nedir?',o:['Batıl','Fasit; icazetle sahih olur','Nafiz','Lazım'],a:1,e:'Rıza yoktur ama ihtiyar bozulmamışsa akit fasittir; ikrah kalktıktan sonra icazetle sahih olur.'},
{u:16,q:'Hangisi izafeyi kabul etmeyen (ancak müneccez kurulabilen) akittir?',o:['Vekâlet','İcâre','Hibe','Kefalet'],a:2,e:'Aynın temlikini ifade eden akitler ve nikâh izafeyi kabul etmez.'},
{u:17,q:'Tayin muhayyerliğini caiz görmeyenler kimlerdir?',o:['Hanefîler','Mâlikîler','Şâfiî, Ahmed b. Hanbel ve Züfer','Ebû Hanîfe ve İmameyn'],a:2,e:'Hanefî ve Mâlikîlere göre geçerlidir; Şâfiî, Ahmed ve Züfer mebîdeki bilinmezlik sebebiyle caiz görmez.'},
{u:18,q:'Şürb haddi Şâfiîlere göre kaç değnektir?',o:['40','60','80','100'],a:0,e:'Cumhura göre 80; Şâfiî 40\'ını had, fazlasını ta\'zîr sayar.'},
{u:18,q:'Hirâbe suçunu şehir dışında işlenmesi şartıyla kabul edenler kimlerdir?',o:['Şâfiî ve Mâlikî','Ebû Hanîfe ve Ahmed b. Hanbel','Zâhirîler','Ca\'ferîler'],a:1,e:'Diğerlerine göre şehir içinde de işlenebilir.'}

{u:4,q:'Ehl-i eser (hadis) ve ehl-i re\'y yaklaşımları nasıl ortaya çıkmıştır? Temel anlayışları nelerdir?',k:['Emevî döneminde ortaya çıktı','Hicaz/Medine: Saîd b. el-Müseyyeb; Irak/Kûfe: İbrâhim en-Nehaî','Sebep 1: hocalar — İbn Ömer Medine\'de, İbn Mes\'ûd Kûfe\'de','Sebep 2: Medine\'de rivayet bol, Kûfe\'de az ve uydurma var','Sebep 3: Medine\'de hayat sade, Kûfe\'de karmaşık','Ehl-i hadis: rivayet ve Medine örfü; farazi fıkıhtan uzak','Ehl-i re\'y: rivayette titiz, kıyas ve içtihat; farazi fıkıh','Aralarındaki fark derece farkıdır']},

{u:4,q:'Duraklama (taklit) döneminin başlangıcını, özelliklerini ve taklidin yaygınlaşma sebeplerini yazınız.',k:['IV. asrın ortasından h.656\'ya (Bağdat\'ın düşüşü)','Mezhepler belirginleşti; taassup ve taklit','Ta\'lîl, tercih ve mezhep müdafaası','Kerhî\'nin sözü','Sebepler: hocalara aşırı saygı, mezhepli kadı tayini, mezhep hükümlerinin tedvini','Nefse güvenin azalması, yöneticilerin mezhep desteği','Vakıf tahsisi, âlimler arası rekabet']},

{u:8,q:'Şahsî intifa hakkı nedir? Doğuran sebepleri, özellikleri ve sona erdiren durumları yazınız. İbâha ile karşılaştırınız.',k:['Menfaatin şahsa bağlı mülkiyeti','Mâlikî: intifa hakkı / menfaat mülkiyeti ayrımı','Sebepler: icâre, iâre, vakıf, vasiyet','İbâha: yalnız yararlanma izni, temlik yok','Kayıtlanabilir; Hanefîlere göre mirasla geçmez','Teslim gerekir; masraflar bedelsizde yararlanana','Sona erme: menfaat sahibinin ölümü (Hanefî), malikin ölümü (âriyet, icâre), süre, helak']},
{u:9,q:'İrtifak hakkı nedir? Çeşitlerini, doğuran sebepleri ve şahsî intifa hakkından farkını yazınız.',k:['Hâkim akar lehine hâdim akar üzerinde aynî hak','Şirb ve şefe; suların dört kısmı','Mecrâ, mesîl (zarar şartı, masraf)','Tarîk: umumi ve özel yol','Teallî: Hanefî satılamaz, Mâlikî-Hanbelî satılabilir','Komşuluk hakkı','Sebepler: umumi ortaklık, akitte şart, tekâdüm (+ihya, izin, vasiyet...)','Fark: akara bağlı-mirasla geçer; yalnız akarda; süresiz']},
{u:11,q:'Tam mülkiyeti doğuran sebepleri sınıflandırarak her birinin özelliklerini yazınız.',k:['Dört sebep: istîlâ, nakil akitleri, miras, şuf\'a','İhtiyarî/cebrî: yalnız miras cebrî','Doğurucu/nakledici: istîlâ doğurur, akit ve miras nakleder','Fiilî/kavlî: istîlâ fiilî, akit ve şuf\'a kavlî, miras ikisi de değil','Nakil akitleri yalnız mütekavvim malda','Miras icap-kabul gerektirmez; borç ve vasiyetten sonra']},
{u:10,q:'Mübah mal nedir? Mübah mallar üzerinde mülkiyet tesisini kısımlarıyla açıklayınız.',k:['Mübah mal tanımı','Avlanma: hakiki ve hükmî ihraz; av niyeti','Otlar mübah; ağaç ve çalılar sahipli arazide mülk edinilemez','Maden ve kenz; rikâz; mezhep görüşleri (Mâlikî devlet, Hanefî araziye tabi)','İslamî ve cahiliye kenzi; lukata','Ölü arazinin ihyası: şartlar','Tahcîr: öncelik hakkı, 3 yıl','Yöneticinin izni ve terk meselesi']},
{u:11,q:'Şuf\'a nedir? Sebeplerini, mertebelerini, taleplerini ve düşüren sebepleri açıklayınız.',k:['Tanım ve terimler (şefî\', meşfû\' bih/fîh)','Delil: hadisler ve icma; hikmet: zararı önleme','Hanefî mertebeler: hissedar, irtifak ortağı, bitişik komşu','Cumhur: yalnız taksim edilmemiş ortaklık; Zâhirî: her malda','Şartlar: akar, bedelli çıkış, meşfû\' bihin devamı, rıza olmaması','Talepler: müvâsebe (şahitsiz), takrîr-işhâd, husûme','İzdiham: Hanefî rüûs, Şâfiî hisse','Düşüren sebepler: vazgeçme, rıza, gecikme, kendi malını satma, ölüm, kısmen talep']},
{u:12,q:'Tasarruf ne demektir? Kaç kısma ayrılır? Akdin tanımını ve rüknü konusundaki görüşleri yazınız.',k:['Tasarruf tanımı','Fiilî (gasp, itlaf) ve kavlî','Kavlî: akdî (iki veya tek irade) ve gayr-ı akdî (ikrar, dava, yemin)','İltizam','Akit tanımı: icap ve kabulün meşru şekilde bağlanması','Hanefî: rükün icap-kabul','Cumhur: sîga, âkidler, mahal']},
{u:12,q:'İç irade ve dış irade ne demektir? Uyuşmazlık hallerini örneklerle açıklayınız.',k:['Akit dış irade (icap-kabul) ile kurulur, niyet tek başına yetmez','Hanefî-Şâfiî ibareye, Mâlikî-Hanbelî kasta önem verir','Kasıtsız söz (uyuyan, deli)','Anlamı bilinmeyen söz','Akit kastı olmayan söz (ezber)','Hata (sebkat-i lisan)','Hezl: nikâh, talak, ric\'at geçerli; malî akitlerde geçersiz','İkrah','Gayr-ı meşru amaç (şaraba üzüm)']},
{u:12,q:'Akit meclisi nedir? Meclisle ilgili muhayyerlikleri ve mezheplerin tutumunu yazınız.',k:['Tarafların akitle meşgul olduğu süre; akde yabancı işe geçince dağılır','Hanefî: kabul meclis boyunca; Şâfiî: fevren','Rücû muhayyerliği: kabulden önce dönme; Mâlikîler kabul etmez','Kabul muhayyerliği','Meclis muhayyerliği: Şâfiî-Hanbelî kabul eder (hadis); Hanefî-Mâlikî kabul etmez','İcap-kabulün tek kişide toplanması: Hanefî-Hanbelî caiz, Şâfiî dede örneği']},
{u:12,q:'Akdin mahalli ne demektir? Bu konuda aranan şartlar nelerdir?',k:['Akdin üzerine vaki olduğu ve hükmünün ortaya çıktığı şey','Şer\'an elverişli olmalı (meyte, şarap, mahrem)','Akit anında mevcut olmalı (istisna: selem, istisnâ\', icâre)','Teslim edilebilir olmalı','Malum olmalı, niza doğuracak cehalet olmamalı']},
{u:13,q:'Vücub ve eda ehliyetini, eda ehliyeti bakımından kişinin geçirdiği aşamaları açıklayınız.',k:['Vücub: hak ve borçlara elverişlilik; zimmet','Nâkıs vücub: cenin','Eda: söz ve fiillere sonuç bağlanması; akıl ve temyiz','Cenin ve doğum-temyiz: eda ehliyeti yok','Temyiz-bulûğ: nâkıs; tasarrufların üçlü ayrımı','Bulûğ-rüşt: tam; rüşt beklenmesi, Ebû Hanîfe 25 yaş']},
{u:13,q:'Ehliyet arızaları nelerdir? Ateh, sefeh, sarhoşluk ve ölüm hastalığının etkilerini açıklayınız.',k:['Semâvî: cünûn, ateh, uyku-baygınlık, ölüm hastalığı','Müktesebe: sefeh, sarhoşluk','Ateh: hafifi mümeyyiz, ağırı gayr-ı mümeyyiz hükmünde','Sefeh: Ebû Hanîfe 25 yaştan sonra hacr yok; cumhur hacr','Sarhoşluk: mübah yolla gayr-ı mümeyyiz; haram yolla iki görüş','Ölüm hastalığı şartları','Alacaklı ve varis hakları; üçte bir','Firar talakında miras görüşleri']},
{u:14,q:'Velayet ve vesayeti açıklayarak kaynağına ve konusuna göre kısımlarını ve sıralamayı belirtiniz.',k:['Velayet tanımı','Kâsıra ve müteaddiye','Kaynağına göre: aslî (kan bağı), niyabet (vasi, vekil), şer\'î (hâkim)','Konusuna göre: şahıs üzerinde (nikâh, terbiye), mal üzerinde','Nikâhta asabe sırası','Mal velayetinde mezheplere göre sıra (Hanefî: baba, vasisi, dede, vasisi, hâkim)','Vesayet: velinin tayin ettiği kişinin velayeti']},
{u:14,q:'Fuzûlî kime denir? Tasarruflarının geçerliliği konusundaki görüşleri ve icazetin şartlarını yazınız.',k:['Yetkisi olmadan başkası adına tasarruf eden','Hanefî-Mâlikî: mevkuf; icazetle baştan sahih','Delil: Urve el-Bârikî hadisi','Şâfiî (cedîd)-Hanbelî: batıl; "yanında olmayanı satma"','İcazet satımda geriye, kefalet/talakta ileriye işler','Şartlar: ehil kişiden, taraflar hayattayken, konu mevcutken']},
{u:17,q:'Galat ne demektir? Türlerini ve fıkhî işlemlere etkisini yazınız.',k:['Cins veya vasıfta yanılma','Bâtınî galat: etkisi yok, itibar ibareye','Zâhirî galat: cinste batıl, vasıfta mevkuf (vasıf muhayyerliği)','Cumhur: feshi kabil akitlerde etkili, nikâhta değil','Hanbelî: nikâhta da fesih']},
{u:15,q:'Gabn ve tağrir ne demektir? Tek başlarına ve birlikte akde etkisini yazınız.',k:['Gabn: bedeller arası denksizlik; yesîr ve fâhiş','Mecelle ölçüsü: 1/20, 1/10, 1/5','Tek başına gabnın etkisi tartışmalı','Mahcur, vakıf, beytülmal malında akit batıl','Tağrir: hileyle akde sevk; fiilî (musarrât) ve kavlî','Gabn + tağrir: ittifakla fesih hakkı']},
{u:16,q:'İkrah ne demektir? Çeşitlerini, şartlarını ve sözlü tasarruflara etkisini yazınız.',k:['Tanım','Şartlar: mükrih güçlü, mükreh inanıyor, cana/uzva veya hapis-dövme, zaten yapacağı şey değil','Mülcî: rızayı yok eder, ihtiyarı bozar; gayr-ı mülcî: ihtiyarı bozmaz','İkrarlar batıl','Satım vb.: cumhur hükümsüz; Hanefî fasit, icazetle sahih','Hanefî: nikâh, talak, ric\'at, ıtak, yemin, nezir geçerli','Fiillere etkisi; zorla öldürmede kısas görüşleri']},
{u:17,q:'Akitleri vasıf, bağlayıcılık, kuruluş şekli ve hükmün başlama zamanı bakımından tasnif edip örnekler veriniz.',k:['Sahih, batıl, fasit (Hanefî üçlü ayrımı)','Nafiz, mevkuf','Lazım, gayr-ı lazım','Rızâî, aynî, şeklî','Muâvaza, teberru; çift karakterli (ivaz şartlı hibe)','Damân, emanet; rehin','Temlik, ortaklık, teminat, temsil, koruma, ıskat','Fevrî, istimrârî; asli, tâbi','Müneccez, muallak, muzâf']},
{u:17,q:'Muhayyerlik ne demektir? Kaynağına göre kısımlarını; şart, görme ve ayıp muhayyerliklerini açıklayınız.',k:['Tanım; iradî ve kanunî','Şart: süre görüşleri (3 gün / belirlenen / ihtiyaç), düşüren sebepler','Tayin: Hanefî, en çok 3 şey, 3 gün','Görme: hadis; Hanefî kabul, Şâfiî (cedîd) batıl','Ayıp: şartlar, düşüren haller, teslimden önce/sonra fesih','Vasıf muhayyerliği','Şartu\'l-berâe']},
{u:16,q:'Akitlerde şart koşma özgürlüğü konusundaki görüşleri açıklayınız.',k:['Daraltanlar (Zâhirî): nas izin vermedikçe şart geçersiz','Deliller: Mâide 3, Bakara 229, Allah\'ın kitabında olmayan şart hadisi','Genişletenler (İbn Teymiyye, İbnü\'l-Kayyim): yasak yoksa caiz','Deliller: akitleri ifa ayeti, asıl rıza ve ibaha','Hanefî orta yol: sahih, fasit, batıl şart','Fasit şart muâvazayı bozar; teberru ve nikâhta lağv']},
{u:18,q:'İslam ceza hukukunun temel özelliklerini ve amaçlarını yazınız.',k:['Suç ve ceza tanımları','Amaç: zarûrât-ı hamsenin korunması, zecr, toplum maslahatı','Suçun unsurları: kanunilik, maddî, hukuka aykırılık, manevî','Hukûkullah – hukûku\'l-ibâd','İlkeler: şahsîlik, eşitlik, caydırıcılık, şüpheyle hadlerin düşmesi','Ceza türleri: kısas-diyet, had, ta\'zîr','Düşüren sebepler: ölüm, af, tövbe, sulh, tevarüs']},
{u:18,q:'Had ve ta\'zîr ne demektir? Had kapsamındaki suçları sayınız ve ta\'zîrin özelliklerini yazınız.',k:['Had: Şâriin belirlediği, Allah hakkı galip ceza; takdir yok, şüpheyle düşer','Zinâ, kazf, şürb, sirkat, hirâbe, ridde, bağy','Kazf 80; şürb 80/40; sirkatte el kesme, nisap','Hirâbe cezaları (Mâide 33)','Ta\'zîr: hâkimin takdiri, çocuğa da verilir','Ta\'zîr affedilebilir, had miktarını aşmaz']},
{u:18,q:'Öldürme türlerini ve her birinin hukukî sonuçlarını açıklayınız.',k:['Amd: Ebû Hanîfe ve İmameyn tanımları; kısas','Şibh-i amd: diyet-i muğallaza âkileye, kefaret','Hata: diyet âkileye, kefaret','Hata mecrasında','Tesebbüb: diyet, kefaret yok','Diyet miktarları','Velilerden birinin affı kısası düşürür']}

// Vaka analizleri
const CASES = [
{u:16,title:'Âriyet araçla kaza',q:'Âriye kapsamında arkadaşı A\'dan aldığı araçla trafikte normal seyreden B, plakası tespit edilemeyen bir aracın tehlikeli manevraları yüzünden kaza yapar; 15.000 TL hasar oluşur. B\'nin hiçbir kusuru yoktur. A, hasarın karşılanmasını ister; B kusursuz olduğunu söyleyerek reddeder. Hasarı kim karşılar?',k:['Âriyet, menfaatin bedelsiz temlikidir; mesele âriyetin emanet mi damân mı olduğudur','Hanefîlere göre âriyet emanettir: kusur ve ta\'addî yoksa B tazmin etmez, zarar A\'ya kalır','Şâfiî ve Hanbelîlere göre âriyet damândır: olağan kullanım dışında helakte B tazmin eder','Mâlikîler gizlenebilen mallarla gizlenemeyenleri ayırır; araç gibi gizlenemeyen malda kusur ispat edilmedikçe tazmin yoktur','Sonuç mezhebe göre değişir; tercih edilen görüşü gerekçesiyle belirtmek gerekir']},
{u:11,title:'Komşuluk şuf\'ası ve masraflar',q:'A, kapı komşusu B\'nin haberi olmadan evini 750.000 TL\'ye C\'ye satar. İki yıl sonra durumu öğrenen B hemen C\'ye gidip aynı bedeli ödeyerek evi almak ister. C, 15.000 TL teslim masrafını da öderse kabul edeceğini söyler; B masraflardan sorumlu olmadığını iddia eder. Şuf\'a sabit olur mu, karar kimin lehine çıkar?',k:['Komşuluk Hanefîlere göre şuf\'a sebebidir (bitişik komşu); cumhura göre komşuya şuf\'a yoktur','Hak öğrenme anından itibaren işler; B öğrenir öğrenmez talepte bulunduğu için hakkı düşmemiştir (müvâsebe talebi)','Ardından şahitli takrîr talebi ve gerekirse dava gerekir','Şefî\', akarı müşteriye "her kaça mal oldu ise" o bedelle alır; masraflar da buna dahildir','Hanefîlere göre şuf\'a sabittir ve B 750.000 + 15.000 TL ödemelidir; bu noktada C haklıdır']},
{u:11,title:'Ortak bahçe ve şuf\'a mertebeleri',q:'A, B, C ve D\'nin evleri aynı bahçeye açılır, caddeye bağlantıları bu bahçe üzerindendir. A ile B bitişik komşudur; C ile D bir evi yarı yarıya ortaktır. C, kendi hissesini kimseye haber vermeden E\'ye 200.000 TL\'ye satar. Komşuları ve ortağı şuf\'a talep eder. D vazgeçerse, A vazgeçerse, B vazgeçerse hüküm ne olur?',k:['Hanefî mertebeleri: 1) satılan evin hissedarı (D), 2) yol/bahçe gibi irtifak ortakları (A ve B), 3) bitişik komşu','D en öncelikli şefî\'dir; D talep ettikçe A ve B\'nin hakkı yoktur','D vazgeçerse: hak bahçe yolunun ortakları olan A ve B\'ye geçer, Hanefîlere göre kişi sayısına göre eşit paylaşırlar','A vazgeçerse: D talep ediyorsa evi D alır; D de vazgeçmişse B tek başına alır','B vazgeçerse: yine D alır; D vazgeçmişse A alır','Cumhura göre yalnız D\'nin şuf\'a hakkı vardır; D vazgeçerse şuf\'a kalmaz']},
{u:13,title:'Roma sikkesi ve mümeyyiz çocuk',q:'Yedi yaşındaki A ile on altı yaşındaki B ağaçlık alanda yemiş toplar. A yolda üzerinde Roma rakamları ve figürler bulunan gümüş bir sikke bulur. B, topladığı yemişler karşılığında sikkeyi A\'dan satın alır. Eve yaklaşınca A, babasından korkarak yemişleri verip sikkeyi geri almak ister. Olayı tahlil ediniz.',k:['Mübah alandaki yemişler istîlâ ile mülk edinilir; istîlâ fiilî bir sebep olduğundan çocuk da malik olur','Sikke İslam öncesine ait (cahiliye) kenzdir: mübah arazide beşte biri devletin, kalanı bulanındır','Yedi yaş temyiz sınırıdır: A gayr-ı mümeyyiz sayılırsa satım batıldır','A mümeyyiz sayılırsa satım yarar-zarar ihtimalli bir tasarruftur; velinin icazetine bağlı (mevkuf) olur','A tek başına bozamaz; babası icazet vermezse akit bozulur ve karşılıklı iade edilir','B on altı yaşında ise bulûğa ermiş olabilir; ermemişse onun alımı da velisinin iznine bağlıdır']},
{u:13,title:'Sarhoşken boşama',q:'Eve alkollü gelen A tartışma sırasında karısı B\'yi boşar. Ayılınca boşadığına inanamaz. B, boşama veya vefata ertelenmiş 50.000 TL müeccel mehrin ve mahkeme kararıyla kesinleşmiş 6.500 TL birikmiş nafakanın ödenmesi için dava açar. A sarhoşluk gerekçesiyle boşamanın geçersiz olduğunu savunur. Davayı sonuçlandırınız.',k:['Sarhoşluk müktesebe bir ehliyet arızasıdır; haram yolla olup olmadığına bakılır','Haram yolla sarhoşun talakı Hanefîler başta olmak üzere bir görüşe göre ceza olarak geçerlidir','Diğer görüşe göre (Zeydan\'ın tercihi) sarhoşun eda ehliyeti yoktur, talak vaki olmaz','Talak geçerli sayılırsa müeccel mehrin vadesi gelir, 50.000 TL ödenir','Talak geçersiz sayılırsa nikâh devam eder; müeccel mehrin vadesi gelmez','Birikmiş nafaka mahkeme kararıyla kesinleşmiş borç olduğundan her iki durumda da ödenir']},
{u:12,title:'Filmde rol gereği boşama',q:'Evli olan A ile B aynı filmde gerçek isimleriyle oynayacaklardır. Çekimler sırasında bir sahnede A rol gereği B\'yi boşar. Bu boşamayı değerlendiriniz.',k:['Nikâh, talak ve ric\'at hezl ile de sonuç doğurur ("ciddisi de şakası da ciddidir")','Hezlde kişi sözü kasten söyler ama sonucunu istemez; rol ise başkasının yazdığı sözü aktarmaktır (hikâye)','Talak inşa kastıyla söylenmiş söze bağlanır; senaryo aktarımı inşa değil hikâyedir','Bu yüzden çoğu çağdaş değerlendirmeye göre rol gereği söylenen söz talak sayılmaz','Gerçek isimlerin kullanılması karışıklık doğurduğundan ihtiyaten kaçınılması, şüphe halinde bir âlime danışılması önerilir']},
{u:12,title:'Galeride vazgeçen müşteri',q:'A, arkadaşı B\'nin galerisinden bir otomobili 63.500 TL\'ye satın alır ve galeride oturmaya devam eder. B aracın özelliklerini anlatırken A, bu parayla daha iyi araç alabileceğini düşünür ve muhayyerlik hakkını kullanarak satışı feshettiğini söyler. B kabul etmez. Olayı tahlil ediniz.',k:['Mesele meclis muhayyerliğidir; taraflar henüz ayrılmamıştır','Şâfiî ve Hanbelîlere göre "satıcı ve alıcı ayrılmadıkça muhayyerdir" hadisi gereği A feshedebilir','Hanefî ve Mâlikîlere göre akit icap ve kabulle lazım olmuştur; meclis muhayyerliği yoktur, B haklıdır','A\'nın şart, ayıp veya görme muhayyerliği yoktur','Gabn veya tağrir iddiası da yoktur; fiyat piyasaya uygunsa fesih sebebi bulunmaz']},
{u:14,title:'Arkadaşı adına alınan telefon',q:'A pazarda, arkadaşı B\'nin aradığı model bir telefonu görür ve satıcı C\'ye B adına almak istediğini söyleyip 1.750 TL\'ye satın alır. B telefonla haberdar edilince çok sevindiğini söyler. Eve dönerken A düşer, telefon kırılır. A bedeli B\'den ister; B teslim almadığı malın parasını vermeyeceğini söyler. A da C\'ye gidip alışverişin geçersiz olduğunu, parasının iadesini ister. Olayı tahlil ediniz.',k:['A, yetkisi olmadan B adına alım yaptığı için fuzûlîdir','Hanefî ve Mâlikîlere göre akit B\'nin icazetine bağlı (mevkuf); B sevinerek onay verdiği için icazet gerçekleşmiştir','İcazet geriye yürür; A, B\'nin vekili hükmüne girer ve telefonu B adına kabzetmiştir','Vekilin elindeki mal emanettir; A\'nın kusuru yoksa helak B\'ye aittir ve B bedeli A\'ya öder','C ile yapılan satım tamamlanmış ve teslim gerçekleşmiştir; A\'nın iade talebi yerinde değildir','Şâfiî ve Hanbelîlere göre fuzûlî tasarruf batıldır; alım A\'nın kendisi için geçerli sayılırsa zarar A\'ya kalır']},
{u:10,title:'Göktaşı kimin?',q:'Köyde yaşayan Niyazi komşu tarlada parlak bir taş görür, göktaşı olduğunu anlayınca evine götürür. Tarla sahibi taşın kendisine ait olduğunu iddia eder; Niyazi "Bulduğum için benimdir" der. İstîlâ bilgileri çerçevesinde taş kime aittir? (2022 sınavı)',k:['Bu bir yorum sorusudur; önce göktaşının hukukî niteliği belirlenmelidir','Mübah mal kabul edilirse: başkasının mülkündeki şey üzerinde istîlâ tartışmalıdır; arazi sahibinin hakimiyet alanındadır','Toprağa karışmış maden/kenz benzeri sayılırsa: Hanefîlere göre özel mülkte çıkan maden arazi sahibine aittir','Mâlikî yaklaşımıyla yer altı/üstü kıymetli varlıklar devlete ait olabilir','Bilimsel değeri olan eser niteliği taşıyorsa kamuya (devlete) ait sayılabilir','Cevap gerekçeli olarak tek bir görüşe bağlanmalıdır']}
];

function ozet(aktif){if(typeof gaOzet!=='function')return;const n=Object.keys(progress).length,dy=store.get('dy',{d:0,y:0}),h=location.hash.slice(1)||'ana';gaOzet({bitti:n/UNITS.length,etiket:n+'/'+UNITS.length+' ünite testi',d:dy.d,y:dy.y,kart:store.get('known',[]).length,yer:{ad:yerAdi(h),url:'/madhal/#'+h},aktif:!!aktif})}
function say(ok){const dy=store.get('dy',{d:0,y:0});ok?dy.d++:dy.y++;store.set('dy',dy);ozet(true)}
function alt(b){if(typeof gaAltGizle==='function')gaAltGizle(b)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uName(n){const u=UNITS[n-1];return u?u.no+'. '+u.title:''}

/* Test */
function modeTest(){
 const ex=$('#ex'); const pool=BANK.filter(q=>inFilter(q.u));
 let count=store.get('tcount',10);
 ex.innerHTML=`<div class="panel"><h2>Çoktan Seçmeli Test</h2><p class="muted">${fltLabel()} · havuzda ${pool.length} soru</p>

 ex.querySelectorAll('#cnt button').forEach(b=>b.onclick=()=>{count=+b.dataset.c;store.set('tcount',count);ex.querySelectorAll('#cnt button').forEach(x=>x.classList.toggle('on',x===b))});

}
function playTest(qs){
 const ex=$('#ex'); let i=0, score=0; const wrong=[];
 function show(){
  const q=qs[i];
  ex.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="muted">Soru ${i+1} / ${qs.length}</span><span class="muted">Doğru: ${score}</span></div>
  <div class="prog"><i style="width:${(i)/qs.length*100}%"></i></div>
  <span class="unit-tag">${esc(uName(q.u))}</span>
  <p class="big-q">${esc(q.q)}${B('t:'+q.id,'Sınav · Test · '+uName(q.u),q.q+' | Doğru cevap: '+q.o[q.a])}</p>
  <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="l">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="fb"></div></div>`;
  ex.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const j=+b.dataset.j, ok=j===q.a; if(ok)score++; else wrong.push({q,j}); say(ok);
   ex.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add('right')}); if(!ok)b.classList.add('wrong');
   $('#fb').innerHTML=`<div class="expl ${ok?'ok':'no'}"><b>${ok?'Doğru.':'Yanlış.'}</b>${esc(q.e)}</div><div style="margin-top:16px;text-align:right"><button class="btn" id="nx">${i+1<qs.length?'Sonraki soru →':'Sonucu gör'}</button></div>`;
   $('#nx').onclick=()=>{i++; i<qs.length?show():end()}; $('#nx').focus();
  });
  alt(true);
 }
 function end(){
  alt(false);
  const pct=Math.round(score/qs.length*100);
  ex.innerHTML=`<div class="panel"><div class="result"><div class="num">${score}/${qs.length}</div><p style="font-size:18px;margin:.4em 0">%${pct} başarı · ${pct>=85?'Çok iyi!':pct>=70?'İyi gidiyor.':pct>=50?'Biraz daha tekrar.':'Üniteleri yeniden gözden geçir.'}</p>
  <div class="row" style="justify-content:center"><button class="btn" id="re">Yeni test</button></div></div>
  ${wrong.length?`<div class="review"><h3>Yanlış cevaplanan sorular</h3>${wrong.map(w=>`<div class="q"><span class="unit-tag">${esc(uName(w.q.u))}</span><div class="q-text">${esc(w.q.q)}</div><div class="expl no"><b>Senin cevabın:</b>${esc(w.q.o[w.j])}</div><div class="expl ok" style="margin-top:6px"><b>Doğru cevap:</b>${esc(w.q.o[w.q.a])} — ${esc(w.q.e)}</div></div>`).join('')}</div>`:''}</div>`;
  $('#re').onclick=modeTest;
 }
 show();
}

  })});

/* Matching */
function modeMatch(){
 const ex=$('#ex'); const pool=TERMS.filter(t=>inFilter(t.u));
 let round, picked=null, miss=0, matched=0, t0;
 function start(){
  round=shuffle(pool).slice(0,6); picked=null; miss=0; matched=0; t0=Date.now();
  const defs=shuffle(round.map((t,i)=>({i,d:t.d})));
  ex.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>Eşleştirme</h2><div class="stat"><span>Eşleşen: <b id="mm">0</b>/${round.length}</span><span>Hata: <b id="ms">0</b></span></div></div>
  <p class="muted">${fltLabel()} · Soldan bir kavram, sağdan tanımını seçin.</p>
  <div class="match"><div class="col">${round.map((t,i)=>`<button class="m-item" data-k="t" data-i="${i}"><b>${esc(t.t)}</b>${t.ar?`<span class="ar">${t.ar}</span>`:''}</button>`).join('')}</div>
  <div class="col">${defs.map(d=>`<button class="m-item" data-k="d" data-i="${d.i}">${esc(d.d)}</button>`).join('')}</div></div>
  <div id="mend"></div></div>`;
  ex.querySelectorAll('.m-item').forEach(b=>b.onclick=()=>click(b));
 }
 function click(b){
  if(b.classList.contains('done'))return;
  if(!picked||picked.dataset.k===b.dataset.k){ if(picked)picked.classList.remove('sel'); picked=b; b.classList.add('sel'); return }
  if(picked.dataset.i===b.dataset.i){[picked,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true}); matched++; $('#mm').textContent=matched; picked=null;
   if(matched===round.length){const s=Math.round((Date.now()-t0)/1000); $('#mend').innerHTML=`<div class="score-bar"><span>Tamamlandı · ${s} sn · ${miss} hata</span><button class="btn" id="mr">Yeni tur</button></div>`; $('#mr').onclick=start}
  } else { miss++; $('#ms').textContent=miss; const a=picked; [a,b].forEach(x=>{x.classList.remove('err');void x.offsetWidth;x.classList.add('err')}); setTimeout(()=>{a.classList.remove('err','sel');b.classList.remove('err')},450); picked=null }
 }
 if(pool.length<2){ex.innerHTML='<div class="panel"><p>Bu filtrede yeterli kavram yok.</p></div>';return}
 start();
}

/* Flashcards */
function modeCards(){
 const ex=$('#ex'); let deck=TERMS.filter(t=>inFilter(t.u)); let i=0; const known=new Set(store.get('known',[]));
 let onlyUnknown=false;
 function list(){return onlyUnknown?deck.filter(t=>!known.has(t.t)):deck}
 function draw(){
  const d=list(); if(i>=d.length)i=0;
  const c=d[i];
  ex.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>Bilgi Kartları</h2><span class="muted">${d.length?(i+1)+' / '+d.length:'0'} · bilinen: ${deck.filter(t=>known.has(t.t)).length}/${deck.length}</span></div>
  <div class="row" style="margin-top:8px"><label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ou" ${onlyUnknown?'checked':''} style="accent-color:var(--accent)"> Sadece bilmediklerim</label><button class="btn soft" id="sh">Karıştır</button></div>
  ${c?`<div class="fc-stage"><div class="fc" id="fc" tabindex="0" role="button" aria-label="Kartı çevir"><div class="fc-face"><span class="unit-tag">${esc(uName(c.u))}</span><div class="fc-term">${esc(c.t)}</div>${c.ar?`<div class="fc-ar">${c.ar}</div>`:''}<span class="fc-hint">Çevirmek için tıklayın · boşluk tuşu</span></div><div class="fc-face back"><div class="fc-def">${esc(c.d)}</div>${c.ar?`<div class="fc-ar" style="font-size:24px;margin-top:14px">${c.ar}</div>`:''}<span class="fc-hint">${known.has(c.t)?'✓ Biliyorum olarak işaretli':''}</span></div></div></div>
  <div style="text-align:center;margin-top:8px">${B('k:'+c.id,'Sınav · Bilgi kartı · '+uName(c.u),c.t+': '+c.d)}</div>
  <div class="fc-ctrl"><button class="btn soft" id="pv">← Önceki</button><button class="btn warm" id="no">Tekrar et</button><button class="btn" id="ok">Biliyorum</button><button class="btn soft" id="nx">Sonraki →</button></div>`:'<p style="padding:30px 0;text-align:center">Tüm kartları biliyorsun. 🎉</p>'}</div>`;
  $('#ou').onchange=e=>{onlyUnknown=e.target.checked;i=0;draw()};
  $('#sh').onclick=()=>{deck=shuffle(deck);i=0;draw()};
  if(!c)return;
  const fc=$('#fc'); fc.onclick=()=>fc.classList.toggle('flip');
  $('#pv').onclick=()=>{i=(i-1+d.length)%d.length;draw()};
  $('#nx').onclick=()=>{i=(i+1)%d.length;draw()};
  $('#ok').onclick=()=>{known.add(c.t);store.set('known',[...known]);if(!onlyUnknown)i=(i+1)%d.length;draw()};
  $('#no').onclick=()=>{known.delete(c.t);store.set('known',[...known]);i=(i+1)%d.length;draw()};
 }
 cardKeys=e=>{if(exMode!=='kartlar'||!$('#fc'))return; if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return; if(e.key===' '){e.preventDefault();$('#fc').classList.toggle('flip')} else if(e.key==='ArrowRight')$('#nx').click(); else if(e.key==='ArrowLeft')$('#pv').click()};
 if(!deck.length){ex.innerHTML='<div class="panel"><p>Bu filtrede kart yok.</p></div>';return}
 draw();
}
let cardKeys=null; document.addEventListener('keydown',e=>cardKeys&&cardKeys(e));

/* Interview & Cases */
let timerId=null;
function modeInterview(isCase){
 const ex=$('#ex'); const pool=(isCase?CASES:INTERVIEW).filter(x=>inFilter(x.u));
 if(!pool.length){ex.innerHTML='<div class="panel"><p>Bu filtrede soru yok.</p></div>';return}
 let order=shuffle(pool.map((_,i)=>i)), p=0;
 function draw(idx){
  if(timerId){clearInterval(timerId);timerId=null}
  const x=pool[idx];
  ex.innerHTML=`<div class="panel">
  <div class="row" style="justify-content:space-between"><h2>${isCase?'Vaka Analizi':'Mülakat'}</h2><div class="row"><span class="timer" id="tm">${isCase?'05:00':'03:00'}</span><button class="btn soft" id="ts">Süreyi başlat</button></div></div>
  <p class="muted">${fltLabel()} · ${pool.length} ${isCase?'vaka':'soru'} · Cevabınızı sesli verin ya da not alın, sonra cevap anahtarıyla karşılaştırın.</p>
  <span class="unit-tag">${esc(uName(x.u))}${x.src?' · '+x.src+' sınavı':''}</span>
  ${isCase?`<div class="case-text"><h4>${esc(x.title)}${B('v:'+x.id,'Sınav · Vaka · '+uName(x.u),x.title+': '+x.q)}</h4>${esc(x.q)}</div>`:`<p class="iv-q">${esc(x.q)}${B('m:'+x.id,'Sınav · Mülakat · '+uName(x.u),x.q)}</p>`}
  <textarea id="ta" placeholder="Cevabınızı veya anahtar noktaları buraya yazabilirsiniz..."></textarea>
  <div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn" id="sk">Cevap anahtarını göster</button><button class="btn ghost" id="nq">${isCase?'Başka vaka':'Rastgele yeni soru'} →</button></div>
  <div id="keys"></div>
  <details style="margin-top:22px"><summary>Tüm ${isCase?'vakalar':'sorular'} listesi</summary><div class="iv-list">${pool.map((y,j)=>`<button data-j="${j}">${y.u}. ünite · ${esc(isCase?y.title:y.q)}</button>`).join('')}</div></details>
  </div>`;
  const total=isCase?300:180; let left=total;
  $('#ts').onclick=()=>{ if(timerId){clearInterval(timerId);timerId=null;$('#ts').textContent='Devam';return}
   $('#ts').textContent='Durdur'; timerId=setInterval(()=>{left--; const a=Math.abs(left); const t=(left<0?'-':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0'); const el=$('#tm'); if(!el){clearInterval(timerId);return} el.textContent=t; el.classList.toggle('over',left<0)},1000)};
  $('#sk').onclick=()=>{
   $('#keys').innerHTML=`<h3 style="margin-top:20px">Cevap anahtarı</h3><p class="muted">Cevabınızda yer alan noktaları işaretleyin.</p><div class="keys">${x.k.map((k,j)=>`<label class="kp"><input type="checkbox" data-j="${j}"><span>${esc(k)}</span></label>`).join('')}</div><div class="score-bar" id="ks"><span>Kapsanan nokta: 0 / ${x.k.length}</span></div>`;
   $('#sk').disabled=true;
   ex.querySelectorAll('.kp input').forEach(c=>c.onchange=()=>{c.parentElement.classList.toggle('on',c.checked); const n=ex.querySelectorAll('.kp input:checked').length; const pct=Math.round(n/x.k.length*100); $('#ks').innerHTML=`<span>Kapsanan nokta: ${n} / ${x.k.length} · %${pct}</span><span class="muted">${pct>=80?'Tam puana yakın':pct>=50?'Orta':'Eksik'}</span>`});
  };
  $('#nq').onclick=()=>{p=(p+1)%order.length; if(p===0)order=shuffle(order); draw(order[p])};
  ex.querySelectorAll('.iv-list button').forEach(b=>b.onclick=()=>{draw(+b.dataset.j);window.scrollTo({top:$('#ex').offsetTop-80,behavior:'smooth'})});
 }
 draw(order[0]);
}

/* ---------- ROUTER ---------- */
function route(){
 if(timerId){clearInterval(timerId);timerId=null}
 cardKeys=null;
 const h=location.hash.slice(1)||'ana';
 let m;
 if((m=h.match(/^unite-(\d+)$/)))unit(+m[1]);
 else if(h==='sinav')exam();
 else if((m=h.match(/^sinav-(test|dy|eslestir|kartlar|mulakat|vaka)$/))){const keepScroll=document.querySelector('.modes'); exam(m[1]); if(keepScroll)window.scrollTo(0,0)}
 else home();
 if(!h.startsWith('sinav'))window.scrollTo(0,0);
 alt(false); ozet(false);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
</html>
