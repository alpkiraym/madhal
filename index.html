id:'u5', no:5, title:'Yaşayan Ehl-i Sünnet Mezhepleri', ar:'المذاهب السنية الباقية',
lead:'Dört Sünnî mezhebin imamlarını, kaynak sıralarını, hocalarını, talebelerini ve tedvin süreçlerini; ayrıca Zeydiyye, Ca\'feriyye ve silinen mezhepleri tanıyacağız.',
html:`
<div class="mezhep">
<h3>Ebû Hanîfe (80-150)</h3>
<p>Nu'mân b. Sâbit; Kûfe doğumlu, aslen Farisî. Önce kumaş ticareti yaptı. Kûfe'de re'y ile meşhur oldu; zamanında re'y ve kıyasın sancaktarı addedildi.</p>
<ul><li>Tevakkuf etmeyip hüküm istinbat etti; naslardan illetler çıkararak farazi meseleler oluşturdu ve illet devam ettiği sürece kıyası uyguladı. Bu yüzden "İmâmü'l-kıyâsiyyîn" denir.</li></ul>
<div class="grid2">
<div class="card-s"><h4>Kaynakları</h4><p class="flow">Kitap → Sünnet → Sahabe kavli → İçtihat</p><p>İçtihat hem kıyası hem istihsanı kapsar. Senedi sahih ise mürseli kıyasa tercih eder.</p>
<blockquote>"Hükmü Kitap'ta bulursam alırım; bulamazsam Sünnet'e bakarım; orada da bulamazsam sahabe kavline bakar, dilediğimi alır dilediğimi almam. Sahabe sözünden sonra başka söze ihtiyaç duymam. Ama iş tâbiîne gelince, onlar nasıl içtihat ettiyse ben de içtihat ederim."</blockquote></div>
<div class="card-s"><h4>Hadis hakkındaki görüşü</h4><p>Diğerlerine göre az hadis rivayet etti; çünkü Irak'ta uydurma hadis çoktu, sıhhatin tespiti için ağır şartlar koştu. Hadis ona ulaşmamış veya sıhhati sabit olmamışsa kıyası öne aldı.</p>
<h4>Yöntem ve eğitim anlayışı</h4><p>Meseleyi öğrencilerine sunar, mecliste tartışılır, varılan sonucu yazdırırdı. Hanefî mezhebi <b>şûra ile işleyen kolektif bir mezheptir</b>.</p>
<h4>İstinbat usulü</h4><p>Tedvin edilmedi; öğrencileri fer'î hükümlerden usulü çıkardı.</p></div>
</div>
<div class="grid2">
<div class="card-s"><h4>Hocaları</h4><ol><li>Hammâd b. Ebî Süleyman</li><li>İbrâhim en-Nehaî</li><li>Alkame b. Kays en-Nehaî</li><li>Abdullah b. Mes'ûd</li><li>Zeyd b. Ali Zeynelâbidîn</li><li>Ca'fer es-Sâdık</li><li>Abdullah b. Hasan</li></ol><p class="muted">İlk dördü bir rivayet zinciridir: İbn Mes'ûd → Alkame → Nehaî → Hammâd → Ebû Hanîfe.</p></div>
<div class="card-s"><h4>Talebeleri</h4><ol><li><b>Ebû Yûsuf</b> (ö.182): <i>Kitâbü'l-Harâc, İhtilâfü'l-emsâr, er-Red alâ Mâlik b. Enes</i>. Kadılkudat oldu; Hanefîlikte ilk kitap yazan.</li><li><b>Muhammed b. Hasan eş-Şeybânî</b> (ö.189): <i>Zâhirü'r-rivâye, Nâdirü'r-rivâye</i>; mezhebin tedvincisi.</li><li><b>Züfer b. Hüzeyl</b></li><li><b>Hasan b. Ziyâd el-Lü'lüî</b></li></ol></div>
</div>
<table class="t"><tr><th>Zâhirü'r-rivâye (6 kitap)</th><td>el-Mebsût (el-Asl), ez-Ziyâdât, el-Câmiu'l-kebîr, el-Câmiu's-sağîr, es-Siyerü'l-kebîr, es-Siyerü's-sağîr. Hâkim eş-Şehîd (ö.334) <i>el-Kâfî</i>'de topladı, Serahsî <i>el-Mebsût</i>'ta şerh etti.</td></tr>
<tr><th>Nevâdir</th><td>Keysâniyyât, Hârûniyyât, Cürcâniyyât, Rakkıyyât, Ziyâdâtü'z-ziyâdât.</td></tr>
<tr><th>Terimler</th><td>Şeyhayn: E. Hanîfe + E. Yûsuf · İmameyn/Sâhibeyn: E. Yûsuf + Muhammed · Tarafeyn: E. Hanîfe + Muhammed</td></tr></table>
</div>

<div class="mezhep">
<h3>İmam Mâlik (93-179)</h3>
<p>Mâlik b. Enes, aslen Yemenli, Medine imamı. Hac ve umre dışında Medine'den ayrılmadı. Yetmiş fakihin ehliyetine şahitlik etmesinden sonra ders vermeye başladı. Hem Emevî hem Abbasî dönemlerinde tarafsız kaldı; 146'da Medine valisinin emriyle kırbaçlandı, Mansûr özür diledi. Derslerinde yüksek sesle konuşulmasına ve tartışmaya izin vermezdi.</p>
<div class="grid2">
<div class="card-s"><h4>Fetva usulü</h4><ol><li>Farazi olaylara cevap vermez.</li><li>Re'ye ihtiyaç olunca başvurur.</li><li>Hadis-i şerif ve fetvaları imlâ ettirir.</li><li>Talebeleriyle münakaşa etmez, onların görüşleri yazılmaz.</li><li>Medine halkının uygulamasını, ona ters düşen haber-i âhâda tercih eder.</li></ol></div>
<div class="card-s"><h4>Kaynakları</h4><p class="flow">Kitap → Sünnet → İcma → Ehl-i Medine ameli → Kıyas → Sahabe kavli → Mesalih-i mürsele → Örf-âdet → Sedd-i zerâi → İstihsan → İstishâb</p></div>
</div>
<div class="grid2">
<div class="card-s"><h4>Hocaları</h4><ol><li>Abdurrahman b. Hürmüz</li><li>İbn Şihâb ez-Zührî</li><li>Ebü'z-Zinâd</li><li>Yahyâ b. Saîd</li><li>Rabîatü'r-re'y</li><li>Ca'fer b. Muhammed el-Bâkır (es-Sâdık)</li></ol></div>
<div class="card-s"><h4>Talebeleri</h4><ol><li>Abdullah b. Vehb</li><li>Abdurrahman b. el-Kâsım el-Mısrî</li><li>Eşheb b. Abdülaziz el-Kaysî</li><li>Ebü'l-Hasen el-Kurtubî</li><li>Esed b. Furât</li></ol><p class="muted">İmam Şâfiî ve İmam Muhammed de ondan ders aldı.</p></div>
</div>
<h4>Tedvin: el-Muvatta' ve el-Müdevvene</h4>
<p><b>el-Muvatta'</b>: Hadis, sahabe fetvaları, tâbiîn sözleri ve Malik'in görüşleri; bablara göre, kırk yılda. <b>el-Müdevvene</b>: Medine'de Malik'in ders halkasına katılan <b>Esed b. Furât</b> farazi meselelere dair çok soru sorunca Malik onu Irak'a yönlendirdi. Esed Irak'ta İmam Muhammed'den yararlandı; Malik'in vefatından sonra Mısır'a gidip Irak'ta öğrendiği meseleler hakkında Malik'in görüşlerini derlemek istedi. İbn Vehb ve Eşheb ile görüştükten sonra Malik'in fıkhına en yakın bulduğu <b>İbnü'l-Kâsım</b> ile çalıştı. İbnü'l-Kâsım, Malik'in görüşünü bilmediği yerde tahrîc ile hüküm verdi. Ortaya çıkan altmış bölümlük esere <b>el-Esediyye</b> denir. <b>Sahnûn</b> bu eseri yeniden tasnif etti, hadis ve eserler ekledi, diğer öğrencilerin rivayetleriyle zenginleştirdi; çıkan metne <b>el-Müdevvene</b> denildi.</p>
<p class="muted">Diğer temel kitaplar: Halîl b. İshak'ın <i>Muhtasar</i>'ı (mezhebin en meşhur metni), Harâşî ve Derdîr şerhleri, Desûkî haşiyesi, Karâfî'nin <i>ez-Zahîra</i>'sı. Yayıldığı yerler: Kuzey Afrika, Endülüs, Mısır, Sudan.</p>
</div>

<div class="mezhep">
<h3>İmam Şâfiî (150-204)</h3>
<p>Muhammed b. İdrîs; Gazze doğumlu, Mısır'da vefat etti. İki yaşında babasını kaybetti, Mekke'de büyüdü, 10-12 yaşında Muvatta'ı ezberledi; dokuz yıl Malik'ten okudu. Yemen'de Râfızîlikle suçlanıp 184'te Bağdat'a getirildi, İmam Muhammed'in araya girmesiyle beraat etti. 195'te Bağdat'ta <i>er-Risâle</i>'yi yazdı; 199'da Mısır'a geçti.</p>
<ul><li>Ehl-i hadis ile ehl-i re'yin ortasındadır.</li><li>Âhâd hadisi mürsele ve kıyasa tercih eder; Hanefîlerin şart koştuğu gibi umûmü'l-belvâda şöhret şartı aramaz.</li><li>Medine amelini şart koşmaz.</li><li>Saîd b. el-Müseyyeb gibi önde gelen tâbiîn dışındakilerin mürselini hüccet almaz.</li></ul>
<div class="grid2">
<div class="card-s"><h4>Usulü</h4><p class="flow">Kitap → Sünnet → İcma → Sahabe kavli → Râşid halifeler → Kıyas</p><p><b>Not:</b> İstihsan, mesalih-i mürsele ve ehl-i Medine ameliyle istidlali reddeder (<i>İbtâlü'l-istihsân</i>).</p></div>
<div class="card-s"><h4>Tedvin</h4><ol><li><i>er-Risâle</i>: Fıkıh usulünde bize ulaşan ilk eser.</li><li><i>el-Ümm</i>: Fıkıh; kavl-i cedîd.</li><li><i>el-Hucce</i>: Kavl-i kadîm.</li></ol><p class="muted">Irak'taki görüşleri <b>mezheb-i kadîm</b>, Mısır'daki değişen görüşleri <b>mezheb-i cedîd</b>.</p></div>
</div>
<div class="grid2">
<div class="card-s"><h4>Hocaları</h4><ol><li>Müslim b. Hâlid ez-Zencî</li><li>Mâlik b. Enes</li><li>Ömer b. Ebû Seleme</li><li>Yahyâ b. Hassân</li><li>Muhammed b. Hasan eş-Şeybânî</li></ol></div>
<div class="card-s"><h4>Öğrencileri</h4><ol><li>Za'ferânî (Irak)</li><li>Kerâbîsî (Irak)</li><li>İsmâil b. Yahyâ el-Müzenî (Mısır)</li><li>Ebû Ya'kūb el-Büveytî (Mısır)</li><li>Rebî' b. Süleyman el-Murâdî (Mısır)</li></ol></div>
</div>
<p class="muted">Sonraki temel eserler: Mâverdî <i>el-Hâvî</i>, Gazzâlî <i>el-Vecîz</i>, Şîrâzî <i>el-Mühezzeb</i>, Nevevî <i>el-Mecmû'</i> ve <i>el-Minhâc</i>; Minhâc şerhleri: İbn Hacer el-Heytemî <i>Tuhfe</i>, Şirbînî <i>Muğni'l-muhtâc</i>, Remlî <i>Nihâye</i>.</p>
</div>

<div class="mezhep">
<h3>Ahmed b. Hanbel (164-241)</h3>
<p>Ebû Abdullah Ahmed b. Hanbel; Bağdat doğumlu ve vefatlı. Mekke, Medine, Şam ve Yemen'e ilim yolculukları yaptı; Şâfiî'den fıkıh okudu. Halku'l-Kur'an meselesinde <b>mihne</b> döneminde işkenceye maruz kaldı (Me'mûn ve Mu'tasım dönemlerinde iki yılı aşkın hapis). <i>el-Müsned</i> 40.000'den fazla hadis içerir. Şâfiî: "Bağdat'tan ayrıldığımda arkamda Ahmed'den daha fakih birini bırakmadım."</p>
<ul><li>Sahabe kavlinde ihtilaf varsa Kitap ve Sünnete en yakın olanı tercih eder.</li><li>Delil yoksa kıyastan önce mürsel ve zayıf hadise başvurur; zayıf hadis kıyastan kuvvetlidir.</li><li>Kıyasa en son başvurur.</li></ul>
<div class="grid2">
<div class="card-s"><h4>Usulü</h4><p class="flow">Kitap → Sünnet → Sahabe fetvası → Mürsel ve zayıf hadis → Kıyas</p><h4>Tedvin</h4><p>Görüş ve fetvalarını yazmayı kerih gördüğü için fıkıh eseri telif etmedi; öğrencileri derledi. Görüşleri <b>rivâyât</b> (doğrudan), <b>tenbîhât</b> (işaret) ve <b>vücûh</b> (içtihatlarından çıkarılan) olarak nakledilir.</p></div>
<div class="card-s"><h4>Hocaları</h4><ol><li>Süfyân b. Uyeyne</li><li>Yahyâ b. Saîd el-Kattân</li><li>Abdurrahman b. Mehdî</li><li>İmam Şâfiî</li><li>Abdürrezzâk b. Hemmâm</li><li>Vekî' b. Cerrâh</li></ol></div>
</div>
<div class="card-s"><h4>Talebeleri ve mezhep âlimleri</h4><ol><li>Ahmed b. Muhammed b. Hârûn</li><li>Ebû Bekir el-Hallâl (<i>el-Câmi'</i>)</li><li>el-Merrûzî</li><li>Ebü'l-Kâsım el-Hırakî (<i>el-Muhtasar</i>, mezhebin en meşhur metni)</li><li>İbn Kudâme el-Makdisî (<i>el-Muğnî</i>, Hırakî şerhi)</li><li>İbn Teymiyye</li><li>İbnü'l-Kayyim</li><li>Muhammed b. Abdülvehhâb (Vehhâbîliğin kurucusu)</li></ol><p class="muted">Hadisçi öğrencileri arasında Buhârî, Müslim, Ebû Dâvûd da sayılır.</p></div>
</div>

<h2>Diğer Mezhepler (tamamlayıcı bilgi)</h2>
<div class="grid2">
<div class="mezhep"><h3>Zeydiyye — Zeyd b. Ali (ö.122)</h3><p>Ebû Hanîfe'nin de hocaları arasında sayılır. Dört mezhebe çok yakındır. <i>el-Mecmû'</i>; el-Hâdî Yemen'de Zeydî devletini kurdu. Usul: Kitap, Sünnet, icma, kıyas, istihsan, maslahat, akıl. Yemen.</p></div>
<div class="mezhep"><h3>Ca'feriyye — Ca'fer es-Sâdık (ö.148)</h3><p>İmâmiyye'nin 6. imamı; Ebû Hanîfe ve Malik'in hocaları arasında sayılır. Kaynaklar: Kitap, Sünnet (imamların sözleri dahil), icma, akıl. Dört temel kitap: <i>el-Kâfî, Men lâ yahduruhu'l-fakîh, et-Tehzîb, el-İstibsâr</i>.</p></div>
</div>
<h3>Bağlısı kalmamış müctehitler <span class="ar">المذاهب المنقرضة</span></h3>
<table class="t">
<tr><th>Müctehit</th><th>Vefat / Bölge</th></tr>
<tr><td>Hasan el-Basrî</td><td>110, Basra</td></tr>
<tr><td>İbn Ebî Leylâ</td><td>148, Kûfe</td></tr>
<tr><td>Evzâî</td><td>157, Şam</td></tr>
<tr><td>Süfyân es-Sevrî</td><td>161, Kûfe</td></tr>

<tr><td>Süfyân b. Uyeyne</td><td>198, Hicaz</td></tr>
<tr><td>İshâk b. Râhûye</td><td>238, Nişabur</td></tr>
<tr><td>Ebû Sevr</td><td>240, Bağdat</td></tr>
<tr><td>Dâvûd ez-Zâhirî (İbn Hazm, <i>el-Muhallâ</i>)</td><td>270, Kûfe/Bağdat</td></tr>
<tr><td>Taberî</td><td>310</td></tr>
</table>

UNITS.push({
id:'u6', no:6, title:'Mülkiyet Teorisi: Malın Tanımı ve Haklar', ar:'نظرية الملكية: تعريف المال',
lead:'Malın üç tanımını, muhtar tanımdan çıkan sonuçları ve hak ile menfaatlerin mal sayılıp sayılmayacağı tartışmasını sonuçlarıyla birlikte öğreneceğiz.',
html:`
<h2>1. Malın Tanımları <span class="ar">المال</span></h2>
<table class="t">
<tr><th>Tanım</th><th>Değerlendirme</th></tr>
<tr><td><b>1. Hanefî tanımı:</b> İnsan tabiatının meyledip ihtiyaç zamanı için biriktirilebilen şey. <span class="ar">ما يميل إليه الطبع ويمكن ادخاره لوقت الحاجة</span></td><td>Yeşillik ve ilaç gibi tabiatın istemediği ama mal olan şeyleri ve menfaati kapsamadığı için eleştirilmiştir.</td></tr>
<tr><td><b>2.</b> Âdemoğlunun maslahatı için yaratılmış, ihrazı mümkün ve ihtiyarla tasarruf edilebilen, insan dışındaki her şey.</td><td>Tasarrufa imkân vermesi ve mütekavvim olması şartı eklenmiş; domuz ve şarap zimmîler için mal sayılmıştır.</td></tr>
<tr><td><b>3. Muhtar tarif:</b> Hiyâzeti ve mutad yolla kendisinden faydalanılması mümkün her şey. <span class="ar">المال كل ما يمكن حيازته والانتفاع به على وجه معتاد</span></td><td>Tercih edilen tanım.</td></tr>
</table>

<h2>2. Muhtar Tarife Göre Çıkarsamalar</h2>
<ol>
<li>Fiilen ihraz edip faydalandığımız her şey maldır: ev, arazi, araba.</li>
<li>Fiilen ihraz etmediğimiz ama hiyâzeti mümkün olanlar maldır: sudaki balık, havadaki kuş, topraktaki maden.</li>
<li>Fiilen faydalansak bile hiyâzeti mümkün olmayanlar mal değildir: güneş ışığı, ayın nuru.</li>
<li>Mutad yolla faydalanamadığımız şeyler ihraz etsek bile mal değildir: bir damla su, bir pirinç tanesi.</li>
<li>Fiilen faydalanıp ihraz etsek bile Şâri tarafından umumi bir yasak varsa mal sayılmaz: eceliyle ölmüş hayvan (meyte). Ancak tabaklanan derisi mal olur. Bazıları için yasak, bazıları için caiz olan (şarap) ise mal sayılır.</li>
</ol>

<h2>3. Haklar ve Menfaatler Mal Sayılır mı?</h2>
<div class="grid2">
<div class="card-s"><h4>Mal ile ilgisi olmayan haklar</h4><p>İttifakla mal sayılmaz: <b>hidâne</b> (çocuk bakımı), velayet hakkı.</p></div>
<div class="card-s"><h4>Mal ile ilgili haklar ve menfaatler</h4><p>İhtilaflıdır: su içme (şirb), geçiş (mürûr) hakkı; evde oturma, aracı kullanma menfaati.</p></div>
</div>
<div class="grid2">
<div class="card-s"><h4>Hanefîler: Mal olarak itibar etmez</h4><ul>
<li>Kendi tanımlarında menfaati mal saymamışlardı: menfaat <b>hiyâzet ve biriktirmeyi kabul etmez</b>; süreç boyunca doğar ve anlık olarak yok olur.</li>
<li>Varlıklar ya cevher ya arazdır; menfaat arazdır. Arazı madde saymak hakikati değiştirmektir.</li>
<li>İcâre gibi akitlerde menfaatin mal sayılması ihtiyacın baskısıyla oluşmuş <b>istihsan</b> kaynaklı bir hükümdür; bu tasarruflar üzerinden menfaatleri mal kapsamına almak isabetli değildir.</li>
<li>İcâre <b>kıyasa aykırı</b> (alâ hilâfi'l-kıyâs) caiz olduğu için diğer menfaatler ona kıyas edilmez.</li>
</ul></div>
<div class="card-s"><h4>Cumhur: Mal olarak itibar eder</h4><ul>
<li>Mal âdemoğlunun maslahatı için yaratılmıştır; menfaatler de böyledir. Eşya menfaati sebebiyle mal sayılırken asıl olan menfaati mal saymamak makul değildir.</li>
<li>Menfaatin hiyâzeti, aslının ve mahallinin hiyâzeti ile mümkündür.</li>
<li>Şâri menfaati (Kur'an öğretimini) <b>mehir</b> kılmıştır; mehir ise ancak mal olabilir.</li>
<li>İcâre akdinde menfaat tazmin edilir.</li>
</ul></div>
</div>
<div class="box note"><b>Tercih:</b> Hukuk sistemleri öteden beri menfaati esas alan akitlerde menfaatleri mal saymıştır. Tasarruf kavramının kendisi de şer'î bir varsayım olduğundan menfaatin aynı anlayışla mal sayılması daha uygundur; pek çok işlemi istihsan üzerinden kural dışı kabul etmek doğru değildir. Günümüz araştırmacılarının tercihi cumhurun görüşüdür.</div>

<h2>4. İhtilafın Pratik Sonucu</h2>

</table>

UNITS.push({
id:'u8', no:8, title:'Mülkiyet ve Milk Çeşitleri', ar:'الملك وأنواعه',
lead:'Mülkiyetin tanımını, özel mülkiyete konu olmayan malları, milk-i tam ve milk-i nâkısı, menfaat mülkiyeti ile ibâha farkını ve şahsî yararlanma hakkının hükümlerini öğreneceğiz.',
html:`
<h2>1. Mülkiyet <span class="ar">الملك</span></h2>
<div class="box key">Şer'î bir engel bulunmadığında <b>tek başına yararlanma ve tasarrufta bulunma imkânını</b> tanıyacak şekilde, şey ile bir kişi arasındaki aidiyet ilişkisi.<p class="ar">اختصاص بالشيء يمنع الغير منه ويمكّن صاحبه من التصرف فيه ابتداءً إلا لمانع شرعي</p></div>
<ul>
<li>İnsan bir malı kazanır, elde eder ve şer'an ondan yararlanma hakkına sahip olursa ona <b>mâlik</b> denir.</li>
<li>Deli için kayyım, sabi ve sefih için veli, idare ettikleri malların mâliki değildir; delilik, küçüklük gibi engel kalkınca yetkileri biter: <span class="ar">إذا زال المانع عاد الممنوع</span></li>
<li>Hanefîlere göre mülk, mülkiyete konu olan her şeydir; menfaati de kapsar. Menfaat mal değildir ama mülke konu olur; bu yüzden mülk maldan geniştir.</li>
</ul>
<div class="box note"><b>Özel mülkiyete konu olmayan mallar:</b> Umumi yollar, büyük nehirler, köprüler, vakıf malları, devlet malları, kamunun ortak kullanımına açık ve kamunun ihtiyaç duyduğu mallar.</div>

<h2>2. Milk Çeşitleri</h2>
<div class="tree">
<div class="node root">Milk</div>
<div class="branch">
<div><div class="node">Milk-i tam <span class="ar">الملك التام</span><small>Ayn + menfaat</small></div>
<div class="branch"><div><div class="node s">Miras</div></div><div><div class="node s">Şuf'a</div></div><div><div class="node s">İşgal ve ihya</div></div><div><div class="node s">Akit</div></div></div></div>
<div><div class="node">Milk-i nâkıs <span class="ar">الملك الناقص</span><small>Yalnız ayn veya yalnız menfaat</small></div>
<div class="branch"><div><div class="node s">Sadece ayn (rakabe)</div></div><div><div class="node s">Sadece menfaat<small>Aynî ve şahsî yararlanma hakkı</small></div></div></div></div>
</div></div>

<div class="grid2">
<div class="card-s"><h4>Milk-i tam</h4><p>Bir şeyin hem aynı hem de menfaati üzerinde tasarruf hakkına sahip olmak. Bu yüzden satma, ekme, kiralama, rehin bırakma gibi tüm tasarruflarda mutlak yetkisi vardır.</p>
<p><b>Edinme yolları:</b> miras, şuf'a, işgal ve ihya (maden ve hazineler, otlar ve makiler, ölü araziyi ihya, avlanma – hakiki ve hükmî), akit (emek yoluyla ticaret; hibe, mehir, ayn vasiyeti).</p>
<p class="muted"><b>Emeksiz mülk sahibi olma yolları:</b> miras, ödül, zekât, sadaka, diyet, ganimet, ikta', lukata, muhâlaa bedeli, mehir, nafaka, hibe (bunların bir kısmı akit yoluyla edinmeye de örnektir).</p></div>
<div class="card-s"><h4>Milk-i nâkıs</h4><p>Bir şeyin ya yalnız rakabesine (aynına) ya da yalnız menfaatine sahip olmak. Örneğin tarlasını kiraya veren, kira geliri hariç tarlasından faydalanma yetkisini icâre süresince yitirir.</p></div>
</div>

<h2>3. Sadece Ayn (Rakabe) Mülkiyeti <span class="ar">ملك الرقبة</span></h2>
<p>Malın menfaatine değil yalnız aynına sahip olmak; örneğin menfaati belli süreyle vasiyet edilen mal: rakabe mirasçılara, menfaat vasiyet edilene geçer.</p>
<ol>
<li>Menfaat sahibinin hakkı süresince rakabe mâlikinin yararlanma hakkı yoktur.</li>
<li>Bu sürede menfaat sahibinin zararına tasarruf yapamaz.</li>
<li>Rakabe mâliki ölünce mülkiyet varislerine geçer (miras kalır).</li>
<li>Malik veya başkası malı itlaf ederse menfaat bedelini menfaat sahibine öder.</li>
<li>Sonunda tam mülkiyete döner.</li>
</ol>

<h2>4. Sadece Menfaat (Milk-i Menfaat)</h2>
<p>Bir şahsın yalnız yararlanması. İki durum vardır:</p>
<div class="grid2">
<div class="card-s"><h4>1. Başkasını yararlandırmaya da malik olur</h4><p>Vasiyet eden "dilediğin gibi" bunun menfaatini sana vasiyet ettim derse kişi ister kendisi yararlanır, ister icâre veya iâre yoluyla başkasını yararlandırır.</p></div>
<div class="card-s"><h4>2. Yalnız kendisi yararlanır</h4><p>Buna benzer izinlerin dışında kişi menfaatten yalnız kendisi yararlanabilir.</p></div>
</div>
<div class="box note"><b>Mezhep farkı:</b> Hanefîler iki duruma da <b>milk-i menfaat</b> veya <b>hakku'l-intifâ'</b> der. Mâlikîler birinci duruma milk-i menfaat, ikinci duruma hakku'l-intifâ' der.</div>

<h2>5. Milk ile İbâha Arasındaki Fark</h2>
<p><b>Milk</b>, şer'î bir mâni bulunmaksızın elde edilen şeyde tasarruf hakkını sahibinin kesbedebilmesidir. <b>İbâha</b> ise yararlanma izni ile sabit olan bir haktır; menfaati tahsil için bir ruhsattan ibarettir ve başkasına devredilemez (Mecelle md. 836).</p>
<div class="grid3">
<div class="card-s"><h4>Malikin izni</h4><p>Arabayla giderken yoldan yolcu almak.</p></div>
<div class="card-s"><h4>Toplum için genel izin</h4><p>Umumi yollar, nehirler ve denizler.</p></div>
<div class="card-s"><h4>Şer'î hükümle izin</h4><p>"İnsanlar üç şeyde ortaktır: su, ot, ateş" hadisi.</p></div>
</div>
<ul><li>Düğüne yemeğe çağrılan, yemekten yanına alıp götüremez.</li><li>"İzin", "menfaat mülkiyeti" sayılmaz.</li><li>Menfaat mâlikleri arasındaki ortaklığa <b>şirket-i milk</b>, ibâha ile ortak olanların ortaklığına <b>şirket-i ibâha</b> denir.</li></ul>

<h2>6. Şahsî Yararlanma Hakkı <span class="ar">حق الانتفاع الشخصي</span></h2>
<p>Bölümleri (doğuran sebepler): <b>vasiyet, vakıf, iâre, icâre.</b></p>
<div class="grid3">
<div class="card-s"><h4>Hükümleri</h4><ol><li>Zaman, mekân ve sıfat ile kayıtlanmayı kabul eder.</li><li>Hanefîlere göre mirasa intikal etmez.</li><li>Ayn, menfaat sahibine teslim edilir; o da emanet hükümleriyle korur.</li><li>Âriyet ve vasiyet gibi ücretsiz ise bakım-onarım gibi giderleri menfaat sahibi karşılar.</li><li>Süre dolunca ayn malikine geri verilir.</li></ol></div>
<div class="card-s"><h4>Notlar</h4><ul><li>Vakıfta giderler vakfa aittir.</li><li>Âriyet ve vasiyette faydalanana aittir.</li><li>Rehin ve icârede vergi ve binek nafakası aynın malikine aittir.</li><li><b>Yalnız iârede</b> süre dolmadan iptal edilebilir.</li></ul></div>
<div class="card-s"><h4>Bitimi</h4><ol><li>Müntefi'in vefatı (Hanefîlere göre miras kalmaz).</li><li>Aynın malikinin vefatı (vasiyet ve vakfı etkilemez).</li><li>Yararlanma süresinin bitimi.</li><li>Ayn helak olur veya kullanıma engel bir kusur çıkarsa.</li></ol></div>
</div>
<p class="muted">Müîr (ödünç veren), vâkıf, vasî ve mûcir sözleşmede sınırlama koymadıysa menfaat sahibi menfaati devredebilir; örneğin kiraladığı evi başkasına kiraya verebilir. Âriyet alan ise ödünç verebilir ama kiraya veremez.</p>
`,

UNITS.push({
id:'u9', no:9, title:'İrtifak Hakları ve Milk-i Tam', ar:'حقوق الارتفاق والملك التام',
lead:'Aynî yararlanma haklarını (şirb, mecra, mesîl, teallî, mürûr, civar), bunları doğuran sebepleri, şahsî intifa hakkından farkını ve milk-i tamın özellik ve sınırlarını öğreneceğiz.',
html:`
<h2>1. Aynî Yararlanma Hakkı (Hakku'l-İrtifak) <span class="ar">حق الارتفاق</span></h2>
<p>Malikine bakılmaksızın akar üzerinden devam eden haklardır. Bir akar (hâkim akar) lehine, başkasına ait diğer bir akar (hâdim akar) üzerinde kurulur.</p>
<ul><li>Gayrimenkule tabidir.</li><li>Akar kimin olursa ona intikal eder.</li><li>Akardaki değişiklik bağlı haklarda değişikliğe yol açar.</li></ul>

<h3>a) Şirb (su hakkı) <span class="ar">حق الشرب</span></h3>
<p><b>Şirb</b>: tarla sulama; <b>şürb (şefe)</b> <span class="ar">حق الشفة</span>: su içme. Üç kısım su vardır:</p>
<table class="t">
<tr><th>Su</th><th>Hüküm</th></tr>
<tr><td><b>1. Kimsenin mülkünde olmayan umumi sular</b> (Dicle, Fırat)</td><td>Başkasının hakkına zarar vermedikçe herkesin şirb ve şürb hakkı vardır. Ancak büyük bir makine getirip suyun tamamını kendine çekemez: <span class="ar">لا ضرر ولا ضرار</span></td></tr>
<tr><td><b>2. Özel mülk içindeki kuyu, göze, kanal suları</b></td><td>Herkesin şürb (içme) hakkı vardır; engellenirse zorla alır. Fakat şirb (sulama) hakkı yoktur. Su yatağı özel mülk, su mübah maldır. Arazi sahibi arazinin bir kısmını satınca şirb hakkı kendiliğinden doğar.</td></tr>
<tr><td><b>3. Borularda, ibriklerde, özel havuzda ihraz edilmiş sular</b></td><td>Aslen ne şürb ne şirb hakkı vardır. Ancak zorlukta, 1,5 km alanda su bulamayana şürb hakkı doğar; kullandığı kadarını tazmin eder: <span class="ar">الاضطرار لا يبطل حق الغير</span></td></tr>
</table>

<h3>b) Mecrâ hakkı <span class="ar">حق المجرى</span></h3>
<p>Bir akarın menfaati için başka bir akar üzerinden suyu kendi akarına ulaştırma hakkı.</p>
<ol><li>Sulama kanalının yatağı irtifak hakkı sahibinin de, diğer akar sahibinin de olabilir.</li><li>Tarla sahibi, mecrâ hakkı sahibinin suyu tarlasına ulaştırmasına ve kanalı ıslah etmesine engel olamaz.</li><li>Mecrâ hakkı sahibi diğer araziye zarar veremez.</li></ol>

<h3>c) Mesîl hakkı (atık su) <span class="ar">حق المسيل</span></h3>
<p>İhtiyaç fazlası suyu veya kullanılamayacak atık suları yüzeyden veya alttan borularla tahliye hakkı.</p>
<ol><li>Tarla, ev, fabrika gibi akarlardan taşan ya da atılan atık suyun tahliyesi.</li><li>Akar evken tarlaya veya fabrikaya dönüşse de hak devam eder.</li><li>Tahliye kanalının bakımından irtifak hakkı sahibi sorumludur: <span class="ar">الغرم بالغنم</span></li><li>Zarar verirse hak iptal olur.</li></ol>

<h3>d) Kat çıkma hakkı (Teallî) <span class="ar">حق التعلي</span></h3>
<p>Bir kimsenin başkasına ait binanın üzerine kendisine ait yapı inşa etme hakkı.</p>
<ol><li><b>Hanefîlere göre</b> bu hakkın sabit olması için daha önceden bir evin olması gerekir.</li><li>Yıkılırsa veya tasarımı değiştirmek için yıkılırsa yeniden yapılmayı kapsar.</li><li><b>Cumhura göre</b> önceden ev olması gerekmez; kişi kendi evinin üstüne kat çıkma hakkını bir bedelle satabilir.</li><li>Kat çıkma hakkı alt kat yıkılsa bile devam eder.</li><li>Alt kat sahibi bilerek binayı yıkamaz; yıkarsa yeniden inşa etmekle yükümlüdür. Üst katta bu zorunluluk yoktur.</li></ol>

<h3>e) Mürûr (geçiş) hakkı <span class="ar">حق المرور</span></h3>
<div class="grid2">
<div class="card-s"><h4>Umumi yoldan geçiş</h4><ol><li>Başkalarına zarar vermemek kaydıyla herkes için sabittir; tek kayıt budur.</li><li>Yola bakan akar sahibi olmak gerekmez.</li><li>Yola bakan akarlar zarar vermemek kaydıyla pencere ve kapı açabilir; çıkma türü yapılar için Ebû Hanîfe'ye göre yetkiliden izin gerekir.</li></ol></div>
<div class="card-s"><h4>Özel yoldan geçiş</h4><ol><li>Site içi yollar, çıkmaz sokak gibi herkese açık olmayan yollar.</li><li>Geçiş, pencere ve kapı açma hakkı akar sahiplerinindir.</li><li>Yolun mülkiyetinin kime ait olduğu önemli değildir.</li><li>Kullanımı örfe dayalıdır; ortak mal kabilindendir.</li><li>Umumi yola açıksa ihtiyaç halinde umuma açıktır.</li><li>Umumi yolla bağlantı kesildiyse (bariyer) umuma tamamen kapatılabilir.</li></ol></div>
</div>

<h3>f) Komşuluk (civar) hakkı <span class="ar">حق الجوار</span></h3>
<p>Yan yana veya üst üste komşuların birbirine zarar vermeme hakkıdır.</p>
<ol><li>Zarar verecek meslekler icra edilmez.</li><li>Komşunun avlusuna zarar verecek şekilde pencere açılamaz.</li><li>Güneş ışığını kesecek duvar inşa edilemez.</li><li>Duvar dibine kuyu açılamaz.</li><li>Mâlikî ve müteahhir Hanefî fakihlerine göre zarar durumunda tazminle sorumludur.</li></ol>
<div class="box note"><b>Hanefîlerde miras kalan üç hak:</b> (1) irtifak hakları, (2) ayıp muhayyerliği, (3) tayin muhayyerliği.</div>

<h2>2. İrtifak Haklarını Doğuran Sebepler</h2>
<div class="grid3">
<div class="card-s"><h4>Umumi ortaklık</h4><p>Kamuya açık büyük nehirler gibi akarlara bitişik tüm akarlar lehine irtifak hakkı sabit olur.</p></div>
<div class="card-s"><h4>İvazlı akitte şart koşulması</h4><p>Arazinin bir kısmını, müşteri lehine mecrâ ve mesîl hakları bulunma şartıyla satmak.</p></div>
<div class="card-s"><h4>Zamanaşımı (Tekâdüm)</h4><p>İrtifak hakkının tarihinin bilinmemesi, itiraz edilmemiş olması, kanunda dava hakkının düşme süresinin dolması.</p></div>
</div>
<p class="muted">81 sayfalık özette bunlara satım akdi, ihya, izin, komşuluk, âriyet ve vasiyet de eklenir.</p>

<h2>3. İrtifak Hakları ile Şahsî İntifa Hakları Arasındaki Farklar</h2>
<ol>
<li>İrtifak akar, şahsî intifa şahıs lehine kurulur.</li>
<li>İrtifak hakları daima akara bağlıdır; şahsî intifa bazen akara (camiyi içindeki kitaplarla birlikte vakfetmek) ama çoğu zaman şahsa bağlıdır.</li>
<li>İrtifak hakları cumhura göre bir kere kurulduktan sonra süreklidir.</li>
<li>İrtifak hakkı cumhura göre mirasa konu olur.</li>
</ol>

<h2>4. Milk-i Tam</h2>
<p>Bir şeyin aynı anda hem rakabesinin hem menfaatinin milkiyetine sahip olmak.</p>
<div class="grid2">
<div class="card-s"><h4>Özellikleri</h4><ol><li>Belirli bir zamanla kayıtlı olmayıp süresizdir.</li><li>İstimal, istiğlal ve tasarruf hakkı malike aittir.</li><li>Kişi kendi malını telef ettiğinde malikine tazmin yükümlülüğü yoktur. (Bir canlıyı öldürmesi veya israf etmesi durumunda ta'zir ve hacr edilebilir.)</li></ol></div>
<div class="card-s"><h4>Doğası</h4><ol><li>Malikin malı üzerindeki yetkisi vekil veya naibin yetkisine benzer; çünkü gerçekte mülk Allah'ındır.</li><li>Şeriat malın azınlık bir sınıf arasında depolanmasını ve dönmesini kerih görür.</li><li>Malı muhafaza edemeyecek veya güzelce yararlanamayacak kişiye (sefih) teslim etmekten men edilir.</li></ol></div>
</div>
<h3>Sınırlamaları</h3>
<ol>
<li><b>Edinme yolları meşru olmalı</b> (bey', miras); hırsızlık, rüşvet, zimmete geçirme ile mülkiyet kurulmaz.</li>
<li><b>Tasarruf edilecek mecra meşru olmalı</b> (içki vb. alınmaz).</li>
<li><b>Müdahale ihtimali:</b> Devlet, kamunun menfaati veya bir zararı gidermek için, zararını adilce gidermek şartıyla zorla da olsa mala el koyabilir (istimlak).</li>
<li><b>Diğerlerinin hakkı:</b> Kişinin malında diğer Müslümanların da hakkı vardır; en bariz örneği zekâttır.</li>
</ol>
<p class="muted">Ayrıca: ortak ve komşunun şuf'a ile cebren temellük hakkı; zarar doğuran stokçulukta cebri satış; borcunu ödemeyenin malına cebri icra; zorunlu hallerde fiyat belirleme (narh); mülkiyetin başkasına açıkça zarar verecek şekilde kullanılamaması.</p>
`,

UNITS.push({
id:'u10', no:10, title:'Milk-i Tamın Sebepleri: İstîlâ ve Miras', ar:'أسباب الملك التام: الاستيلاء والميراث',
lead:'Milk-i tamı doğuran dört sebebin özelliklerini; mübah mallar üzerindeki istîlâyı (avlanma, ot ve ağaçlar, maden ve kenz, ölü toprağın ihyası) ve mirası öğreneceğiz.',
html:`
<h2>1. Milk-i Tamın Sebepleri ve Özellikleri</h2>
<table class="t">
<tr><th>Sebep</th><th>Özellikleri</th></tr>
<tr><td><b>İstîlâ</b> (mübah mallarda)</td><td>İhtiyarî, fiilî, inşâî (mülkiyeti yoktan doğurur)</td></tr>
<tr><td><b>Akitler</b> (nâkil akitler)</td><td>İhtiyarî, kavlî, nâkil</td></tr>
<tr><td><b>Miras</b></td><td>Cebrî, nâkil, şer'î</td></tr>
<tr><td><b>Şuf'a</b></td><td>İhtiyarî (bir yönüyle cebrî), kavlî, nâkil</td></tr>
</table>
<p class="muted">Bazı yazarlar şuf'ayı ayrı bir sebep saymaz, akit kapsamında ele alır; diğerleri hâkimin devreye girmesi sebebiyle ayrı sebep sayar. İstîlâ fiilî olduğu için çocuk gibi ehliyetsizler de bu yolla malik olabilir.</p>

<h2>2. Mübah Mallar Üzerindeki İstîlâ</h2>
<p><b>Mübah mal:</b> Allah'ın kulları için yeryüzünde, denizde ve havada yarattığı her şeyden şu şartları taşıyanlar: (1) belli bir kişiye ait olmayacak, (2) devlete veya kamunun ortak yararına tahsis edilmeyecek, (3) şer'î bir engel bulunmayacak. Mübah mallar üzerinde umumun <b>şirket-i ibâha</b>sı vardır.</p>
<p><b>İstîlânın özellikleri:</b> Mülkiyet hakkını inşa eden bir tasarruftur; mülkiyet oluştuktan sonra mal kişinin tasarrufunda olur ve ancak nâkil yollarla el değiştirir. Fiilî bir sebeptir. Yalnız mübah mallarda geçerlidir.</p>
<p>Dört türü vardır: <b>sayd, kele ve âcâm, maden ve kenz, ölü toprakların ihyası.</b></p>

<h3>a) Sayd (avlanma) <span class="ar">الصيد</span></h3>
<p>Ürkerek insandan kaçan hayvanı avlamak; kandırma ve hile yoluyla hayvanı tutmak.</p>
<ol><li>Denizde avlanmak daima helaldir; karada avın haram olması (ihram, Harem) dışında helaldir.</li><li>Avlanmanın mülkiyet sebebi olabilmesi istîlânın hakiki olmasına bağlıdır.</li><li>Av köpekleri gibi eğitilmiş (muallem) hayvanların yakaladığı helaldir; salarken veya atış yaparken besmele çekilir.</li><li>Meşru avlanma sonucu ölen hayvan şer'î kesimle kesilmiş gibidir.</li></ol>
<div class="grid2">
<div class="card-s"><h4>Hakiki istîlâ</h4><p>Avın fiilen yakalanması veya tuzağa düşmüş hayvana elini uzatacak kadar yakın olmak.</p><p><b>Hükmü:</b> (1) Kasta gerek olmaksızın mülkiyet sebebidir; deli ve sabinin yakaladığı da buna girer. (2) Sonradan kaçsa mülkiyete zarar vermez; başkası yakalarsa önceki sahibine teslim eder (Hanefî-Şâfiî).</p><p class="muted">Mâlikîler: Ehlileştikten sonra kaçarsa ilk yakalayanın; ehlileşmeden kaçarsa yeniden mübahtır, kim yakalarsa onundur.</p></div>
<div class="card-s"><h4>Hükmî istîlâ</h4><p>Av aletiyle avlanmada av kastının bulunması ya da başka kastın bulunmaması; av aleti dışında bir şeyle ise av kastı şartıyla tuzağa düşen, saçmayla yaralanan avın yakalanması için ilave bir eyleme gerek kalmaması.</p><p><b>Hükmü:</b> (1) Hakiki istîlâ ile tamamlanınca tam mülkiyet olur. (2) Tamamlanmadan kaçarsa mübaha döner. (3) Tuzak avlanma kastı dışında kurulmuşsa (ağ kurutmak) ilk yakalayanın olur.</p><p class="muted">Av kaçmayıp aletteyken başkası alır ve anlaşmazlık çıkarsa mahkeme tuzak sahibi lehine karar verir.</p></div>
</div>

<h3>b) Kele ve Âcâm (otlar ve ağaçlar) <span class="ar">الكلأ والآجام</span></h3>
<div class="grid2">
<div class="card-s"><h4>Kele (otlar)</h4><p>Sahipsiz arazide çıkan veya sahipli arazide su ve benzeri bir eylem yapılmadan biten yabani otlar.</p><ul><li>Muhtaç kişi ihtiyacını sahipsiz arazide gideremezse sahipli araziden giderir, sahibi engel olamaz.</li><li><b>Müteahhir Hanefîler:</b> Sahibinin yetiştirdiği ot özel mülk hükmündedir.</li><li><b>Kâsânî:</b> İnsanlar tarlaları yabani ot için edinmez; otlar şirket-i ibâha üzere kalır.</li><li><b>Zâhirü'r-rivâye:</b> Arazi sahibi sulayarak yetiştirse bile mübahtır; ancak keserse özel mülk olur.</li><li><b>Kâsım b. Sellâm:</b> İbâha sahipsiz arazide geçerlidir; sahipli arazide sahibi hiçbir şey yapmadan çıksa bile arazi sahibinindir. Ama ihtiyaç fazlasını esirgemesi hoş olmaz, muhtacı engellemesi helal değildir.</li></ul></div>
<div class="card-s"><h4>Âcâm (ağaçlar)</h4><p>Sahipsiz arazide yetişen ağaçlar ibâha ortaklığına tabidir. Sahipli arazide ise nasıl yetiştiğine bakılmaksızın özel mülktür; çünkü araziler üretim için edinilir ve ağaç üretimin önemli unsurudur.</p><p><b>Dolayısıyla ot ve ağaçlar iki farklı hükme tabidir.</b></p></div>
</div>

<h3>c) Maden ve Kenz <span class="ar">المعدن والكنز</span></h3>
<p>Madenler Allah tarafından yeraltında yaratılmış altın, gümüş, bakır gibi cevherlerdir. Üç kısımdır:</p>
<ol><li>Çekiçle dövme (<span class="ar">طرق</span>) veya ateşte eritmeyi (<span class="ar">سحب</span>) kabul edenler: altın, gümüş, demir.</li><li>Dövülme ve eritmeyle şekillenemeyenler: elmas, yakut.</li><li>Sıvı haldekiler: cıva, petrol.</li></ol>
<table class="t">
<tr><th colspan="2">Karada çıkan madenler</th></tr>
<tr><td><b>Mâlikîler</b></td><td>Bütün madenler Müslümanların ortak malıdır, devlete aittir. Devlet arazinin üstünü kullanma hakkını verir, altı halkındır. Devlet madeni işletmesi için birine verebilir ama mülk olarak değil. Madenler istîlâyı kabul etmez.</td></tr>
<tr><td><b>Hanefîler</b></td><td>Maden arazinin cüzüdür, cüz küllün hükmüne tabidir: sahipli arazide malike, sahipsiz arazide bulana aittir. Mübah arazideki madenler istîlâyı kabul eder, tam mülkiyet ifade eder. <b>Ebû Hanîfe:</b> Mübah arazide bulunan, dövülme özelliği olan madenlerin 1/5'i devletindir. <b>Ebû Yûsuf ve Muhammed:</b> Arazi gözetmeksizin dövülebilenlerin 1/5'i devletindir. Cıva ve petrol gibi sıvılar çamur ve yeraltı suyu gibidir, devletin hakkı yoktur.</td></tr>
<tr><td><b>Şâfiî ve Hanbelîler</b></td><td>Devletin payı yoktur; maden nisaba ulaşırsa yalnız zekâtı verilir. (1) Külfetsiz elde edilen madenler devletindir, maslahat için işlettirebilir; (2) mübah arazide külfetli olanlar ya devletin ya bulanındır; (3) arazi şahsın ise katılar malikin, sıvılar devletindir.</td></tr>
<tr><th colspan="2">Denizden elde edilen madenler (inci, mercan)</th></tr>
<tr><td><b>Ebû Yûsuf</b></td><td>1/5'i devletindir; ganimet hükmündedir.</td></tr>
<tr><td><b>Ebû Hanîfe</b></td><td>Tamamı bulanındır; çünkü deniz içindekilerle birlikte mübah mal hükmündedir.</td></tr>
</table>
<p><b>Kenz</b> (define) iki kısımdır:</p>
<div class="grid2">
<div class="card-s"><h4>İslami döneme ait</h4><p>Bu döneme ait gömüler <b>lukata</b> hükmündedir, asıl sahibine aittir. İstîlâ kabul etmez, devletin hakkı yoktur. Bulan duyurur, sahibi gelirse iade eder.</p><p><b>Sahibi çıkmazsa:</b> Hanefî – bulan fakirse yararlanır, değilse tasadduk eder; Şâfiî ve Hanbelî – mülkiyetine alıp harcar, sahibi gelirse iade veya tazmin eder; Mâlikî – Müslümanların fethettiği bölgedeyse devletindir.</p></div>
<div class="card-s"><h4>İslam öncesine ait</h4><p>1/5'i devletindir. Kalan kısım: (1) mubah arazide bulan kişinindir; (2) özel mülkte ise İslami dönem içinde bilinen ilk sahibine, yoksa varislerine, o da yoksa devlete aittir.</p></div>
</div>
<p>Hanefî ve Iraklılara göre maden ve kenzin ortak adı <b>rikâz</b> <span class="ar">الركاز</span>'dır.</p>

<h3>d) Ölü Toprağın İhyası <span class="ar">إحياء الأرض الموات</span></h3>
<p><b>Mevat arazinin şartları:</b> (1) Herhangi bir kişinin olmayacak; (2) kimsenin hakkı taalluk etmeyecek; (3) yerleşim bölgesinin dışında olacak (Ebû Yûsuf'a göre; Şâfiîler bu şartı aramaz); (4) herhangi bir sebeple yararlanma konusu olmayacak (çöp atılan yerler gibi).</p>
<p><b>İhya:</b> Ziraat veya imar amacıyla toprakların kullanılabilecek hale getirilmesi; neyin ihya sayılacağını örf belirler. Araziler için tek başına istîlâ yetmez, ihya gerekir.</p>
<div class="box key"><b>Tahcîr</b> <span class="ar">التحجير</span>: Arazi üzerinde ihya için yapılabilecek ön hazırlık (telle çevirme gibi).<ul><li>Mülkiyet hakkı doğurmaz; Hanefî, Şâfiî ve bazı Hanbelîlere göre <b>3 yıllık</b> öncelik sağlar. Süre içinde ihya edilmezse devlet alıp başkasına verir.</li><li>Tahcîr edilen araziyi başkası ihya ederse: ya 3 yıl süre verilen tahcîr eden kişiye verilir ya da ihya edenin olur.</li></ul></div>
<table class="t">
<tr><th>Not</th><th>Görüşler</th></tr>
<tr><td>Devlet izni</td><td><b>Ebû Hanîfe ve Ca'ferîler</b> ihyanın mülkiyeti için devlet iznini şart koşar (anlaşmazlığı önlemek için). <b>Şâfiî, Ahmed b. Hanbel, Ebû Yûsuf ve İmam Muhammed</b> şart koşmaz.</td></tr>
<tr><td>İhya edildikten sonra âtıl kalan arazi</td><td><b>Ebû Hanîfe, Şâfiî ve Hanbelîler:</b> Mülkiyet devam eder. <b>İmam Malik:</b> Yeniden mubah mala döner (nehirden alınan suyu geri dökmek gibi).</td></tr>
<tr><td>İhya edilip sahibi bilinmeyen arazi</td><td><b>Şâfiî ve bir Hanbelî içtihadı:</b> Mubaha dönmez, hazineye geçer. <b>Ebû Hanîfe, Malik ve diğer Hanbelî içtihadı:</b> Tekrar mubah olur.</td></tr>
</table>

<h2>3. Miras <span class="ar">الميراث</span></h2>
<ul>
<li><b>Cebrîlik</b> özelliği vardır: mükellefin değil Şâriin iradesiyle sabittir; icap ve kabul olmaksızın mülkiyeti devreder.</li>
<li>Ölen kişinin mevcut malvarlığı ve alacakları mirasa konudur.</li>
<li>Borçlar miras yoluyla varislere intikal etmez; ölenin malvarlığı varsa oradan ödenir, yoksa varislerin malvarlığına rücu edilmez.</li>
</ul>
<div class="box key"><b>Terekede işlem sırası:</b> Techiz ve tekfin → Borçların ödenmesi → Vasiyetin ifası → Miras paylaşımı</div>
<ul><li>Vasiyet <b>1/3</b> ile sınırlıdır; aşan kısım varislerin onayına bağlıdır.</li><li>Varislerden birinin lehine yapılan vasiyet diğer varislerin onayına bağlıdır.</li><li>Varisi olmayan ölenin varisi hazinedir.</li></ul>
`,

id:'u11', no:11, title:'Şuf\'a Hakkı', ar:'الشفعة',
lead:'Şuf\'anın tanımını, meşruiyet delillerini, hangi mallarda sabit olduğunu, sebeplerini ve öncelik sırasını, şartlarını, talep aşamalarını, ödeme şeklini, müşterinin tasarruflarını ve şuf\'ayı düşüren sebepleri öğreneceğiz.',
html:`
<h2>1. Tanım ve Terimler</h2>
<div class="box key">Bir akarın mülkiyetini, masrafı ile birlikte ilk satış bedelini ödeyerek, istemese bile müşterisinden alabilme hakkı. Mecelle: "Şuf'a, mülk-i müşterâyı (satın alınan mülkü) müşteriye her kaça mal oldu ise o miktar ile temellük etmektir (md. 950)."</div>
<table class="t"><tr><td class="ar" style="width:130px">الشفيع</td><td><b>Şuf'adar (şefî')</b></td></tr><tr><td class="ar">المشفوع به</td><td><b>Meşfû' bih:</b> Şuf'a hakkına sahip akar (hakkın dayandığı akar)</td></tr><tr><td class="ar">المشفوع فيه</td><td><b>Meşfû' fîh:</b> Satılan akar</td></tr></table>
<ul><li>Şuf'a, akitlerdeki <b>rıza ilkesine aykırı</b> olsa da <span class="ar">الضرر يزال</span> (zarar giderilir) ilkesi gereğince uygulanır.</li><li>Müşteri aleyhine de olsa, amaç <b>mefsedetin giderilmesi</b> ilkesiyle alakalıdır: <span class="ar">درء المفاسد أولى من جلب المصالح</span>. Mevcut ortak veya komşunun zararını gidermek, yeni müşterinin yararını korumaktan önce gelir.</li><li>Dolayısıyla bu hak <b>istihsanen</b> sabittir.</li></ul>

<h2>2. Meşruiyetinin Delilleri</h2>
<ul><li>Sünnet ile sabittir. Efendimiz bölünmemiş her şey için şuf'a ile hükmetmiştir; taksim edilmemiş şirket için şuf'a ile hükmetmiştir: <span class="ar">قضى رسول الله ﷺ بالشفعة في كل ما لم يقسم</span></li><li><span class="ar">جار الدار أحق بالدار</span> — "Evin komşusu eve daha layıktır."</li><li><span class="ar">الجار أحق بشفعة جاره ينتظر بها وإن كان غائباً إذا كان طريقهما واحداً</span> — "Komşu, yolları bir ise, gaip de olsa beklenerek komşusunun şuf'asına daha layıktır."</li><li>Ulema şuf'anın meşruiyetinde ittifak etmiştir (icma).</li></ul>
<p>Bu delillerde öne çıkan iki sebep: <b>(1) ortaklık, (2) komşuluk.</b></p>

<h2>3. Hangi Tür Mallarda Sabittir?</h2>
<table class="t">
<tr><th>Mezhep</th><th>Görüş</th></tr>
<tr><td>Hanefî, Hanbelî, Sevrî</td><td>Taksimi kabul etsin etmesin <b>yalnız akarlarda</b> vardır; rivayetler hep akarlardan gelir.</td></tr>
<tr><td>Mâlikî</td><td>Akarlarda ve bazı menkullerde (gemi, sebze, ekin) geçerlidir.</td></tr>
<tr><td>Şâfiî, Ca'ferî</td><td><b>Bölünemeyen akarlarda yoktur</b>; Hz. Ömer'in "Kuyuda şuf'a yoktur" sözü.</td></tr>
<tr><td>Zâhirî</td><td>Bölünsün bölünmesin bütün akarlarda; tarla ile satılsın satılmasın bütün menkullerde sabittir (Efendimiz evde, hayvanda, cariyede şuf'a ile hükmetmiştir).</td></tr>
</table>
<div class="box note"><b>Abdülkerim Zeydan</b> gerekçelerini güçlü bulduğu Zâhirîlerin içtihadını benimser.</div>
<p><b>Akara neler dahildir?</b> Cumhur: arazi ve ona bağlı bina, ağaç gibi tüm müştemilat. Ebû Hanîfe ve Malik: tarladaki ürün tarla ile beraber satılırsa onlarda da şuf'a vardır.</p>

<h2>4. Şuf'a Hakkını Doğuran Sebepler</h2>
<table class="t">
<tr><th>Cumhur</th><th>Zâhiriyye / Mâlikî</th><th>Ca'feriyye</th><th>Hanefî</th></tr>
<tr><td>Sadece rakabede, yani akarda ortaklık</td><td>Rakabede ortaklık; menkul mallar</td><td>Rakabede ortaklık; tarîk (hâs mürûr)</td><td>Rakabede ortaklık; halîd (irtifak) ortaklığı (şirb-i hâs, mesîl-i hâs, tarîk-i hâs); bitişik komşuluk</td></tr>
</table>
<div class="grid2">
<div class="card-s"><h4>Sebeplerin öncelik sıralaması (Hanefî)</h4><ol><li>Rakabede ortaklık</li><li>Halîd (irtifak) ortaklığı: şirb → mürûr → mesîl</li><li>Bitişik komşuluk</li></ol><p class="muted">Şirb: sayılı kişilerin hakkı olan özel sular (büyük nehirde şirb hakkı şuf'a doğurmaz). Mürûr: hak sahiplerinin başkalarının geçişine engel olabildiği yollar (umumi yol şuf'a doğurmaz).</p></div>
<div class="card-s"><h4>Talep sırası</h4><ol><li>Tek şefî' varsa hak onundur.</li><li>Çok şefî' var ama bir talep varsa onundur.</li><li>Çok şefî' ve birden çok talep varsa: üstteki alttakini engeller (hacb); derece aynı ise <b>Hanefî kişi sayısına</b>, <b>cumhur hisse oranına</b> göre böler.</li></ol></div>
</div>
<div class="box key"><b>Notlar:</b><ul><li>Ebû Hanîfe'ye göre rakabe ortaklığında şuf'adarlar mahkemeye başvurur ve meşfû' fîh kişi sayısına göre bölünür (gerekçe: zarar); İmameyn ve çoğunluk fakihlere göre hisseleri oranında pay verilir (gerekçe: şuf'a akarın getirisi gibidir).</li><li>Rakabe ortaklığı bulunan şuf'adar varsa alt mertebedekilere bakılmaz.</li><li>Ebû Yûsuf'a göre alttaki şuf'adarın hakkının sübutu için üst mertebede kimsenin bulunmaması gerekir (mirastaki hacb gibi).</li><li>Birden fazla sebebe sahip olmak ayrıcalık sağlamaz; en üst sebep esas alınır.</li><li><b>Tüm şefîler meşfû' fîhin tamamına talep olmalıdır.</b></li></ul></div>

<h2>5. Şartlar</h2>
<ol>
<li><b>Meşfû' bih ve fîhin ikisinin de akar olması.</b> Zâhirî ve Mâlikîler dışındaki çoğunluğa aittir; onlar menkullerde de olur der.</li>
<li><b>Meşfû' fîhin malikin elinden mali bir bedelle kesin çıkmış olması.</b>
<ul><li>Fasit ve hıyâr-ı şartlı (satıcı muhayyer) akitlerde şuf'a doğmaz. Feshin imkânsızlaştığı fasit akitlerde şuf'a, belirlenen bedel değil akarın kıymeti üzerinden verilir.</li><li>Vakıf, hibe, miras gibi bedelsiz yollarda olmaz. İmam Malik ve İbn Ebî Leylâ'ya göre miras dışında şuf'a olur.</li><li>Malik, İbn Ebî Leylâ ve Şâfiî dışındakilere göre mehir, muhâlaa bedeli, işçilik gibi temliklerde şuf'a kabul edilmez.</li></ul></li>
<li><b>Şuf'a tamamlanıncaya kadar meşfû' bihin şuf'adarın mülkünde kalması.</b> Şuf'a talep ettikten sonra kişi vefat ederse: <b>Hanefîlere göre</b> mirasçılarının şuf'a hakkı yoktur; <b>cumhura göre</b> vardır.</li>
<li><b>Şuf'adarın satış işlemine razı olmamış olması;</b> yanlış bilgilendirilmemiş olması gerekir. Satıcının vekili olması veya bedele kefil olması rıza sayılır.</li>
</ol>
<p class="muted">Vakıf arazisinin satışında ne mütevelli ne vakıf lehtarları için şuf'a doğar; çünkü malik değildirler.</p>
<div class="box note"><b>Şuf'adar birden fazla olup biri yalnız kendi hissesi oranında talepte bulunursa:</b> Ebû Yûsuf'a göre şuf'a hakkı devam eder, tekrar meşfû' fîhin tamamına talepte bulunması gerekir. İmam Muhammed, Ahmed b. Hanbel ve bazı Şâfiîlere göre hak düşer. <b>Meşfû' fîh iki ayrı ev gibi müteaddit akar ise</b> Ebû Hanîfe ve İmameyn'e göre hak sabittir, ikisini de talep etmesi gerekir; İmam Züfer'e göre sadece bir ev için talepte bulunulabilir.</div>

<h2>6. Talep Aşamaları</h2>
<table class="t">
<tr><th>Talep</th><th>Açıklama</th><th>Süre</th></tr>
<tr><td><b>1. Talebü'l-müvâsebe</b> <span class="ar">طلب المواثبة</span></td><td>Şuf'adar satışı duyduğu mecliste meşfû' fîhi almak istediğini söyler. Doğru bilgilendirilmediyse doğru bilgiyi aldığı anda kullanabilir. <span class="ar">الشفعة لمن واثبها</span></td><td>Süre sınırı yok (öğrenildiği meclis)</td></tr>
<tr><td><b>2. Talebü't-takrîr / işhâd</b> <span class="ar">طلب التقرير والإشهاد</span></td><td>İlk talepten sonra ikinci kez müşterinin, ya da akar henüz satıcıdaysa satıcının yanında şuf'a talebi. Bazı fakihler şahit tutmayı gerekli, bazıları müstehap görür.</td><td>Süre sınırı yok (gerekli süre içinde)</td></tr>
<tr><td><b>3. Talebü'l-husûme</b> <span class="ar">طلب الخصومة</span></td><td>İlk iki aşamada hakkını alamazsa mahkemeye başvurur; dava müşteriye karşı açılır, mal satıcıdaysa o da davaya dahil olur.</td><td><b>Ebû Hanîfe:</b> süre sınırı yok. <b>Ebû Yûsuf:</b> ilk fırsatta. <b>Muhammed ve Züfer:</b> takrirden sonra bir ay içinde.</td></tr>
</table>

<h2>7. Şuf'adarın Ödeme Şekli</h2>
<ul><li><b>Genel ilke:</b> Şuf'adar müşterinin ödediği bedelin aynısını öder (mislî ise misli, kıyemî ise kıymeti).</li><li><b>Cumhura göre</b> taksitse taksit, peşinse peşin öder (imkânı yoksa kefil gösterir).</li><li><b>Ebû Hanîfe'ye göre</b> dilerse taksiti kabul eder, dilerse peşin alır.</li><li><b>Ebû Hanîfe'ye göre</b> şuf'adar müşteriye yapılan indirimden faydalanır, sonradan yapılan artıştan etkilenmez.</li><li><b>Şâfiî ve Hanbelîlere göre</b> ne indirim ne artıştan etkilenir (indirim ibra, artırım hibe sayılır).</li></ul>

<h2>8. Müşterinin Tasarrufları</h2>
<p>Müşterinin satım, hibe, vakıf gibi hukuki işlemleri, şuf'adar akarı mahkeme yoluyla aldığında iptal olur.</p>
<div class="grid2">
<div class="card-s"><h4>Değerini artıran fiiller</h4><ul><li><b>Ayrılması mümkün değilse</b> şuf'adar tarafından tazmin edilir.</li><li><b>Geçici süreyle araziyi işgal ediyorsa</b> (ekin): Hanefîler – müşteri emsal kira bedeli öder; Hanbelîler – kira ödemesine gerek yoktur.</li><li><b>Bina, ağaç gibi uzun süreli işgal ise:</b> Ebû Hanîfe – kaldırılması araziye zarar vermiyorsa şuf'adar ister bedelini öder satın alır, ister kaldırtır. Cumhur – ya şuf'adan vazgeçer, ya bina ve ağacın bedelini öder, ya da kaldırır ve değer kaybını tazmin eder.</li></ul><p class="muted">Şuf'a talebinden sonra yapılan tasarruflar hiçbir şekilde tazmin edilmez; müşteri gasıp sayılır.</p></div>
<div class="card-s"><h4>Değerini azaltan fiiller</h4><ul><li><b>Müşterinin müdahalesi olmaksızın meydana gelen düşüş:</b> Ebû Yûsuf, Sevrî ve Ahmed b. Hanbel – semenden düşülür, yeni fiyat belirlenir. Diğer fakihler – şuf'adar değer düşüşünden yararlanamaz.</li><li><b>Müşterinin fiili sonucu meydana gelen düşüş:</b> İttifakla semene yansıtılır.</li></ul></div>
</div>

<h2>9. Şuf'a Hakkını Düşüren Sebepler</h2>
<ol>
<li>Şuf'a hakkından vazgeçmek (satıştan <b>sonra</b>; satıştan önceki vazgeçme hakkı düşürmez – Zâhirîler aksi görüştedir). Bedel karşılığı sulh da dolaylı vazgeçmedir.</li>
<li>Başka şuf'adar lehine vazgeçmek.</li>
<li>Şuf'adarın müşteriye razı olması (onunla pazarlık yapmak gibi).</li>
<li>Talep aşamalarını zamanına uygun olarak uygulamamak.</li>
<li>Şuf'a sonuçlanmadan önce meşfû' bihin şefînin elinden çıkması.</li>
<li>Şuf'adarın ölümü (cumhura göre devam eder).</li>
<li>Meşfû' fîhin bir kısmını talep etmek.</li>
</ol>
`,

UNITS.push({
id:'u12', no:12, title:'Akit: Tasarruf, Rükün ve İrade Beyanı', ar:'العقد: التصرف والأركان والصيغة',
lead:'Tasarrufun çeşitlerini, akdin tanımını ve rüknünü, irade beyan araçlarını, icap ve kabulün şartlarını, iç ve dış irade uyuşmazlıklarını, akit meclisini, akdin konusunu ve taraflarını öğreneceğiz.',
html:`
<h2>1. Tasarruf <span class="ar">التصرف</span></h2>
<p>Kişinin iradî olarak yaptığı, Şâri tarafından hukuki sonuçlar bağladığı her şey. İki kısımdır:</p>
<div class="grid2">
<div class="card-s"><h4>Fiilî tasarruf</h4><p>Maddi bir fiille yapılan: gasp, itlaf, (teslimle tamamlanan) sadaka.</p></div>
<div class="card-s"><h4>Sözlü tasarruf</h4><p>Şâri tarafından hukuki sonuç bağlanan her türlü söz.</p></div>
</div>
<table class="t"><tr><th colspan="2">Sözlü tasarruf çeşitleri</th></tr>
<tr><td><b>Çift taraflı</b></td><td>Satım, kira gibi iki tarafın sözlü beyanıyla kurulan ve şer'î sonuç doğuran tasarruflar.</td></tr>
<tr><td><b>Tek taraflı</b></td><td>Bir hakkın inşasına, sona erdirilmesine veya ıskatına sebep olan: vakıf, talak, ibrâ, şuf'adan vazgeçme, ıtak, vasiyet.</td></tr>
<tr><td><b>Bir hakkın inşa veya ıskatına yönelmeyen, Şâriin hüküm bağladığı tek taraflı</b></td><td>Dava, ikrar, yemin, kazf. İkrar yeni hak doğurmaz, var olanı haber verir; kazf hak doğurmaz ama cezai sonucu vardır.</td></tr>
</table>
<p class="muted">Mahiyetleri bakımından tasarruflar: temlîkât (satım, icâre), teberruât (hibe, âriye), iltizâmât (kefalet, rehin), ıtlâkât (vekâlet), takyîdât (vekili azil, hacr), ıskâtât (talak, ıtak). Her akit bir tasarruftur; her tasarruf akit değildir.</p>

<h2>2. Akit <span class="ar">العقد</span></h2>
<div class="box key">Konusu üzerinde şer'î sonuçlar doğuracak şekilde icap ve kabulün birbirine bağlanması. <span class="ar">ارتباط الإيجاب بالقبول على وجه مشروع يثبت أثره في محله</span></div>
<table class="t"><tr><td><b>Âkid</b></td><td>İcap ve kabulün taraflarından biri</td></tr><tr><td><b>Mûcib</b></td><td>İcap eden kişi</td></tr><tr><td><b>Kâbil</b></td><td>Kabul eden kişi</td></tr><tr><td><b>Ma'kûdün aleyh</b></td><td>Akde konu olan şey</td></tr><tr><td><b>İltizam</b></td><td>Bir kişinin bir başkasına karşı bir fiilde bulunmak veya kaçınmak şeklinde mükellef olması (edim)</td></tr></table>
<h3>Rükün ve in'ikad</h3>
<div class="grid2">
<div class="card-s"><h4>Hanefîler</h4><p>Rükün <b>icap ve kabul</b>, yani irade beyanı anlamında sîgadır. Cumhurun rükün diye saydığı diğer maddeler irade beyanının <b>levâzımı</b>dır.</p></div>
<div class="card-s"><h4>Cumhur</h4><ol><li>İrade beyanı</li><li>Akit meclisi</li><li>Taraflar</li><li>Akdin konusu</li></ol><p class="muted">Günümüz öğretiminde pratik yararı için çoğunluğun yaklaşımı izlenir.</p></div>
</div>

<h2>3. İrade Beyan Araçları</h2>
<table class="t">
<tr><th>Araç</th><th>Hükümler</th></tr>
<tr><td><b>1. Sözlü</b></td><td>Sözlü beyan anlaşılır olmalıdır; dil farkı önemli değildir. Şâfiîlere göre nikâh akdinde Arapça veya başka dildeki "nikâh-zevâc" gibi lafızlar kullanılmalıdır (çoğunluk bu şartı aramaz). Kip kural olarak <b>mazi</b>dir (lafzen haber, manen inşa); örf veya karine varsa muzari ve emir de olur.</td></tr>
<tr><td><b>2. Yazılı</b></td><td>Yazılı beyan sözlü beyan hükmündedir. Cumhura göre taraflar yan yanaysa yazılı beyan muteber değildir. Günümüz ulemasına göre yazılı beyan sözlüden daha kuvvetlidir. Nikâhta, konuşabilen ve mecliste hazır taraflar için tek başına yazı yetmez.</td></tr>
<tr><td><b>3. İşaret</b></td><td>Sözlü beyanda bulunamayanlar içindir. Konuşabilen kişinin işareti çoğunluğa göre geçersizdir (Mâlikî hariç). Yazabilen dilsizin yalnız işaretle beyanı tartışmalıdır.</td></tr>
<tr><td><b>4. Fiilî</b></td><td><b>Muâtât / teâtî</b> denir. Şâfiîlere göre geçerli değildir. Hanbelî ve Mâlikîlere göre mutlak olarak geçerlidir (râcih). Zeydîlere göre örfe bağlıdır.</td></tr>
<tr><td><b>5. Sükûtî</b></td><td>Kural olarak irade beyanı değildir; zorunlu hallerde onay sayılır: evlilik tecrübesi olmayan kızın susması, vakıf lehtarının susması.</td></tr>
</table>

<h2>4. İcap ve Kabulün Tek Kişiyle Temsil Edilmesi</h2>
<p>Vekâlet, velayet, vesayet ve risâlet yoluyla gerçekleşen işlemlerde ilk üçünde <b>akdin hukuku temsilciyi</b>, <b>akdin hükmü asîli</b> bağlar. Risâlette temsilcinin (elçinin) sorumluluğu yoktur.</p>
<table class="t"><tr><td><b>İmam Şâfiî</b></td><td>Dedenin iki torununu evlendirmesi dışında kabul etmez.</td></tr><tr><td><b>Hanbelîler</b></td><td>Nikâh dahil her türlü akit için geçerlidir.</td></tr><tr><td><b>Hanefîler</b></td><td>Malî işlemler dışında geçerlidir (nikâhta vekil risâlet hükmündedir; babanın çocuğunun malını kendine satması istisnadır). İmam Züfer kabul etmez.</td></tr></table>

<h2>5. Sîga (İrade Beyanı) ve Şartları</h2>
<p><b>İcap ve kabulün geçerli olmasının 5 şartı:</b></p>
<ol><li>Akdin kuruluşuna yönelik geçerli irade açıklaması (maksadı kapalı sözlerle akit kurulmaz).</li><li>İcap ve kabul irade beyanı ehliyetine sahip kimselerden (mümeyyiz veya akıllı ergen) sadır olmalı.</li><li>Birbirine uygun olmalı.</li><li>Taraflarca anlaşılır olmalı.</li><li>Akit meclisi içinde olmalı.</li></ol>
<p><b>İç irade</b> <span class="ar">الإرادة الباطنة</span>: İç dünyadaki yönelme hali; akdin kurucu unsuru değildir. <b>Dış irade</b> <span class="ar">الإرادة الظاهرة</span>: İcap ve kabulün sadır olduğu irade. <b>Not:</b> Akdin inşası için iki iradenin mutabık olması gerekir.</p>
<h3>İç irade ile dış iradenin uyuşmadığı yerler</h3>
<table class="t">
<tr><th>Hal</th><th>Hüküm</th></tr>
<tr><td>1. Uyuyan, deli, gayr-ı mümeyyiz gibi kasta mukarin olmayan beyanlar</td><td>Geçersiz.</td></tr>
<tr><td>2. Sarhoşun irade açıklamaları</td><td>Mübah yolla sarhoşluk: geçersiz. Haram yolla: Hanefîlere göre bilerek içtiyse evlenme, boşanma, ıtak gibi beyanlar geçerlidir (yaptırım olarak). Diğer görüş geçersiz sayar; Zeydan bunu tercih eder.</td></tr>
<tr><td>3. Anlamını bilmeden icap mahiyetinde söz (yabancı dilde telkin)</td><td>Geçersiz.</td></tr>
<tr><td>4. Anlamının farkında olup akit inşası kastetmeden (ezber, öğrenme)</td><td>Geçersiz.</td></tr>
<tr><td>5. Hataen yapılan beyan ("sen hoşsun" yerine "sen boşsun")</td><td>Geçersiz.</td></tr>
<tr><td>6. <b>Hezil</b> (şaka)</td><td>Hadisten yola çıkarak nikâh, talak, ıtak, ric'at gibi tasarruflar geçerlidir (Allah hakkı); kul hakkı taalluk eden diğer tasarruflar geçersizdir (tercih edilen). Diğer görüş hepsini geçerli sayar.</td></tr>
<tr><td>7. <b>İkrah</b> altındaki iradeler</td><td>Hanefîlere göre mülcî veya gayr-ı mülcî olsun nikâh, talak, ıtak gibilerde geçerli; alım-satım gibi akitler fasittir, sonra onaylanırsa geçerli olur. Cumhura göre geçersiz.</td></tr>
<tr><td>8. Belli bir akdi ifade eden lafızla başka akdi kastetmek ("Bu aracımı sana yirmi bin TL karşılığında hibe ettim")</td><td>Karinelerle teyit edilirse kastedilen akit (satım) kurulur.</td></tr>
<tr><td>9. Meşru olmayan bir amaca araç olacak şekilde geçerli işlem (şarap üreticisine üzüm, teröriste silah satmak)</td><td>Hanefî ve Şâfiîlere göre geçerlidir (dış irade esas). Fakat iç irade ortaya çıktıysa (kesin şarap yapacağını biliyorsa) caiz değildir. Diğer içtihat karinelerle teyit edilen iç iradeyi esas alır; tercih budur.</td></tr>
</table>

<h2>6. Akit Meclisi <span class="ar">مجلس العقد</span></h2>
<p><b>Meclis:</b> Hazırda âkidlerin bulunduğu yer; gaipte mektubun açıldığı (okunduğu) yer. İcapla başlar, taraflardan birinin akitten vazgeçme anlamına gelen bir hali sadır olana kadar sürer. Akit meclisi kavramı, icap ile kabulü birbirine bağlamak ve tarafların düşünme ihtiyacını (harac) karşılamak için geliştirilmiştir.</p>
<table class="t">
<tr><th>Hanefîler</th><td>Söz veya beden birliğidir (esas olan konu birliği). İcaptan sonra meclisin bozulduğuna delalet eden bir şey olmadıkça meclis devam eder. İcabın fevren gelmesi gerekmez. Meclis değil <b>kabul muhayyerliği</b> vardır.</td></tr>
<tr><th>Şâfiîler</th><td>Beden birliğidir. İcabın fevren gelmesi gerekir. <b>Hıyâr-ı meclis</b> vardır: kabulden sonra meclis dağılana kadar feshedilebilir.</td></tr>
<tr><th>Cumhur</th><td>Malı satan bâyi, kabulden önce icabından dönebilir: <b>hıyâr-ı rücû</b>. Mâlikîler hem bunu hem meclis muhayyerliğini kabul etmez; onlara göre mûcib icabıyla bağlıdır.</td></tr>
</table>
<p class="muted">Vasiyet, vekâlet gibi akitler meclis birliğini kabul etmez (meclis birliği aranmaz). İcaptan sonra mûcib ehliyetini kaybederse icap batıl olur. Günümüzde dijital ortamlar konu birliği anlamında akit meclisi sayılır.</p>

<h2>7. Akdin Konusu <span class="ar">محل العقد</span></h2>
<p>Akdin üzerinde gerçekleştiği, sonucunun ve hükümlerinin kendisine bağlandığı şey: mal, menfaat, hizmet, teminat, temsil, ortaklık. <b>Üç şart:</b></p>
<ol>
<li><b>Akit anında mevcut, memlûk ve mütekavvim olmak.</b>
<ul><li>Çoğunluğa göre ma'dûmun satışı caiz değildir; varlığında aşırı garar bulunanlar da (karındaki yavru, memedeki süt) satılamaz. Selem ve icâre ihtiyaç sebebiyle istisnadır.</li><li>Mâlikîler mevsimlik ürünün satışına cevaz verir (karpuz, kavun, biber); teberrularda gelecekteki mal da konu olabilir.</li><li><b>İbn Teymiyye</b> teslimi göz önüne alarak mevcut ve memlûk olmayan malların da satışını caiz görür; şu anki piyasa bu fetvaya göre işler. Zeydan da bu görüşü tercih eder.</li><li>Kamuya tahsisli yol, köprü, park memlûk olmadığından satılamaz.</li></ul></li>
<li><b>Akdin konusu malum ve teslimi mümkün (makdûru't-teslim) olacak.</b>
<ul><li>Cins, tür ve vasıftaki fâhiş cehalet akde engeldir (mutlak olarak "bir otomobil" satmak). Örfte müsamaha gösterilen <b>cehalet-i yesîre</b> akde etki etmez.</li><li>Hanefî ve Mâlikîlere göre teberru işlemlerinde fâhiş de yesîr de olsa cehalet akde engel değildir; Şâfiîlere göre engeldir.</li><li>Teslimin imkânsızlığı akdi batıl, teslimin zarar içermesi Hanefîlere göre fasit yapar (evin kirişini satmak). Mâlikîlere göre teberrularda teslim şartı aranmaz.</li></ul></li>
<li><b>Akdin mahalli akdin hükmüne elverişli olacak.</b> Çabuk bozulan mal rehne konu olamaz; meyte satılamaz; mahremlerle evlenilemez.</li>
</ol>

<h2>8. Taraflar (Âkidler)</h2>
<p>Âkidlerde aranan şartlar eda ehliyetiyle ilişkilidir:</p>
<ol><li><b>Akıl / temyiz</b></li><li><b>Sayı</b> (tek kişinin iki tarafı temsili meselesi)</li><li><b>Ergenlik:</b> Teberru işlemlerinde ittifakla aranır; Hanefîye göre bedelli işlemlerde akdin sıhhati için değil <b>nefâzı</b> için aranır.</li></ol>
`,
quiz:[
{q:'"Dava, ikrar, yemin, kazf" hangi tür sözlü tasarruftur?',o:['Çift taraflı','Bir hakkı inşa veya ıskat eden tek taraflı','Hak inşa veya ıskatına yönelmeyen, Şâriin hüküm bağladığı tek taraflı','Fiilî'],a:2,e:'Vakıf, talak, ibrâ ise hak inşa veya ıskat eden tek taraflı tasarruflardır.'},

{q:'"Bu aracımı sana yirmi bin TL karşılığında hibe ettim" denirse hangi akit kurulur?',o:['Hibe','Satım (karinelerle teyit edilirse)','Âriyet','Akit kurulmaz'],a:1,e:'Belli bir akdin lafzıyla başka akit kastedilmesi halinde kastedilen akit kurulur.'},

]});

UNITS.push({
id:'u13', no:13, title:'Ehliyet ve Ehliyet Arızaları', ar:'الأهلية وعوارضها',
lead:'Vücub ve eda ehliyetini, insanın doğumdan rüşde kadar geçirdiği evreleri, semâvî ve iktisâbî ehliyet arızalarını (delilik, ateh, uyku, ölüm hastalığı, sefeh, sarhoşluk) öğreneceğiz.',
html:`
<h2>1. Ehliyet <span class="ar">الأهلية</span></h2>
<p>Kişinin hak ve mükellefiyetlerin sübutuna, hak talep etmeye, borçlara muhatap olmaya ve sözleşme yapabilmeye elverişli olması.</p>
<div class="grid2">
<div class="card-s"><h4>Vücub ehliyeti <span class="ar">أهلية الوجوب</span></h4><p>Kişinin bir takım hak ve mükellefiyetlerin sübutuna elverişli olmasıdır; <b>zimmetin sübutu</b> ile ilgilidir. Temeli hayattır (hukukî kişilik).</p>
<ul><li><b>Nâkıs:</b> Canlı doğmak şartıyla ceninin anne karnındaki aşaması. Miras, vasiyet, vakfın gallesinde istihkak gibi kabule ihtiyaç duymayan haklar sabittir.</li><li><b>Tam:</b> Canlı doğum ile ölüm arasındaki dönem.</li></ul></div>
<div class="card-s"><h4>Eda ehliyeti <span class="ar">أهلية الأداء</span></h4><p>Kişinin hak talep etmeye, borçlara muhatap olmaya ve sözleşme yapabilmeye elverişli olmasıdır. Eda ehliyetinin esası <b>akıl ve temyiz</b>dir.</p></div>
</div>
<p><b>Zimmet</b> <span class="ar">الذمة</span>: İnsanın hak ve borçlarının varlık zemini; hukukun insanın şahsiyetinde varsaydığı takdirî ve hükmî varlık.</p>

<h2>2. Eda Ehliyeti Bakımından Evreler</h2>
<table class="t">
<tr><th>Evre</th><th>Ehliyet</th><th>Hükümler</th></tr>
<tr><td><b>Cenin dönemi</b></td><td>Nâkıs vücub; eda yok</td><td>Kabul gerektirmeyen haklar sabit olur.</td></tr>
<tr><td><b>Doğum – temyiz</b> (yaklaşık 7 yaş)</td><td>Tam vücub; eda yok</td><td>Hukuki kişilik tamdır. Kendi başına lehine de olsa hiçbir tasarrufta bulunamaz; temsilcisi onun adına hibe ve sadaka kabul edebilir. Cezai ehliyeti yoktur; verdiği zararı (velisi aracılığıyla) malından tazmin eder. Ebû Hanîfe'ye göre malından zekât alınmaz.</td></tr>
<tr><td><b>Temyiz – ergenlik</b> (sabiyy-i mümeyyiz)</td><td>Eksik eda</td><td>Tasarrufları üçe ayrılır (aşağıda). İbadet ehliyeti tartışmalıdır. Had ve kısas bakımından cezai ehliyeti yoktur; ta'zir ve mali suçlar bakımından vardır.</td></tr>
<tr><td><b>Ergenlik ve rüşt</b></td><td>Tam eda</td><td>Aklı tam gelişmediyse mallar rüşde kadar bekletilir. Hanefîye göre bekletme yaşı <b>25</b>'tir; bu süreçte mümeyyiz çocuk gibidir. Diğer fakihlere göre 25'ten sonra rüşde ulaşmadıysa bile mallar teslim edilmez.</td></tr>
</table>
<div class="box key"><b>Mümeyyiz çocuğun tasarrufları</b>
<ol><li><b>Tamamen yararına olanlar</b> (hibe kabulü): kendi fiilleri geçerlidir, izne gerek yoktur.</li>
<li><b>Tamamen zararına olanlar</b> (malını hibe etmek, talak): hem kendisinin hem velisinin fiilleri geçersizdir.</li>
<li><b>Yarar ve zarara ihtimalli olanlar</b> (satım, icâre): velisi veya veli izni ile kendisi yaparsa geçerlidir; izin yoksa <b>mevkuf</b>tur.</li></ol></div>
<p class="muted">Temyiz yedi yaşında başlar; ergenlik belirtileri yoksa on beş yaşını doldurmakla sona erer.</p>

<h2>3. Ehliyet Arızaları <span class="ar">عوارض الأهلية</span></h2>
<p>Reşit olarak ergen olan kişi kural olarak tam eda ehliyetine sahiptir; ancak bazı durumlar bunu kısmen veya tamamen ortadan kaldırır. İkiye ayrılır:</p>
<div class="grid2">
<div class="card-s"><h4>Semâvî arızalar <span class="ar">العوارض السماوية</span></h4><p>Meydana gelmesinde kişinin rolü olmayan: delilik, ateh, uyku ve baygınlık, ölüm hastalığı.</p></div>
<div class="card-s"><h4>İktisâbî arızalar <span class="ar">العوارض المكتسبة</span></h4><p>Kişinin rolü olan: (a) kendisinden kaynaklanan: sefeh, sarhoşluk, hezl; (b) başkasından kaynaklanan: ikrah.</p></div>
</div>

<h3>a) Delilik <span class="ar">الجنون</span></h3>
<ul><li><b>Aslî delilik:</b> Deli olarak ergen olmak. <b>Târî delilik:</b> Sonradan meydana gelen.</li><li>Vücub ehliyetini etkilemez; ancak temyizi kaldırdığı için delinin eda ehliyeti yoktur, <b>gayr-ı mümeyyiz çocuk hükmündedir</b>; tamamen yararına olsa da işlemleri geçersizdir, velinin sonradan onayı hüküm ifade etmez.</li><li><b>Doğrudan hacr sebebidir</b>; yargı kararı aranmaz.</li><li>Belli aralarla kendine geliyorsa bu aralarda eda ehliyeti vardır.</li></ul>
<h3>b) Ateh (bunama) <span class="ar">العته</span></h3>
<p>Kişiyi anlayışı kıt, sözleri karışık ve işleri bozuk hale getiren akıl kusuru.</p>
<ul><li><b>1. kısım</b> (temyizi tamamen kaldıran): gayr-ı mümeyyiz çocuk / deli hükmünde.</li><li><b>2. kısım</b> (temyizi kaldırmayan ama ergen akıllı düzeyinin altına düşüren): <b>mümeyyiz çocuk</b> hükmünde; nâfiz-batıl-mevkuf ayrımı geçerlidir.</li><li>Her türlü itlaf ve tazminden sorumludur.</li></ul>
<h3>c) Uyku ve baygınlık</h3>
<p>Genel ilke: Temyiz kalktığı için eda ehliyeti yoktur. İbadetlerde Hanefî ve Mâlikîlere göre bayılma bir gün bir geceyi aşmazsa kaza gerekir (bu kısım usul derslerinin konusudur).</p>
<h3>d) Ölüm hastalığı <span class="ar">مرض الموت</span></h3>
<p>Genellikle ölüme yol açan ve fiilen ölümle sonuçlanan hastalık; kaynağının kişinin kendisi veya başkası olması fark etmez. Kısasla öldürülecek kişi, batmak üzere olan gemideki yolcu da bu hükümdedir. Eda ehliyetini sakatlamaz; bazı tasarrufların hükmünü etkiler. Ölüm gerçekleşmeden anlaşılamadığı için <b>hüküm geriye doğru işler</b>.</p>
<table class="t">
<tr><th>Kimin hakkı</th><th>Hüküm</th></tr>
<tr><td><b>Alacak hakları</b></td><td>Borçları malvarlığına tam karşılık geliyor veya aşıyorsa tamamen mahcurdur; aşmıyorsa borca olumsuz etki edeceği oranda mahcurdur.</td></tr>
<tr><td><b>Varis hakları</b></td><td>Terekenin üçte birini aşan oranda mahcurdur.</td></tr>
<tr><td><b>Evlilik</b></td><td>Çoğunluk fakihe göre nikâh sahihtir ve miras sabittir. Mehr-i misli aşan mehir alacaklı veya varisin onayına bağlıdır (mevkuf). İmam Evzâî: nikâh sahih, miras yok. İmam Malik: nikâh fasit, miras yok.</td></tr>
<tr><td><b>Boşama (talak)</b></td><td>Birliktelik yaşadığı karısını bain talakla boşarsa talak ittifakla geçerlidir. Kadının mirası: (1) çoğunluğa göre devam eder; (2) Hanefîlere göre ölüm iddet içinde gerçekleşirse; (3) Hanbelîlere göre başka bir adamla evleninceye kadar; (4) Mâlikîlere göre mutlak surette vardır. Birliktelik yaşanmadan boşanmışsa miras yoktur (Mâlikîler hariç; Zeydan bu görüştedir).</td></tr>
</table>
<p class="muted">Kendi ihtiyaçları ve nafakasıyla yükümlü olduğu kişiler için yaptığı harcamalar geçerlidir ve itiraza kapalıdır.</p>

<h3>e) Sefeh <span class="ar">السفه</span></h3>
<p>Akli melekeleri yerinde olduğu halde malî tasarruflarında normal aklın ve şeriatın gereğine aykırı davranmak (israf).</p>
<div class="grid2">
<div class="card-s"><h4>Sefih olarak ergen olana malların teslimi</h4><ul><li><b>Zâhirîler hariç çoğunluk:</b> Rüşdü anlaşılmadıkça mallar teslim edilmez (tercih).</li><li><b>Ebû Hanîfe:</b> 25 yaşına kadar teslim edilmez; bu yaştan sonra hükmen reşit sayılır ve teslim edilir. Gerekçe: faydasız te'dib abestir; bu yaşta az da olsa rüşt bulunur, şüphe cezayı düşürür.</li><li><b>Zâhirîler:</b> Akıllı olarak ergen olmak reşit olmak için yeterlidir.</li></ul></div>
<div class="card-s"><h4>Sefihin hacri</h4><ul><li><b>Çoğunluk (İmameyn dahil):</b> Hacr edilebilir; Hz. Ali'nin Hz. Osman'dan Abdullah b. Ca'fer'in hacrini istemesi, zararın izalesi.</li><li><b>Ebû Hanîfe:</b> Sefeh hacr sebebi değildir; sefih mükelleftir, nikâh ve talakı geçerlidir, ikrarlarından sorumludur; hacr insan onuruna aykırıdır. Habbân b. Münkız olayında Peygamber hacr değil muhayyerlik vermiştir.</li></ul></div>
</div>
<p>Hacr edilen sefih <b>mümeyyiz çocuk hükmündedir</b>; ancak vakıf, sadaka, hayır vasiyeti, nikâh, talak gibi tasarrufları geçerlidir (emsal mehri aşan kısım geçersiz). Tercih edilen görüşe göre yargı kararından itibaren kısıtlı sayılır.</p>

<h3>f) Sarhoşluk <span class="ar">السكر</span></h3>
<p>Sarhoş edici madde sebebiyle, ayıldıktan sonra ne söylediğini hatırlayamayacak şekilde aklın zail olması.</p>
<div class="grid2">
<div class="card-s"><h4>Mubah yollarla sarhoş olan</h4><p>Zaruret, ikrah veya bilgisizlikle sarhoş olan ittifakla <b>gayr-ı mümeyyiz çocuk</b> (baygın) hükmündedir; eda ehliyeti ve cezai sorumluluğu yoktur, tazmin mükellefiyeti devam eder.</p></div>
<div class="card-s"><h4>Haram yollarla sarhoş olan</h4><ol><li><b>Bir görüş</b> (Zâhirîler, Ca'ferîler, Osman el-Bettî, Ahmed'den bir rivayet, Hanefîlerden Tahâvî): Eda ehliyeti yoktur, sözlü hiçbir tasarrufu geçerli değildir. <b>Zeydan bu görüştedir.</b></li><li><b>Hanefîler</b> (Şâfiî ve kısmen Mâlikîler de): Talak, ıtak gibi sözlü tasarruflarda eda ehliyeti vardır; ceza olarak geçerli sayılır (murisini öldüren varis gibi).</li></ol></div>
</div>
<div class="box note"><b>Özet tablo:</b> Delilik → eda yok, doğrudan hacr · Ateh → ağırı eda yok, hafifi eksik eda · Uyku-bayılma → eda yok · Ölüm hastalığı → alacaklı ve varis haklarında mevkuf · Sefeh → çoğunluğa göre hacr, mümeyyiz hükmü · Sarhoşluk → mubah yolla eda yok; haram yolla ihtilaflı.</div>

id:'u14', no:14, title:'Velayet, Vekâlet ve Fuzûlî', ar:'الولاية والوكالة والفضولي',
lead:'Velayetin kısımlarını ve sıralamasını, vekâletin rükün, şart, çeşit ve hükümlerini, akdin hükmü ile hukuku ayrımını ve fuzûlînin tasarruflarını öğreneceğiz.',
html:`
<h2>1. Velayet <span class="ar">الولاية</span></h2>
<p>Kişi veya mal üzerinde yapılacak işlemin hukuken geçerliliğini sağlayan yetki. Tasarruflar ancak tam eda ehliyeti ve velayet sayesinde geçerli olur.</p>
<div class="grid2">
<div class="card-s"><h4>Kendi şahsı ve malı üzerindeki velayet</h4><p><b>Velâyet-i kâsıra / zâtiyye</b> <span class="ar">الولاية القاصرة</span>: Ergen, akıllı ve reşit kişiler için sabittir. Ancak başkasına zarar vermesi durumunda bu hak düşer (rehin veren, rehin alanın hapis hakkına zarar verecek işlem yapamaz).</p></div>
<div class="card-s"><h4>Başkasının şahsı ve malı üzerindeki velayet</h4><p><b>Velâyet-i müteaddiye</b> <span class="ar">الولاية المتعدية</span>: Şâri tarafından belirlenmiş arızi bir sebepten dolayı sabit olur.</p></div>
</div>
<table class="t">
<tr><th>Kaynağına göre</th><th>Açıklama</th></tr>
<tr><td><b>Aslî velayet</b> <span class="ar">الولاية الأصلية</span></td><td>Kan bağına bağlı. Hanefîlere göre (nikâh velayetinde) sıra: 1) oğul, 2) baba, 3) erkek kardeş, 4) amca.</td></tr>
<tr><td><b>Temsil (niyâbet) yoluyla velayet</b> <span class="ar">الولاية النيابية</span></td><td>Başka bir şahıstan alınan yetkiyle oluşur: vasinin, vekilin velayeti; devlet başkanının vatandaşlar üzerindeki velayeti.</td></tr>
<tr><td><b>Şer'î velayet</b></td><td>Hâkimin mahcur üzerindeki velayeti; doğrudan şeriattan kaynaklanır.</td></tr>
</table>
<div class="grid2">
<div class="card-s"><h4>Başkasının şahsı üzerindeki velayet</h4><p>Kısaca vesayet; küçüğün bakımı, terbiyesi ve gözetimini içerir (hidâne, evlendirme).</p></div>
<div class="card-s"><h4>Başkasının malı üzerindeki velayet</h4><p>Küçüklük, delilik ve bunaklık gibi ehliyet arızası sebebiyle başkasının malı üzerindeki velayet (mali velayet).</p></div>
</div>
<table class="t"><tr><th>Hanefîler</th><th>Şâfiî</th><th>Mâlikî – Hanbelî</th></tr>
<tr><td>1) Baba<br>2) Babanın vasisi<br>3) Dede<br>4) Dedenin vasisi<br>5) Hâkim/Kadı<br>6) Hâkimin tayin ettiği kayyım</td><td>1) Baba<br>2) Dede<br>3) Bunların vasisi<br>4) Kadı<br>5) Kadının atadığı kayyım</td><td>1) Baba<br>2) Babanın vasisi<br>3) Kadı<br>4) Kadının vasisi</td></tr></table>
<p class="muted">Mali velayette veli güvenilir, malî tasarruflara ehil ve velayet altındakiyle aynı dinden olmalıdır. Velinin yetkisi mümeyyiz küçüğün yetkisiyle aynı mahiyettedir (yarar, zarar, ihtimalli ayrımı). Baba hem şahıs hem mal velayetini birlikte taşıyabilir.</p>

<h2>2. Vekâlet <span class="ar">الوكالة</span></h2>
<p>Kişinin yetkili olduğu ve temsile uygun olan belirli bir tasarrufla ilgili olarak başkasını kendi yerine ikame etmesi.</p>
<ul><li>Rüknü icap ve kabuldür (temsile delalet eden lafızlar).</li><li><b>Meclis birliği şartı aranmaz</b>; icabın kaldırılmamış olması yeterlidir.</li><li>Müvekkil, vekâlet verdiği tasarruf konusunda yetkili olmalıdır (deli, gayr-ı mümeyyiz, izinsiz mümeyyiz vekil tayin edemez).</li><li>Vekil akıl ve temyiz gücüne (eksik de olsa eda ehliyetine) sahip olmalıdır.</li></ul>
<div class="grid2">
<div class="card-s"><h4>Tasarrufta aranan şartlar</h4><ol><li>Vekil tarafından malum olacak (umumi vekâlette aşırı meçhuliyet zarar vermez).</li><li>Müvekkilin yetkisinde olan bir tasarruf olacak.</li><li>Şer'an caiz olacak (gaspa vekâlet olmaz).</li><li>Temsile elverişli olacak (şahitlik, yemin, îlâ, kasâme, liân gibi değil).</li></ol></div>
<div class="card-s"><h4>Kuruluşuna göre</h4><ul><li><b>Müneccez:</b> İcap ve kabul ile başlayan.</li><li><b>Muallak:</b> Belli şarta bağlı ("Irak'a gidersem evimin satışında vekilimsin").</li><li><b>Muzâf:</b> İleri zamana izafe edilmiş ("Gelecek aydan itibaren maaşımın tahsilinde vekilimsin").</li></ul></div>
</div>
<table class="t"><tr><th>Vekâletin çeşitleri</th><th></th></tr>
<tr><td><b>Özel (hâs)</b></td><td>Muayyen bir tasarrufta vekâlet (sadece satım gibi).</td></tr>
<tr><td><b>Umumi (âmm)</b></td><td>Tasarruf sahibi olduğu tüm konularda vekâlet; tartışmalı olmakla birlikte genel eğilim meşru olduğu yönündedir.</td></tr>
<tr><td><b>Mutlak</b></td><td>Miktar ve vasıf belirtilmeden, sınırlandırma olmaksızın ("Evi istediğin paraya sat").</td></tr>
<tr><td><b>Mukayyed</b></td><td>Sınırlandırma içeren ("Evi 100 bine sat").</td></tr></table>

<h3>Akdin hükmü ve hukuku</h3>
<div class="grid2">
<div class="card-s"><h4>Hükmü</h4><p>İn'ikadla amaçlanan temel sonuç: mebîin mülkiyetinin alıcıya, semenin mülkiyetinin satıcıya geçmesi.</p></div>
<div class="card-s"><h4>Hukuku</h4><p>İn'ikad ile doğan ve akdin hükmüne bağlanan haklar, borçlar, yükümlülükler: mebî ve semenin teslimi, mebî veya semenle ilgili sorunların muhatabı olmak.</p></div>
</div>
<div class="box key"><ul><li><b>Nikâh, muhâlaa</b> gibi akitler müvekkile izafe edilir; dolayısıyla <b>hem hüküm hem hukuk müvekkile</b> döner, vekil elçi hükmündedir.</li><li><b>Diğer akitlerde</b> akdin hükmü ittifakla müvekkile bağlıdır; akdin hukuku <b>Hanefîlere göre vekile</b>, <b>Şâfiî ve Hanbelîlere göre müvekkile</b> bağlıdır.</li></ul></div>
<p><b>Vekâletin ücreti:</b> Ücretli olursa icâre hükümleri sabit olur (vekil ecîrdir, vekâlet lazımdır). Ücretsiz ise teberru hükümleri sabit olur (müvekkil zorlayamaz, iki taraf için gayr-ı lazımdır). Anlaşmazlıkta örfe başvurulur.</p>
<p><b>Vekâletin sona ermesi:</b> Feshederse (azil; vekilin haberdar olması şart), vefat ederse, ehliyet ortadan kalkarsa, vekâlete konu olan şey helak olursa veya müvekkil işi kendisi yaparsa vekâlet sona erer; başkasının hakkı taalluk etmemişse.</p>

<h2>3. Fuzûlî <span class="ar">الفضولي</span></h2>
<div class="box key">Velayet, vesayet veya vekâlet gibi herhangi bir yetkisi olmadan başkası hakkında, onun malı veya (evlilik gibi) şahsı üzerinde tasarrufta bulunan kişi.</div>
<ul>
<li>Fuzûlînin yaptığı işlemler asîlin onayına bağlı olarak <b>mevkuf</b>tur; icazetten sonra nâfiz olur. İcazetle fuzûlî işlem anından itibaren vekil hükmünü alır.</li>
<li><b>Satım akdi</b> gibi talike elverişli olmayan işlemlerde onaydan sonra süreç <b>geriye doğru</b> işler.</li>
<li><b>Kefalet, havale, talak</b> gibi işlemlerde onay anından sonra işleme girip süreç <b>ileriye doğru</b> işler.</li>
<li>Akdin hukukunun vekile bağlandığı işlemlerde, icazetten önce fuzûlî veya karşı taraf tek taraflı iradeyle işlemi feshedebilir.</li>
</ul>
<h3>İcazetin geçerliliği için aranan şartlar</h3>
<ol><li>İcazetin, ilgili tasarrufta ehliyeti ve hakkı olan birinden gelmesi (vasisi olan küçüğün malını satan fuzûlîye hâkimin icazeti geçersizdir).</li><li>İcazetin fuzûlî ve onunla işlem yapan hayattayken gelmesi.</li><li>Akdin konusu mevcutken gelmesi.</li></ol>
<div class="box note"><b>Not:</b> Bu hükümler Hanefî ve Mâlikîlere göredir (dayanak: maslahat, ihtiyaç; Urve el-Bârikî'nin bir dinarla iki koyun alıp birini satması hadisi). <b>Şâfiî ve Hanbelîlere göre</b> fuzûlînin tüm tasarrufları geçersiz, batıldır; dayanak vekâlette aranan yetki şartıdır.</div>
`,
